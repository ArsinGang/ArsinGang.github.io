
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروفایل کاربری</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0%, #38205f 0%, transparent 45%),
        linear-gradient(135deg, #090914, #151126, #090914);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .profile-card {
      background: rgba(22, 19, 40, 0.94);
      border: 1px solid rgba(165, 110, 255, 0.3);
      border-radius: 25px;
      padding: 30px 24px;
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #5425c9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      border: 4px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 30px rgba(168,85,247,0.3);
    }

    h1 {
      font-size: 25px;
      margin-bottom: 9px;
      overflow-wrap: anywhere;
    }

    .subtitle {
      color: #aaa2bd;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .info-box {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 19px;
      margin-top: 14px;
      text-align: right;
    }

    .info-label {
      color: #aaa2bd;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .info-value {
      font-size: 23px;
      font-weight: bold;
      color: #fff;
      overflow-wrap: anywhere;
    }

    .coin {
      color: #ffd45c;
    }

    .rank {
      color: #c084fc;
    }

    .home-button {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border-radius: 13px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      background: linear-gradient(135deg, #9333ea, #6326c7);
      transition: 0.2s;
    }

    .home-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(147,51,234,0.3);
    }

    .status {
      color: #b9a9d8;
      font-size: 13px;
      margin-top: 18px;
      min-height: 20px;
    }

    .error {
      color: #ff7777;
    }

    .loading {
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="profile-card">
      <div class="avatar">👤</div>

      <h1 id="username">در حال بارگذاری...</h1>
      <p class="subtitle">پروفایل کاربری</p>

      <div class="info-box">
        <div class="info-label">موجودی Gang Coin</div>
        <div class="info-value coin" id="balance">...</div>
      </div>

      <div class="info-box">
        <div class="info-label">رنک شما</div>
        <div class="info-value rank" id="rank">...</div>
      </div>

      <div class="info-box" id="expiryBox" hidden>
        <div class="info-label">تاریخ پایان رنک شما</div>
        <div class="info-value" id="expiry" style="font-size:16px">-</div>
      </div>

      <a href="/" class="home-button">بازگشت به صفحه اصلی</a>

      <div class="status" id="status">در حال دریافت اطلاعات حساب...</div>
    </section>
  </main>

<script>
const SUPABASE_URL = "https://lhddjuomukejpvssyhuv.supabase.co";
const SUPABASE_KEY = "sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";

let accessToken = localStorage.getItem("arsin_user_token");
let refreshToken = localStorage.getItem("arsin_user_refresh");

const statusElement = document.getElementById("status");

async function refreshSession() {
  if (!refreshToken) {
    throw new Error("لطفاً ابتدا وارد حساب خود شوید.");
  }

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },
      body: JSON.stringify({
        refresh_token: refreshToken
      })
    }
  );

  const data = await response.json();

  if (!response.ok || !data.access_token) {
    throw new Error("نشست شما منقضی شده است. دوباره وارد شوید.");
  }

  accessToken = data.access_token;
  refreshToken = data.refresh_token;

  localStorage.setItem("arsin_user_token", accessToken);
  localStorage.setItem("arsin_user_refresh", refreshToken);
}

async function supabaseRequest(path, options = {}) {
  const response = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + accessToken,
      ...(options.headers || {})
    }
  });

  if (response.status === 401) {
    await refreshSession();

    return fetch(SUPABASE_URL + path, {
      ...options,
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken,
        ...(options.headers || {})
      }
    });
  }

  return response;
}

async function loadProfile() {
  try {
    if (!accessToken) {
      await refreshSession();
    }

    // دریافت اطلاعات کاربر
    const userResponse = await supabaseRequest("/auth/v1/user");

    if (!userResponse.ok) {
      throw new Error("دریافت اطلاعات کاربر ناموفق بود.");
    }

    const user = await userResponse.json();

    const username =
      user.user_metadata?.username ||
      user.user_metadata?.name ||
      user.email?.split("@")[0] ||
      "کاربر";

    document.getElementById("username").textContent = username;

    // دریافت موجودی و رتبه حساب فعلی
    const accountResponse = await supabaseRequest(
      "/rest/v1/rpc/get_my_gang_account",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: "{}"
      }
    );

    if (!accountResponse.ok) {
      throw new Error("دریافت اطلاعات حساب ناموفق بود.");
    }

    const result = await accountResponse.json();

    const account = Array.isArray(result)
      ? result[0]
      : result;

    if (!account) {
      throw new Error("اطلاعات حساب پیدا نشد.");
    }

    const coins = Number(account.gang_coins);

    if (!Number.isFinite(coins)) {
      throw new Error("موجودی حساب معتبر نیست.");
    }

    document.getElementById("balance").textContent =
      coins.toLocaleString("en-US");

    const rankNames = {
      none: "بدون رتبه",
      member: "عضو",
      vip: "VIP",
      premium: "Premium",
      moderator: "مدیر",
      admin: "ادمین"
    };

    const rank = account.rank || "none";

    document.getElementById("rank").textContent =
      rankNames[rank.toLowerCase()] || rank;

    if (account.rank_expires_at) {
      const expiryDate = new Date(account.rank_expires_at);

      if (!Number.isNaN(expiryDate.getTime())) {
        document.getElementById("expiry").textContent =
          expiryDate.toLocaleDateString("fa-IR");

        document.getElementById("expiryBox").hidden = false;
      }
    }

    statusElement.textContent = "اطلاعات حساب با موفقیت دریافت شد.";
    statusElement.classList.remove("error");

  } catch (error) {
    console.error(error);

    statusElement.textContent = error.message;
    statusElement.classList.add("error");

    if (
      !accessToken ||
      error.message.includes("دوباره وارد شوید") ||
      error.message.includes("وارد حساب")
    ) {
      setTimeout(() => {
        location.href = "/login/";
      }, 1500);
    }
  }
}

loadProfile();
</script>
</body>
</html>

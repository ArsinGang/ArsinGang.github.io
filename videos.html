<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Videos | ArsinGang</title>
<meta name="description" content="ویدیوهای ArsinGang">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237b2cff'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-size='42' font-family='Arial' font-weight='900' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 15%,rgba(123,44,255,.18),transparent 35%),
        radial-gradient(circle at 85% 85%,rgba(0,217,255,.12),transparent 35%),
        #080812;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    right:-180px;
    top:-180px;
    background:#7b2cff;
    opacity:.08;
    filter:blur(120px);
    border-radius:50%;
    pointer-events:none;
}

.container{
    width:min(1000px,92%);
    margin:auto;
    padding:35px 0 60px;
}

.back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#fff;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    padding:11px 18px;
    border-radius:12px;
    transition:.25s;
    margin-bottom:28px;
}

.back:hover{
    border-color:#7b2cff;
    box-shadow:0 0 20px rgba(123,44,255,.25);
    transform:translateY(-2px);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 18px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    font-weight:900;
    background:linear-gradient(135deg,#7b2cff,#00d9ff);
    box-shadow:
        0 0 25px rgba(123,44,255,.4),
        0 0 45px rgba(0,217,255,.12);
}

.header h1{
    font-size:32px;
    margin-bottom:10px;
}

.header p{
    color:#aaa;
    font-size:15px;
}

.video-box{
    background:rgba(15,15,28,.82);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:18px;
    box-shadow:0 15px 50px rgba(0,0,0,.4);
    backdrop-filter:blur(12px);
}

.player{
    position:relative;
    width:100%;
    background:#000;
    border-radius:16px;
    overflow:hidden;
    aspect-ratio:16/9;
}

.player video{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    background:#000;
}

.cover{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#090912;
    z-index:3;
    cursor:pointer;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cover::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.3);
}

.big-play{
    position:absolute;
    z-index:4;
    width:75px;
    height:75px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    color:#fff;
    font-size:28px;
    background:linear-gradient(135deg,#7b2cff,#00d9ff);
    box-shadow:
        0 0 30px rgba(123,44,255,.55),
        0 0 45px rgba(0,217,255,.2);
    transition:.25s;
}

.big-play:hover{
    transform:scale(1.08);
}

.controls{
    background:#10101c;
    border-top:1px solid rgba(255,255,255,.07);
    padding:13px;
}

.progress{
    width:100%;
    height:5px;
    appearance:none;
    background:#29293b;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:12px;
}

.progress::-webkit-slider-thumb{
    appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:#00d9ff;
    box-shadow:0 0 10px rgba(0,217,255,.7);
}

.control-row{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
}

.control-btn{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    color:#fff;
    border-radius:10px;
    min-width:38px;
    height:38px;
    cursor:pointer;
    transition:.2s;
}

.control-btn:hover{
    border-color:#7b2cff;
    background:rgba(123,44,255,.12);
}

.play-main{
    width:44px;
    height:44px;
    border-radius:50%;
    border:0;
    color:#fff;
    background:linear-gradient(135deg,#7b2cff,#00d9ff);
    cursor:pointer;
    font-size:17px;
}

.time{
    color:#aaa;
    font-size:12px;
    direction:ltr;
    margin:0 4px;
}

.volume{
    display:flex;
    align-items:center;
    gap:7px;
    margin-right:auto;
}

.volume input{
    width:90px;
    accent-color:#7b2cff;
}

.speed{
    display:flex;
    gap:5px;
}

.speed button{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    color:#aaa;
    padding:7px 9px;
    border-radius:8px;
    cursor:pointer;
}

.speed button.active{
    color:#fff;
    border-color:#7b2cff;
    background:rgba(123,44,255,.18);
}

.info{
    padding:22px 5px 5px;
}

.info h2{
    font-size:22px;
    margin-bottom:8px;
}

.info p{
    color:#999;
    line-height:1.8;
    font-size:14px;
}

.meta{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.badge{
    padding:7px 11px;
    border-radius:9px;
    background:rgba(123,44,255,.1);
    border:1px solid rgba(123,44,255,.2);
    color:#bbb;
    font-size:12px;
}

.section-title{
    margin:35px 0 15px;
    font-size:20px;
}

.video-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.video-item{
    background:rgba(15,15,28,.75);
    border:1px solid rgba(255,255,255,.07);
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
}

.video-item:hover{
    transform:translateY(-3px);
    border-color:rgba(123,44,255,.55);
    box-shadow:0 8px 25px rgba(123,44,255,.12);
}

.video-item-thumb{
    aspect-ratio:16/9;
    background:#090912;
    overflow:hidden;
}

.video-item-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.video-item-info{
    padding:13px;
}

.video-item-info h3{
    font-size:15px;
    margin-bottom:6px;
}

.video-item-info p{
    color:#777;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#777;
}

footer{
    text-align:center;
    color:#555;
    font-size:12px;
    margin-top:35px;
}

.theater{
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.94);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.theater .video-box{
    width:min(1200px,96%);
    max-height:95vh;
    overflow:auto;
}

@media(max-width:700px){

    .container{
        width:94%;
        padding-top:22px;
    }

    .header h1{
        font-size:26px;
    }

    .logo{
        width:72px;
        height:72px;
        font-size:25px;
    }

    .video-box{
        padding:10px;
    }

    .video-list{
        grid-template-columns:1fr;
    }

    .volume input{
        width:65px;
    }

    .speed{
        width:100%;
    }

    .speed button{
        flex:1;
    }

}

</style>
</head>

<body>

<div class="container">

<a href="/" class="back">
    ← بازگشت به صفحه اصلی
</a>

<header class="header">

    <div class="logo">
        AG
    </div>

    <h1>VIDEO | Arsin_Gang</h1>

    <p>
        ویدیوهای اختصاصی ArsinGang
    </p>

</header>

<div id="content">

    <div class="empty">
        در حال بارگذاری ویدیوها...
    </div>

</div>

<footer>
    © 2026 ArsinGang — All Rights Reserved
</footer>

</div>

<script>

const content = document.getElementById("content");

let videos = [];
let currentIndex = 0;

let player;
let cover;
let playMain;
let progress;
let currentTimeEl;
let durationEl;
let volumeInput;

async function loadVideos(){

    try{

        const response = await fetch("/videos/videos.json", {
            cache:"no-cache"
        });

        if(!response.ok){
            throw new Error("videos.json not found");
        }

        const data = await response.json();

        videos = Array.isArray(data.videos) ? data.videos : [];

        if(videos.length === 0){

            content.innerHTML = `
                <div class="video-box">
                    <div class="empty">
                        <div style="font-size:45px;margin-bottom:15px;">🎬</div>
                        هنوز ویدیویی اضافه نشده است.
                    </div>
                </div>
            `;

            return;
        }

        render();

    }catch(error){

        console.error(error);

        content.innerHTML = `
            <div class="video-box">
                <div class="empty">
                    <div style="font-size:45px;margin-bottom:15px;">⚠️</div>
                    خطا در بارگذاری لیست ویدیوها.
                </div>
            </div>
        `;

    }

}

function render(){

    const first = videos[0];

    content.innerHTML = `

        <div class="video-box" id="mainBox">

            <div class="player" id="playerContainer">

                <video
                    id="videoPlayer"
                    preload="metadata"
                ></video>

                <div class="cover" id="cover">

                    <img
                        src="${getThumbnail(first)}"
                        alt="${escapeHTML(first.title || "Video")}"
                    >

                    <button class="big-play" id="bigPlay">
                        ▶
                    </button>

                </div>

            </div>

            <div class="controls">

                <input
                    class="progress"
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <div class="control-row">

                    <button class="play-main" id="playMain">
                        ▶
                    </button>

                    <button class="control-btn" id="back10">
                        ↶
                    </button>

                    <button class="control-btn" id="forward10">
                        ↷
                    </button>

                    <span class="time" id="currentTime">
                        0:00
                    </span>

                    <span class="time">
                        /
                    </span>

                    <span class="time" id="duration">
                        0:00
                    </span>

                    <div class="volume">

                        <button class="control-btn" id="mute">
                            🔊
                        </button>

                        <input
                            id="volumeInput"
                            type="range"
                            min="0"
                            max="1"
                            step="0.05"
                            value="1"
                        >

                    </div>

                    <button class="control-btn" id="theaterBtn">
                        ▣
                    </button>

                    <button class="control-btn" id="fullscreenBtn">
                        ⛶
                    </button>

                </div>

                <div class="speed" style="margin-top:10px;">

                    <button data-speed="0.5">0.5x</button>
                    <button data-speed="0.75">0.75x</button>
                    <button data-speed="1" class="active">1x</button>
                    <button data-speed="1.25">1.25x</button>
                    <button data-speed="1.5">1.5x</button>
                    <button data-speed="2">2x</button>

                </div>

            </div>

            <div class="info">

                <h2 id="videoTitle"></h2>

                <p id="videoDescription"></p>

                <div class="meta">

                    <span class="badge" id="videoQuality">
                        1080p
                    </span>

                    <span class="badge" id="videoDate">
                        ArsinGang
                    </span>

                </div>

            </div>

        </div>

        <h2 class="section-title">
            ویدیوها
        </h2>

        <div class="video-list" id="videoList"></div>

    `;

    player = document.getElementById("videoPlayer");
    cover = document.getElementById("cover");
    playMain = document.getElementById("playMain");
    progress = document.getElementById("progress");
    currentTimeEl = document.getElementById("currentTime");
    durationEl = document.getElementById("duration");
    volumeInput = document.getElementById("volumeInput");

    setupPlayer();
    buildList();

    loadVideo(0);

}

function setupPlayer(){

    document.getElementById("bigPlay").onclick = playPause;
    cover.onclick = function(e){

        if(e.target.closest(".big-play")) return;

        playPause();

    };

    playMain.onclick = playPause;

    document.getElementById("back10").onclick = function(){

        player.currentTime = Math.max(0, player.currentTime - 10);

    };

    document.getElementById("forward10").onclick = function(){

        player.currentTime = Math.min(
            player.duration || 0,
            player.currentTime + 10
        );

    };

    document.getElementById("mute").onclick = function(){

        player.muted = !player.muted;

        this.textContent = player.muted ? "🔇" : "🔊";

    };

    volumeInput.oninput = function(){

        player.volume = Number(this.value);

        player.muted = false;

        document.getElementById("mute").textContent = "🔊";

    };

    progress.oninput = function(){

        if(player.duration){

            player.currentTime =
                (Number(progress.value) / 100) *
                player.duration;

        }

    };

    player.addEventListener("timeupdate",updateProgress);

    player.addEventListener("loadedmetadata",function(){

        durationEl.textContent =
            formatTime(player.duration);

    });

    player.addEventListener("play",function(){

        playMain.textContent = "⏸";

    });

    player.addEventListener("pause",function(){

        playMain.textContent = "▶";

    });

    player.addEventListener("ended",function(){

        playMain.textContent = "▶";
        cover.style.display = "flex";

    });

    document.getElementById("fullscreenBtn").onclick = function(){

        const box = document.getElementById("playerContainer");

        if(box.requestFullscreen){

            box.requestFullscreen();

        }

    };

    document.getElementById("theaterBtn").onclick = toggleTheater;

    document.querySelectorAll(".speed button").forEach(button => {

        button.onclick = function(){

            const speed = Number(this.dataset.speed);

            player.playbackRate = speed;

            document.querySelectorAll(".speed button")
                .forEach(b => b.classList.remove("active"));

            this.classList.add("active");

        };

    });

}

function playPause(){

    if(player.paused){

        player.play();

        cover.style.display = "none";

    }else{

        player.pause();

    }

}

function loadVideo(index){

    if(!videos[index]) return;

    currentIndex = index;

    const video = videos[index];

    player.src = getVideoPath(video);

    player.poster = getThumbnail(video);

    document.getElementById("videoTitle").textContent =
        video.title || "بدون عنوان";

    document.getElementById("videoDescription").textContent =
        video.description || "ویدیوی اختصاصی ArsinGang";

    document.getElementById("videoQuality").textContent =
        video.quality || "1080p";

    document.getElementById("videoDate").textContent =
        video.date || "ArsinGang";

    cover.querySelector("img").src =
        getThumbnail(video);

    cover.style.display = "flex";

    progress.value = 0;

    currentTimeEl.textContent = "0:00";
    durationEl.textContent = "0:00";

    player.load();

}

function buildList(){

    const list = document.getElementById("videoList");

    list.innerHTML = "";

    videos.forEach((video,index) => {

        const item = document.createElement("div");

        item.className = "video-item";

        item.innerHTML = `

            <div class="video-item-thumb">

                <img
                    src="${getThumbnail(video)}"
                    alt="${escapeHTML(video.title || "Video")}"
                >

            </div>

            <div class="video-item-info">

                <h3>
                    ${escapeHTML(video.title || "بدون عنوان")}
                </h3>

                <p>
                    ${escapeHTML(video.quality || "1080p")}
                </p>

            </div>

        `;

        item.onclick = function(){

            loadVideo(index);

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        list.appendChild(item);

    });

}

function updateProgress(){

    if(!player.duration) return;

    const percent =
        (player.currentTime / player.duration) * 100;

    progress.value = percent;

    currentTimeEl.textContent =
        formatTime(player.currentTime);

}

function formatTime(seconds){

    if(!Number.isFinite(seconds)) return "0:00";

    const mins = Math.floor(seconds / 60);

    const secs = Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");

    return mins + ":" + secs;

}

function getVideoPath(video){

    if(video.file){

        if(video.file.startsWith("/")){

            return video.file;

        }

        return "/videos/" + video.file;

    }

    return "";

}

function getThumbnail(video){

    if(video.thumbnail){

        if(video.thumbnail.startsWith("/")){

            return video.thumbnail;

        }

        return "/videos/thumbnails/" + video.thumbnail;

    }

    return "";

}

function toggleTheater(){

    const box = document.getElementById("mainBox");

    if(!box.classList.contains("theater")){

        box.classList.add("theater");

        document.body.style.overflow = "hidden";

    }else{

        box.classList.remove("theater");

        document.body.style.overflow = "";

    }

}

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

loadVideos();

</script>

</body>
</html>

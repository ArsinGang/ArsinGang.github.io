<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, rgba(123, 44, 255, 0.20), transparent 35%),
        radial-gradient(circle at bottom, rgba(0, 217, 255, 0.10), transparent 35%),
        #080812;
    color: white;
    min-height: 100vh;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
    padding: 35px 0 50px;
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 20px;
    background: #7b2cff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: bold;
    box-shadow:
        0 0 20px rgba(123, 44, 255, 0.8),
        0 0 50px rgba(0, 217, 255, 0.15);
}

.brand {
    margin-top: 12px;
    font-size: 15px;
    color: #00d9ff;
    font-weight: bold;
}

.header h1 {
    margin: 15px 0 8px;
    font-size: 30px;
}

.header p {
    margin: 0;
    color: #aaa;
}

/* AD */

.ad-section {
    display: none;
    margin: 0 auto 35px;
    width: min(900px, 100%);
}

.ad-box {
    position: relative;
    background: rgba(10, 10, 25, 0.95);
    border: 1px solid rgba(0, 217, 255, 0.35);
    border-radius: 18px;
    padding: 10px;
    box-shadow:
        0 0 25px rgba(123, 44, 255, 0.20),
        0 0 45px rgba(0, 217, 255, 0.08);
    overflow: hidden;
}

.ad-video {
    display: block;
    width: 100%;
    max-height: 500px;
    border-radius: 12px;
    background: black;
}

.ad-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    font-size: 20px;
    cursor: pointer;
    z-index: 5;
}

.ad-close:hover {
    background: #7b2cff;
}

.more-info {
    display: none;
    position: absolute;
    left: 18px;
    bottom: 18px;
    z-index: 6;
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(20, 20, 35, 0.92);
    border: 1px solid rgba(0, 217, 255, 0.55);
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    box-shadow:
        0 0 15px rgba(0, 217, 255, 0.18);
    transition: 0.2s;
}

.more-info:hover {
    background: #7b2cff;
    border-color: #7b2cff;
    transform: translateY(-2px);
}

/* VIDEOS */

.section-title {
    font-size: 23px;
    margin-bottom: 20px;
}

.videos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
}

.video-card {
    display: block;
    text-decoration: none;
    color: white;
    background: rgba(15, 15, 30, 0.88);
    border: 1px solid rgba(123, 44, 255, 0.28);
    border-radius: 18px;
    overflow: hidden;
    transition: 0.25s;
    box-shadow: 0 0 20px rgba(123, 44, 255, 0.08);
}

.video-card:hover {
    transform: translateY(-5px);
    border-color: #00d9ff;
    box-shadow:
        0 0 25px rgba(0, 217, 255, 0.18),
        0 0 35px rgba(123, 44, 255, 0.15);
}

.thumbnail {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #111;
    overflow: hidden;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.duration {
    position: absolute;
    left: 10px;
    bottom: 10px;
    padding: 5px 8px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.8);
    font-size: 13px;
}

.play-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    text-shadow: 0 0 20px #00d9ff;
    opacity: 0;
    transition: 0.2s;
}

.video-card:hover .play-icon {
    opacity: 1;
}

.video-info {
    padding: 16px;
}

.video-title {
    font-size: 17px;
    font-weight: bold;
    line-height: 1.6;
}

.back-button {
    display: block;
    width: fit-content;
    margin: 40px auto 0;
    padding: 12px 22px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    background: rgba(123, 44, 255, 0.18);
    border: 1px solid rgba(123, 44, 255, 0.5);
    transition: 0.2s;
}

.back-button:hover {
    background: #7b2cff;
    box-shadow: 0 0 20px rgba(123, 44, 255, 0.4);
}

footer {
    text-align: center;
    margin-top: 35px;
    color: #777;
    font-size: 13px;
}

@media (max-width: 600px) {
    .header h1 {
        font-size: 24px;
    }

    .more-info {
        left: 12px;
        bottom: 12px;
        padding: 8px 12px;
        font-size: 13px;
    }
}
</style>

<body>

<div class="container">

```
<header class="header">

    <div class="logo">AG</div>

    <div class="brand">VIDEO</div>

    <h1>ویدیوهای اختصاصی ArsinGang</h1>

    <p>ویدیوهای ویژه برای اعضای ArsinGang</p>

</header>


<!-- AD -->

<section id="adSection" class="ad-section">

    <div class="ad-box">

        <button id="adClose" class="ad-close" type="button">

        </button>

        <video
            id="adVideo"

        >

        </a>

    </div>

</section>


<!-- VIDEOS -->

    <div class="section-title">
        🎬 ویدیوها
    </div>

    <div id="videosGrid" class="videos-grid"></div>

</section>

</div>

<script>

const ADS_JSON_PATH = "/videos/ads.json";
const JSON_PATH = "/videos/videos.json";

const adSection = document.getElementById("adSection");
const adVideo = document.getElementById("adVideo");
const adClose = document.getElementById("adClose");
const moreInfo = document.getElementById("moreInfo");

const videosGrid = document.getElementById("videosGrid");


/* =========================
   AD SYSTEM
========================= */

async function checkAd() {

    try {

        const response = await fetch(
            ADS_JSON_PATH + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            adSection.style.display = "none";
            moreInfo.style.display = "none";

            return;
        }


        const data = await response.json();


        if (
            !data.ad ||
            !data.ad.video
        ) {

            adSection.style.display = "none";
            moreInfo.style.display = "none";

            return;
        }


        adVideo.src = data.ad.video;

        adSection.style.display = "block";


        if (data.ad.more_info) {

            moreInfo.href = data.ad.more_info;
            moreInfo.style.display = "block";

        } else {

            moreInfo.style.display = "none";

        }


        /*
         * تبلیغ به محض ورود به صفحه
         * به صورت خودکار Play می‌شود.
         * muted عمداً فعال نشده تا صدای تبلیغ حفظ شود.
         */

        adVideo.load();

        adVideo.play().catch(() => {});

    } catch (error) {

        adSection.style.display = "none";
        moreInfo.style.display = "none";

    }

}


/* =========================
   CLOSE AD
========================= */

adClose.addEventListener("click", () => {

    adVideo.pause();

    adVideo.removeAttribute("src");

    adVideo.load();

    adSection.style.display = "none";
    moreInfo.style.display = "none";

});


/* =========================
   VIDEOS
========================= */

function getThumbnail(path) {

    if (!path) {
        return "";
    }

    if (
        path.startsWith("http://") ||
        path.startsWith("https://") ||
        path.startsWith("/")
    ) {

        return path;

    }

    return "/videos/thumbnails/" + path;

}


function renderVideos(data) {

    videosGrid.innerHTML = "";

    if (
        !data ||
        !Array.isArray(data.videos)
    ) {

        return;
    }


    data.videos.forEach(video => {

        const card = document.createElement("a");

        card.className = "video-card";

        card.href = video.url;

        card.target = "_blank";

        card.rel = "noopener noreferrer";


        const thumbnail = document.createElement("div");

        thumbnail.className = "thumbnail";


        const img = document.createElement("img");

        img.src = getThumbnail(video.thumbnail);

        img.alt = video.title || "ArsinGang Video";

        img.loading = "lazy";


        thumbnail.appendChild(img);


        if (video.duration) {

            const duration = document.createElement("div");

            duration.className = "duration";

            duration.textContent = video.duration;

            thumbnail.appendChild(duration);

        }


        const playIcon = document.createElement("div");

        playIcon.className = "play-icon";

        playIcon.textContent = "▶";

        thumbnail.appendChild(playIcon);


        const info = document.createElement("div");

        info.className = "video-info";


        const title = document.createElement("div");

        title.className = "video-title";

        title.textContent = video.title || "";

        info.appendChild(title);


        card.appendChild(thumbnail);

        card.appendChild(info);

        videosGrid.appendChild(card);

    });

}


async function loadVideos() {

    try {

        const response = await fetch(
            JSON_PATH + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );


        if (!response.ok) {
            return;
        }


        const data = await response.json();

        renderVideos(data);

    } catch (error) {

        console.error(
            "Videos loading error:",
            error
        );

    }

}


/* =========================
   START
========================= */

checkAd();

loadVideos();

</script>

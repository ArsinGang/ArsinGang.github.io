<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArsinGang | خرید رنک</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237b2cff'/%3E%3Ctext x='50' y='63' text-anchor='middle' font-size='38' font-family='Arial' font-weight='bold' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top,#24104d 0%,#0b0714 45%,#05030a 100%);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 15% 20%,rgba(123,44,255,.13),transparent 30%),
        radial-gradient(circle at 85% 70%,rgba(0,229,255,.08),transparent 30%);
}

.loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#05030a;
}

.loader{
    width:55px;
    height:55px;
    border:5px solid rgba(255,255,255,.12);
    border-top-color:#8b3dff;
    border-right-color:#00e5ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#mainContent{
    display:none;
    position:relative;
    z-index:1;
}

.container{
    width:min(950px,92%);
    margin:auto;
    padding:70px 0 50px;
}

.header{
    text-align:center;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:25px;
    background:linear-gradient(135deg,#7b2cff,#00cfff);
    box-shadow:
        0 0 25px rgba(123,44,255,.6),
        0 0 45px rgba(0,229,255,.2);
    font-size:32px;
    font-weight:bold;
}

h1{
    margin:22px 0 8px;
    font-size:38px;
    text-shadow:0 0 20px rgba(139,61,255,.7);
}

.subtitle{
    color:#aaa1b8;
    font-size:15px;
}

.wallet{
    margin:30px auto;
    width:min(500px,100%);
    padding:20px;
    border-radius:18px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(139,61,255,.4);
    box-shadow:
        0 0 25px rgba(123,44,255,.18),
        inset 0 0 20px rgba(255,255,255,.02);
}

.wallet-title{
    color:#bfb4ce;
    font-size:14px;
    margin-bottom:8px;
}

.wallet-coins{
    font-size:30px;
    font-weight:bold;
    color:#ffd84d;
    text-shadow:0 0 15px rgba(255,216,77,.4);
}

.active-rank{
    margin-top:10px;
    color:#b9b0c5;
    font-size:13px;
}

.ranks{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:25px;
}

.rank-card{
    padding:28px 22px;
    text-align:center;
    border-radius:20px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 12px 35px rgba(0,0,0,.25);
    transition:.25s;
}

.rank-card:hover{
    transform:translateY(-4px);
    border-color:#8b3dff;
    box-shadow:
        0 0 30px rgba(123,44,255,.25),
        0 15px 35px rgba(0,0,0,.3);
}

.rank-icon{
    font-size:55px;
}

.rank-name{
    margin-top:10px;
    font-size:28px;
    font-weight:bold;
}

.vip{
    color:#d59cff;
    text-shadow:0 0 15px rgba(190,90,255,.5);
}

.mvp{
    color:#ffe27a;
    text-shadow:0 0 15px rgba(255,210,60,.4);
}

.price{
    margin:15px 0;
    color:#ffd84d;
    font-size:20px;
    font-weight:bold;
}

.duration{
    color:#9990a5;
    font-size:13px;
    margin-bottom:20px;
}

.buy-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:13px;
    color:white;
    font-family:inherit;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#7b2cff,#00aeea);
    box-shadow:0 0 20px rgba(123,44,255,.25);
    transition:.25s;
}

.buy-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 30px rgba(123,44,255,.5);
}

.back{
    display:block;
    width:max-content;
    margin:30px auto 0;
    padding:12px 20px;
    border-radius:12px;
    color:white;
    text-decoration:none;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    transition:.25s;
}

.back:hover{
    border-color:#8b3dff;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:10000;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(7px);
}

.modal-box{
    width:min(450px,100%);
    padding:30px 24px;
    text-align:center;
    border-radius:22px;
    background:
        linear-gradient(
            145deg,
            rgba(30,15,55,.98),
            rgba(8,8,18,.98)
        );
    border:1px solid rgba(139,61,255,.6);
    box-shadow:
        0 0 35px rgba(123,44,255,.35),
        0 0 70px rgba(0,229,255,.08);
}

.modal-icon{
    font-size:50px;
    margin-bottom:12px;
}

.modal-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:12px;
}

.modal-message{
    color:#c4bdcc;
    line-height:1.8;
    font-size:14px;
}

.modal-close{
    margin-top:22px;
    padding:12px 28px;
    border:0;
    border-radius:12px;
    color:white;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#7b2cff,#00aeea);
}

footer{
    text-align:center;
    color:#706979;
    font-size:12px;
    margin-top:35px;
}

@media(max-width:650px){

    .ranks{
        grid-template-columns:1fr;
    }

    h1{
        font-size:31px;
    }

}

</style>
</head>

<body>

<div class="loading" id="loading">
    <div class="loader"></div>
</div>

<div id="mainContent">

<div class="container">

    <div class="header">

        <div class="logo">
            AG
        </div>

        <h1>👑 خرید رنک</h1>

        <div class="subtitle">
            رنک خودت رو در ArsinGang فعال کن 🎮💜
        </div>

    </div>


    <div class="wallet">

        <div class="wallet-title">
            Gang Coin Wallet
        </div>

        <div class="wallet-coins" id="coinBalance">
            🪙 0
        </div>

        <div class="active-rank" id="activeRank">
            در حال بررسی رنک...
        </div>

    </div>


    <div class="ranks">

        <div class="rank-card">

            <div class="rank-icon">
                💜
            </div>

            <div class="rank-name vip">
                VIP
            </div>

            <div class="price">
                🪙 5,000 Gang Coin
            </div>

            <div class="duration">
                ⏳ فعال به مدت ۳۰ روز
            </div>

            <button
                class="buy-btn"
                onclick="purchaseRank('VIP')">
                خرید VIP
            </button>

        </div>


        <div class="rank-card">

            <div class="rank-icon">
                👑
            </div>

            <div class="rank-name mvp">
                MVP
            </div>

            <div class="price">
                🪙 10,000 Gang Coin
            </div>

            <div class="duration">
                ⏳ فعال به مدت ۳۰ روز
            </div>

            <button
                class="buy-btn"
                onclick="purchaseRank('MVP')">
                خرید MVP
            </button>

        </div>

    </div>


    <a class="back" href="index.html">
        ← برگشت به صفحه اصلی
    </a>


    <footer>
        ArsinGang 🎮 © 2026 ArsinGang
    </footer>

</div>

</div>


<div class="modal" id="messageModal">

    <div class="modal-box">

        <div class="modal-icon" id="modalIcon">
            ⚠️
        </div>

        <div class="modal-title" id="modalTitle">
            پیام
        </div>

        <div class="modal-message" id="modalMessage">
        </div>

        <button
            class="modal-close"
            onclick="closeModal()">
            باشه 👍
        </button>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";

let accessToken =
localStorage.getItem("arsin_user_token");

let refreshToken =
localStorage.getItem("arsin_user_refresh");

let userId = null;


async function refreshAccessToken(){

    if(!refreshToken){
        return false;
    }

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=refresh_token",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY
                },

                body:JSON.stringify({
                    refresh_token:refreshToken
                })
            }
        );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.access_token
        ){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );

            return false;
        }

        accessToken =
            data.access_token;

        refreshToken =
            data.refresh_token ||
            refreshToken;

        localStorage.setItem(
            "arsin_user_token",
            accessToken
        );

        localStorage.setItem(
            "arsin_user_refresh",
            refreshToken
        );

        return true;

    }catch(error){

        return false;

    }

}


async function getUser(){

    if(!accessToken){

        window.location.replace(
            "login.html"
        );

        return false;
    }

    let response;

    try{

        response = await fetch(
            SUPABASE_URL +
            "/auth/v1/user",
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + accessToken
                }
            }
        );

        if(response.status === 401){

            const refreshed =
                await refreshAccessToken();

            if(!refreshed){

                window.location.replace(
                    "login.html"
                );

                return false;
            }

            response = await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    }
                }
            );

        }

        if(!response.ok){

            window.location.replace(
                "login.html"
            );

            return false;
        }

        const user =
            await response.json();

        if(!user || !user.id){

            window.location.replace(
                "login.html"
            );

            return false;
        }

        userId = user.id;

        return true;

    }catch(error){

        window.location.replace(
            "login.html"
        );

        return false;
    }

}


async function loadWallet(){

    try{

        let response = await fetch(
            SUPABASE_URL +
            "/rest/v1/gang_users?id=eq." +
            encodeURIComponent(userId) +
            "&select=gang_coins,rank,rank_expires_at",
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + accessToken
                }
            }
        );


        if(response.status === 401){

            const refreshed =
                await refreshAccessToken();

            if(!refreshed){
                window.location.replace(
                    "login.html"
                );
                return;
            }

            response = await fetch(
                SUPABASE_URL +
                "/rest/v1/gang_users?id=eq." +
                encodeURIComponent(userId) +
                "&select=gang_coins,rank,rank_expires_at",
                {
                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    }
                }
            );

        }


        const data =
            await response.json();


        if(!response.ok){

            showModal(
                "⚠️",
                "خطا",
                "نتونستیم اطلاعات کیف پولت رو دریافت کنیم."
            );

            return;
        }


        if(!data.length){

            await createUserWallet();

            document.getElementById(
                "coinBalance"
            ).textContent =
                "🪙 0";

            document.getElementById(
                "activeRank"
            ).textContent =
                "بدون رنک فعال";

            return;
        }


        updateWallet(data[0]);

    }catch(error){

        showModal(
            "⚠️",
            "خطا",
            "در دریافت اطلاعات حساب مشکلی پیش آمد."
        );

    }

}


async function createUserWallet(){

    try{

        await fetch(
            SUPABASE_URL +
            "/rest/v1/gang_users",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + accessToken,
                    "Prefer":"return=minimal"
                },

                body:JSON.stringify({
                    id:userId
                })
            }
        );

    }catch(error){}

}


function updateWallet(account){

    const coins =
        Number(account.gang_coins || 0);

    document.getElementById(
        "coinBalance"
    ).textContent =
        "🪙 " +
        coins.toLocaleString("en-US");


    const rank =
        account.rank || "none";

    const expiry =
        account.rank_expires_at;


    if(
        rank !== "none" &&
        expiry &&
        new Date(expiry) > new Date()
    ){

        const date =
            new Date(expiry);

        document.getElementById(
            "activeRank"
        ).textContent =
            "✨ رنک فعال: " +
            rank +
            " • تا " +
            date.toLocaleDateString("fa-IR");

    }else{

        document.getElementById(
            "activeRank"
        ).textContent =
            "بدون رنک فعال";

    }

}


async function purchaseRank(rank){

    const rankName =
        rank === "VIP" ? "VIP" : "MVP";

    const price =
        rank === "VIP" ? 5000 : 10000;


    const confirmPurchase =
        confirm(
            "خرید رنک " +
            rankName +
            " با " +
            price.toLocaleString("en-US") +
            " Gang Coin انجام شود؟"
        );

    if(!confirmPurchase){
        return;
    }


    try{

        let response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/purchase_rank",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json",
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    },

                    body:JSON.stringify({
                        p_rank:rank
                    })
                }
            );


        if(response.status === 401){

            const refreshed =
                await refreshAccessToken();

            if(!refreshed){

                window.location.replace(
                    "login.html"
                );

                return;
            }


            response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/rpc/purchase_rank",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":"application/json",
                            "apikey":SUPABASE_KEY,
                            "Authorization":
                                "Bearer " + accessToken
                        },

                        body:JSON.stringify({
                            p_rank:rank
                        })
                    }
                );

        }


        const result =
            await response.json();


        if(!response.ok){

            showModal(
                "❌",
                "خرید انجام نشد",
                "در انجام خرید مشکلی پیش آمد."
            );

            return;
        }


        const data =
            Array.isArray(result)
                ? result[0]
                : result;


        if(!data.success){

            showModal(
                "❌",
                "خرید انجام نشد",
                data.message ||
                "خرید رنک انجام نشد."
            );

            return;
        }


        showModal(
            rank === "MVP" ? "👑" : "💜",
            "خرید موفق!",
            "رنک " +
            rankName +
            " با موفقیت فعال شد! 🎉"
        );


        document.getElementById(
            "coinBalance"
        ).textContent =
            "🪙 " +
            Number(
                data.new_balance || 0
            ).toLocaleString("en-US");


        if(data.expires_at){

            const date =
                new Date(data.expires_at);

            document.getElementById(
                "activeRank"
            ).textContent =
                "✨ رنک فعال: " +
                rankName +
                " • تا " +
                date.toLocaleDateString("fa-IR");

        }


    }catch(error){

        showModal(
            "⚠️",
            "خطا",
            "ارتباط با سرور برقرار نشد."
        );

    }

}


function showModal(
    icon,
    title,
    message
){

    document.getElementById(
        "modalIcon"
    ).textContent = icon;

    document.getElementById(
        "modalTitle"
    ).textContent = title;

    document.getElementById(
        "modalMessage"
    ).textContent = message;

    document.getElementById(
        "messageModal"
    ).style.display = "flex";

}


function closeModal(){

    document.getElementById(
        "messageModal"
    ).style.display = "none";

}


async function start(){

    const loggedIn =
        await getUser();

    if(!loggedIn){
        return;
    }

    await loadWallet();

    document.getElementById(
        "loading"
    ).style.display = "none";

    document.getElementById(
        "mainContent"
    ).style.display = "block";

}


start();

</script>

</body>
</html>

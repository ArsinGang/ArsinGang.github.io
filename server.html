<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Tahoma, sans-serif;
    color: white;
    text-align: center;

    background:
        radial-gradient(circle at 20% 20%, rgba(130,40,255,.30), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(0,220,255,.20), transparent 35%),
        linear-gradient(135deg,#06000f,#16002b,#001522);
}

.container {
    width: 90%;
    max-width: 750px;
    margin: auto;
    padding: 70px 20px;
}

.icon {
    font-size: 75px;
    margin-bottom: 10px;
}

h1 {
    font-size: 48px;
    margin: 0;

    background: linear-gradient(90deg,#fff,#b987ff,#45eaff);

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.coming {
    display: inline-block;

    margin: 25px 0;

    padding: 12px 28px;

    border-radius: 50px;

    font-size: 20px;
    font-weight: bold;

    background: linear-gradient(90deg,#7b2cff,#00cfff);

    box-shadow: 0 0 30px rgba(123,44,255,.5);
}

.card {
    padding: 30px 25px;

    border-radius: 25px;

    background: rgba(15,10,30,.82);

    border: 1px solid rgba(255,255,255,.12);

    box-shadow: 0 0 40px rgba(123,44,255,.18);
}

.card h2 {
    font-size: 27px;
}

.card p {
    color: #cfc9dc;

    font-size: 18px;

    line-height: 1.9;
}

.back {
    display: inline-block;

    margin-top: 25px;

    padding: 14px 30px;

    border-radius: 14px;

    color: white;

    text-decoration: none;

    background: rgba(255,255,255,.08);

    border: 1px solid rgba(255,255,255,.12);
}

.back:hover {
    background: rgba(123,44,255,.25);
}
</style>

</head>

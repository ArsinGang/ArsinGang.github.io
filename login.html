
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArsinGang | ورود</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237b2cff'/%3E%3Ctext x='50' y='63' text-anchor='middle' font-size='38' font-family='Arial' font-weight='bold' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;
background:radial-gradient(circle at top,#24104d 0%,#0b0714 45%,#05030a 100%);
color:white;display:flex;justify-content:center;align-items:center;padding:20px
}
.container{width:100%;max-width:430px}
.logo{
width:82px;height:82px;margin:0 auto 18px;border-radius:24px;
background:#7b2cff;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;font-size:30px;font-weight:bold;
box-shadow:0 0 20px #7b2cff,0 0 45px rgba(0,220,255,.35)
}
h1{text-align:center;margin:0;font-size:28px}
.subtitle{text-align:center;color:#bbb;margin:10px 0 25px}
.card{
background:rgba(15,10,28,.88);border:1px solid rgba(139,75,255,.5);
border-radius:22px;padding:25px;
box-shadow:0 0 25px rgba(123,44,255,.18),inset 0 0 20px rgba(0,220,255,.03);
backdrop-filter:blur(10px)
}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{
flex:1;padding:12px;border:none;border-radius:12px;background:#171020;
color:#aaa;font-size:15px;cursor:pointer;transition:.2s
}
.tab.active{
background:linear-gradient(135deg,#7b2cff,#00cfff);color:white;
box-shadow:0 0 15px rgba(123,44,255,.35)
}
label{display:block;margin:12px 3px 7px;color:#ddd;font-size:14px}
input{
width:100%;padding:13px 14px;border-radius:12px;border:1px solid #34244d;
background:#090711;color:white;outline:none;font-size:14px;direction:ltr
}
input:focus{border-color:#8b4dff;box-shadow:0 0 10px rgba(123,44,255,.25)}
.human-box{
margin-top:18px;width:100%;padding:14px 15px;border-radius:13px;
background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(123,44,255,.08));
border:1px solid #34244d;display:flex;align-items:center;gap:12px;
cursor:pointer;transition:.2s;user-select:none;direction:ltr
}
.human-box:hover{border-color:#7b2cff;box-shadow:0 0 14px rgba(123,44,255,.2)}
.human-check{
width:24px;height:24px;border-radius:6px;border:2px solid #71677e;
background:#090711;display:flex;align-items:center;justify-content:center;
flex-shrink:0;transition:.2s
}
.human-check::after{
content:"";width:10px;height:6px;border-left:3px solid white;
border-bottom:3px solid white;transform:rotate(-45deg) scale(0);
transition:.2s;margin-top:-3px
}
.human-box.checked .human-check{
background:#16c784;border-color:#16c784;
box-shadow:0 0 12px rgba(22,199,132,.45)
}
.human-box.checked .human-check::after{transform:rotate(-45deg) scale(1)}
.human-text{font-family:Arial,sans-serif;font-size:15px;font-weight:bold;color:#eee}
.human-small{margin-right:auto;font-family:Arial,sans-serif;font-size:11px;color:#777}
.main-btn{
width:100%;margin-top:20px;padding:14px;border:0;border-radius:13px;
background:linear-gradient(135deg,#7b2cff,#00cfff);color:white;
font-size:16px;font-weight:bold;cursor:pointer;
box-shadow:0 0 18px rgba(123,44,255,.3);transition:.2s
}
.main-btn:hover{transform:translateY(-1px);box-shadow:0 0 25px rgba(123,44,255,.45)}
.main-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.message{
display:none;margin-top:15px;padding:13px;border-radius:12px;
text-align:center;font-size:14px;line-height:1.9
}
.message.error{
display:block;background:rgba(255,50,80,.1);
border:1px solid rgba(255,70,100,.4);color:#ff9aaa
}
.message.success{
display:block;background:rgba(0,220,255,.08);
border:1px solid rgba(0,220,255,.35);color:#75eaff
}
.message.info{
display:block;background:rgba(123,44,255,.09);
border:1px solid rgba(123,44,255,.35);color:#c7a9ff
}
#signupFields{display:none}

/* دکمه ارسال دوباره ایمیل؛ فقط در صورت نیاز نمایش داده می‌شود */
.resend-btn{
display:none;width:100%;margin-top:12px;padding:12px;
border:1px solid #49316d;border-radius:12px;
background:#171020;color:#c7a9ff;font-size:14px;
cursor:pointer
}
.resend-btn:hover{border-color:#7b2cff}
.resend-btn:disabled{opacity:.55;cursor:not-allowed}
</style>
</head>

<body>
<div class="container">
  <div class="logo">AG</div>
  <h1>ArsinGang</h1>
  <div class="subtitle">🔐 حساب کاربری ArsinGang</div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="loginTab" type="button" onclick="showLogin()">ورود</button>
      <button class="tab" id="signupTab" type="button" onclick="showSignup()">ثبت‌نام</button>
    </div>

    <form id="authForm">
      <div id="signupFields">
        <label for="username">نام کاربری</label>
        <input id="username" type="text" placeholder="مثلاً USER" autocomplete="username">
      </div>

      <label for="email">ایمیل</label>
      <input id="email" type="email" placeholder="example@email.com" autocomplete="email" required>

      <label for="password">رمز عبور</label>
      <input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required>

      <div class="human-box" id="humanBox" onclick="toggleHuman()" style="display:none;">
        <div class="human-check" id="humanCheck"></div>
        <div class="human-text">I'm Human</div>
        <div class="human-small">ArsinGang</div>
      </div>

      <button class="main-btn" id="submitBtn" type="submit">🔐 ورود به حساب</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <button
      type="button"
      class="resend-btn"
      id="resendBtn"
      onclick="resendConfirmationEmail()">
      📧 ارسال دوباره ایمیل تأیید
    </button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lhddjuomukejpvssyhuv.supabase.co";
const SUPABASE_KEY = "sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";

let mode = "login";
let humanVerified = false;
let resendEmail = "";
let resendBusy = false;

function showLogin(){
  mode = "login";

  document.getElementById("loginTab").classList.add("active");
  document.getElementById("signupTab").classList.remove("active");
  document.getElementById("signupFields").style.display = "none";
  document.getElementById("humanBox").style.display = "none";
  document.getElementById("submitBtn").textContent = "🔐 ورود به حساب";
  document.getElementById("password").setAttribute("autocomplete","current-password");

  hideResend();
  clearMessage();
  showMessage("🔐 برای ورود به سایت، ابتدا ایمیل و رمز عبورت رو وارد کن.","info");
}

function showSignup(){
  mode = "signup";

  document.getElementById("signupTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");
  document.getElementById("signupFields").style.display = "block";
  document.getElementById("humanBox").style.display = "flex";
  document.getElementById("submitBtn").textContent = "✨ ساخت حساب";
  document.getElementById("password").setAttribute("autocomplete","new-password");

  humanVerified = false;
  document.getElementById("humanBox").classList.remove("checked");

  hideResend();
  clearMessage();
}

function toggleHuman(){
  if(mode !== "signup") return;

  humanVerified = !humanVerified;
  document.getElementById("humanBox").classList.toggle("checked",humanVerified);
}

function showMessage(text,type){
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = "message " + type;
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function clearMessage(){
  const box = document.getElementById("message");
  box.textContent = "";
  box.className = "message";
}

function showResend(email){
  resendEmail = email;
  document.getElementById("resendBtn").style.display = "block";
}

function hideResend(){
  document.getElementById("resendBtn").style.display = "none";
  resendEmail = "";
}

async function supabaseRequest(path,options={}){
  try{
    const response = await fetch(SUPABASE_URL + path,{
      ...options,
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        ...(options.headers || {})
      },
      cache:"no-store"
    });

    const data = await response.json().catch(()=>null);
    return {ok:response.ok,status:response.status,data};
  }catch(error){
    return {
      ok:false,
      status:0,
      data:{message:"اتصال به سرور برقرار نشد."}
    };
  }
}

function getErrorMessage(data,currentMode){
  const raw = (
    data?.msg ||
    data?.message ||
    data?.error_description ||
    data?.error ||
    ""
  ).toString();

  const error = raw.toLowerCase();

  if(
    error.includes("email rate exceeded") ||
    error.includes("rate limit") ||
    error.includes("rate exceeded")
  ){
    return "⏳ تعداد درخواست‌های ایمیل زیاد شده است. کمی صبر کن و دوباره امتحان کن.";
  }

  if(
    error.includes("email not confirmed") ||
    error.includes("email_not_confirmed")
  ){
    return "📧 ایمیل این حساب هنوز تأیید نشده است. ایمیلت رو بررسی کن و روی لینک تأیید بزن.";
  }

  if(
    error.includes("user already registered") ||
    error.includes("already registered")
  ){
    return "⚠️ این ایمیل قبلاً ثبت‌نام شده است. از بخش «ورود» استفاده کن. اگر هنوز تأییدش نکردی، ایمیل تأیید رو بررسی کن.";
  }

  if(error.includes("invalid login credentials")){
    return "❌ ایمیل یا رمز عبور اشتباه است. اگر حساب جدید ساختی، ابتدا ایمیلت رو تأیید کن.";
  }

  if(
    error.includes("invalid email") ||
    error.includes("email address is invalid")
  ){
    return "📧 قالب ایمیل معتبر نیست. آدرس ایمیل رو بررسی کن.";
  }

  if(
    error.includes("password") &&
    (
      error.includes("at least") ||
      error.includes("short") ||
      error.includes("weak")
    )
  ){
    return "🔑 رمز عبور انتخاب‌شده خیلی کوتاه یا ضعیف است.";
  }

  if(error.includes("signup") && error.includes("disabled")){
    return "❌ ثبت‌نام در حال حاضر فعال نیست.";
  }

  if(currentMode === "signup"){
    return "❌ ساخت حساب انجام نشد. اطلاعات را بررسی کن و دوباره امتحان کن.";
  }

  return "❌ ورود انجام نشد. اطلاعات را بررسی کن و دوباره امتحان کن.";
}

/* ارسال دوباره لینک تأیید */
async function resendConfirmationEmail(){
  if(resendBusy || !resendEmail) return;

  const btn = document.getElementById("resendBtn");
  resendBusy = true;
  btn.disabled = true;
  btn.textContent = "⏳ در حال ارسال...";

  const result = await supabaseRequest("/auth/v1/resend",{
    method:"POST",
    body:JSON.stringify({
      type:"signup",
      email:resendEmail
    })
  });

  if(result.ok){
    showMessage(
      "📧 اگر این آدرس نیاز به تأیید داشته باشد، ایمیل تأیید ارسال می‌شود. صندوق ورودی و پوشه Spam را بررسی کن.",
      "success"
    );
  }else{
    showMessage(getErrorMessage(result.data,"signup"),"error");
  }

  resendBusy = false;
  btn.disabled = false;
  btn.textContent = "📧 ارسال دوباره ایمیل تأیید";
}

/* ارسال فرم */
document.getElementById("authForm").addEventListener("submit",async function(event){
  event.preventDefault();
  clearMessage();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const username = document.getElementById("username").value.trim();
  const button = document.getElementById("submitBtn");

  if(!email){
    showMessage("📧 لطفاً ایمیلت رو وارد کن.","error");
    return;
  }

  if(mode === "signup"){
    if(username.length < 3){
      showMessage("❌ نام کاربری باید حداقل ۳ کاراکتر باشد.","error");
      return;
    }

    if(!humanVerified){
      showMessage("🤖 لطفاً تیک «I'm Human» را بزن تا مشخص شود ربات نیستی.","error");
      return;
    }

    button.disabled = true;
    button.textContent = "⏳ در حال ساخت حساب...";

    const result = await supabaseRequest("/auth/v1/signup",{
      method:"POST",
      body:JSON.stringify({
        email,
        password,
        data:{username}
      })
    });

    if(!result.ok){
      showMessage(getErrorMessage(result.data,"signup"),"error");
      button.textContent = "✨ ساخت حساب";
      button.disabled = false;
      return;
    }

    /*
      در صورت فعال بودن Confirm email، کاربر را
      خودکار وارد حساب نمی‌کنیم.
    */
    localStorage.removeItem("arsin_user_token");
    localStorage.removeItem("arsin_user_refresh");

    document.getElementById("password").value = "";
    showResend(email);

    showMessage(
      "📧 درخواست ثبت‌نام ارسال شد! ایمیلت رو باز کن و روی لینک تأیید Supabase بزن. تا وقتی ایمیلت تأیید نشه، نمی‌تونی وارد حسابت بشی. پوشه Spam رو هم بررسی کن.",
      "success"
    );

    button.textContent = "✨ ساخت حساب";
    button.disabled = false;
    return;
  }

  /* ورود */
  button.disabled = true;
  button.textContent = "⏳ در حال ورود...";

  const result = await supabaseRequest("/auth/v1/token?grant_type=password",{
    method:"POST",
    body:JSON.stringify({email,password})
  });

  if(!result.ok){
    showMessage(getErrorMessage(result.data,"login"),"error");
    button.textContent = "🔐 ورود به حساب";
    button.disabled = false;
    return;
  }

  if(!result.data?.access_token){
    showMessage("❌ ورود انجام نشد. توکن ورود از سرور دریافت نشد.","error");
    button.textContent = "🔐 ورود به حساب";
    button.disabled = false;
    return;
  }

  /*
    بررسی اضافی وضعیت تأیید ایمیل.
    Supabase نیز باید ورود کاربران تأییدنشده را رد کند.
  */
  const user = result.data.user;

  if(
    user &&
    !user.email_confirmed_at &&
    !user.confirmed_at
  ){
    showMessage(
      "📧 ایمیلت هنوز تأیید نشده است. ابتدا لینک تأیید ارسال‌شده به ایمیلت رو باز کن.",
      "error"
    );

    button.textContent = "🔐 ورود به حساب";
    button.disabled = false;
    return;
  }

  localStorage.setItem("arsin_user_token",result.data.access_token);

  if(result.data.refresh_token){
    localStorage.setItem("arsin_user_refresh",result.data.refresh_token);
  }

  showMessage("✅ ورود موفق بود! در حال ورود به سایت...","success");

  setTimeout(function(){
    window.location.replace("index.html");
  },700);
});
</script>
</body>
</html>

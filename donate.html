
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حمایت مالی | ArsinGang</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #080808;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Tahoma, sans-serif;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 25px;
      padding: 12px 25px;
      color: white;
      background: #171717;
      border: 1px solid #333;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      transition: .25s;
    }

    .back-button:hover {
      border-color: #ff7900;
      transform: translateY(-3px);
    }

    .main-card {
      width: 100%;
      padding: 25px 15px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }

    h2 {
      font-size: 21px;
      margin-bottom: 22px;
    }

    .banner-container {
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .pizza-section {
      padding: 22px 15px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 16px;
    }

    .pizza-title {
      font-size: 19px;
      margin-bottom: 18px;
      line-height: 1.9;
    }

    .pizza-button {
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      background: #ff7900;
      color: white;
      font-family: Tahoma, sans-serif;
      font-size: 15px;
      cursor: pointer;
      transition: .25s;
    }

    .pizza-button:hover {
      background: #ff941f;
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(255,121,0,.5);
    }

    /* کادر QR مشکی با نور نارنجی */
    .qr-box {
      display: none;
      margin-top: 28px;
      padding: 25px 15px;
      background: #030303;
      color: white;
      border: 2px solid #ff7900;
      border-radius: 18px;

      box-shadow:
        0 0 8px #ff7900,
        0 0 18px rgba(255,121,0,.8),
        0 0 35px rgba(255,121,0,.35),
        inset 0 0 18px rgba(255,121,0,.12);
    }

    .qr-box.show {
      display: block;
      animation: appear .4s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .qr-box h3 {
      margin-bottom: 20px;
      font-size: 19px;
      color: #ff942f;
      text-shadow: 0 0 10px #ff7900;
    }

    .qr-image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    #qrImage {
      display: block;
      width: 240px;
      height: 240px;
      max-width: 100%;
      object-fit: contain;
      background: white;
      padding: 8px;
      border-radius: 12px;
    }

    .qr-description {
      margin-top: 15px;
      font-size: 13px;
      line-height: 2.2;
      color: #ddd;
    }

    .amount {
      color: #ff942f;
      font-weight: bold;
    }

    .donate-link {
      display: inline-block;
      margin-top: 17px;
      color: #ff942f;
      font-weight: bold;
      text-decoration: none;
    }

    .donate-link:hover {
      color: #ffc080;
    }

    .error-message {
      display: none;
      color: #ff942f;
      font-size: 13px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back-button"
       href="https://arsingang-site.arsingang.workers.dev/live/">
      ← بازگشت به استریم
    </a>

    <div class="main-card">

      <h2>حمایت از ArsinGang</h2>

      <!-- بنر دارامت -->
      <div class="banner-container">
        <div class="daramet-embed-banner" id="49505">
          <script src="https://daramet.com/embed/banner.js"></script>
        </div>
      </div>

      <!-- بخش حمایت با پیتزا -->
      <div class="pizza-section">

        <div class="pizza-title">
          می‌خوای یک اسلایس پیتزا مهمونم کنی؟ 🍕
        </div>

        <button class="pizza-button" id="showQR">
          🍕 نمایش QR کد
        </button>

        <!-- کادر QR -->
        <div class="qr-box" id="qrBox">

          <h3>🍕 اسلایس پیتزای من!</h3>

          <div class="qr-image-container">

            <img
              id="qrImage"
              src="./pizza-qr.png"
              alt="QR کد حمایت از ArsinGang"
            >

          </div>

          <div class="error-message" id="qrError">
            تصویر QR پیدا نشد!
            لطفاً فایل pizza-qr.png را کنار donate.html آپلود کن.
          </div>

          <div class="qr-description">
            کد رو با دوربین گوشیت اسکن کن ❤️
            <br>
            مبلغ دونیت:
            <span class="amount">۱۰۰٬۰۰۰ تومان</span>
          </div>

          <a
            class="donate-link"
            href="https://daramet.com/ArsinGang?webintent&donate=100000&message=%DB%8C%DA%A9+%D8%A7%D8%B3%D9%84%D8%A7%DB%8C%D8%B3+%D9%BE%DB%8C%D8%AA%D8%B2%D8%A7+%D9%85%D9%87%D9%85%D9%88%D9%86%D8%AA+%DA%A9%D8%B1%D8%AF%D9%85+%F0%9F%98%82"
            target="_blank"
            rel="noopener noreferrer"
          >
            ورود مستقیم به صفحه دونیت
          </a>

        </div>

      </div>

    </div>
  </div>

  <script>
    const button = document.getElementById("showQR");
    const qrBox = document.getElementById("qrBox");
    const qrImage = document.getElementById("qrImage");
    const qrError = document.getElementById("qrError");

    button.addEventListener("click", function() {

      qrBox.classList.add("show");

      setTimeout(function() {
        qrBox.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }, 150);

    });

    qrImage.addEventListener("error", function() {
      qrError.style.display = "block";
    });

    qrImage.addEventListener("load", function() {
      qrError.style.display = "none";
    });
  </script>

</body>
</html>

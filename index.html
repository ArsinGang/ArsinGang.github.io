<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArsinGang</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237b2cff'/%3E%3Ctext x='50' y='63' text-anchor='middle' font-size='38' font-family='Arial' font-weight='bold' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(123,44,255,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(0,229,255,.12),
            transparent 35%
        ),
        #080812;

    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}

.loader{
    position:fixed;
    inset:0;
    background:#080812;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100;
}

.loader-box{
    width:55px;
    height:55px;

    border-radius:50%;

    border:4px solid rgba(255,255,255,.08);
    border-top-color:#7b2cff;
    border-right-color:#00e5ff;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.main{
    display:none;
}

.container{
    width:min(1050px,92%);
    margin:auto;

    padding:45px 0 70px;

    position:relative;
    z-index:1;
}


/* TOP BUTTONS */

.top-left{
    position:fixed;
    top:20px;
    left:20px;
    z-index:10;
}

.top-right{
    position:fixed;
    top:20px;
    right:20px;
    z-index:10;
}

.top-btn{
    display:block;

    padding:11px 18px;

    border-radius:13px;

    text-decoration:none;
    color:white;

    font-size:13px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            rgba(123,44,255,.28),
            rgba(0,217,255,.18)
        );

    border:1px solid rgba(0,229,255,.35);

    box-shadow:
        0 0 20px rgba(123,44,255,.12);

    transition:.2s;
}

.top-btn:hover{
    transform:translateY(-2px);

    border-color:#00e5ff;

    box-shadow:
        0 0 28px rgba(0,229,255,.22);
}


/* PROFILE */

.profile{
    width:min(520px,100%);

    margin:0 auto 28px;

    padding:13px 18px;

    border-radius:20px;

    background:
        rgba(18,18,35,.78);

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 0 30px rgba(123,44,255,.10);

    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;
}

.avatar{
    width:55px;
    height:55px;

    flex-shrink:0;

    border-radius:50%;

    background:white;

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 18px rgba(255,255,255,.16);
}

.avatar svg{
    width:33px;
    height:33px;

    fill:#171725;
}

.profile-info{
    min-width:0;
    text-align:right;
}

.profile-name-wrap{
    position:relative;
    display:inline-block;
}

.profile-name{
    font-size:18px;
    font-weight:900;
    color:white;
}

.profile-rank{
    margin-top:4px;

    color:#9d9db9;

    font-size:12px;
    font-weight:900;
}


/* VIP / MVP */

.profile.vip .profile-rank{
    color:#c18cff;

    text-shadow:
        0 0 12px rgba(177,93,255,.45);
}

.profile.mvp .profile-rank{
    color:#72efff;

    text-shadow:
        0 0 12px rgba(0,229,255,.40);
}


/* PARTICLES */

.particles{
    position:absolute;

    inset:-12px -18px;

    pointer-events:none;

    display:none;
}

.profile.vip .particles,
.profile.mvp .particles{
    display:block;
}

.particle{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#ffd84d;

    box-shadow:
        0 0 8px rgba(255,216,77,.9);

    animation:
        particleFloat 2.2s ease-in-out infinite;
}

.particle:nth-child(1){
    left:5%;
    top:55%;
}

.particle:nth-child(2){
    left:25%;
    top:5%;
    animation-delay:.4s;
}

.particle:nth-child(3){
    left:50%;
    top:90%;
    animation-delay:.8s;
}

.particle:nth-child(4){
    right:20%;
    top:8%;
    animation-delay:.2s;
}

.particle:nth-child(5){
    right:4%;
    top:60%;
    animation-delay:1s;
}

@keyframes particleFloat{

    0%,100%{
        transform:translateY(0) scale(.8);
        opacity:.35;
    }

    50%{
        transform:translateY(-8px) scale(1.2);
        opacity:1;
    }
}


/* LOGO */

.logo{
    width:72px;
    height:72px;

    margin:0 auto 18px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #7b2cff,
            #00d9ff
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
    font-weight:900;

    box-shadow:
        0 0 25px rgba(123,44,255,.45),
        0 0 45px rgba(0,217,255,.18);
}


/* TITLE */

h1{
    text-align:center;

    font-size:34px;

    margin-bottom:10px;

    text-shadow:
        0 0 18px rgba(160,100,255,.6);
}

.subtitle{
    text-align:center;

    color:#bdbde0;

    font-size:15px;

    line-height:2;

    max-width:700px;

    margin:0 auto 25px;
}

.description{
    text-align:center;

    color:#c9c9df;

    line-height:2;

    font-size:14px;

    max-width:700px;

    margin:0 auto 28px;
}


/* BUTTONS */

.buttons{
    width:min(650px,100%);

    margin:auto;

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:14px;
}

.main-btn{
    display:flex;

    align-items:center;
    justify-content:center;

    min-height:58px;

    padding:14px 18px;

    border-radius:16px;

    text-decoration:none;

    color:white;

    font-size:15px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            rgba(123,44,255,.25),
            rgba(0,217,255,.14)
        );

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 0 22px rgba(123,44,255,.10);

    transition:.2s;
}

.main-btn:hover{
    transform:translateY(-3px);

    border-color:#00e5ff;

    box-shadow:
        0 0 30px rgba(0,229,255,.20),
        0 0 40px rgba(123,44,255,.12);
}


/* FOOTER */

footer{
    text-align:center;

    margin-top:45px;

    color:#666681;

    font-size:12px;
}


/* MOBILE */

@media(max-width:650px){

    .buttons{
        grid-template-columns:1fr;
    }

    .top-left,
    .top-right{
        top:12px;
    }

    .top-left{
        left:12px;
    }

    .top-right{
        right:12px;
    }

    .top-btn{
        padding:9px 12px;
        font-size:11px;
    }

    .profile{
        margin-top:55px;
    }

    h1{
        font-size:28px;
    }
}

</style>
</head>


<body>


<!-- LOADER -->

<div class="loader" id="loader">
    <div class="loader-box"></div>
</div>


<!-- SUPPORT -->

<div class="top-left">
    <a href="contact.html" class="top-btn">
        💬 پشتیبانی
    </a>
</div>


<!-- RANK -->

<div class="top-right">
    <a href="rank.html" class="top-btn">
        👑 رنک‌ها
    </a>
</div>


<!-- MAIN -->

<div class="main" id="main">

<div class="container">


    <!-- PROFILE -->

    <div class="profile" id="profile">

        <div class="avatar">

            <svg viewBox="0 0 24 24">

                <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-6 1.67-6 5v1h12v-1c0-3.33-2.67-5-6-5z"/>

            </svg>

        </div>


        <div class="profile-info">

            <div class="profile-name-wrap">

                <div
                    class="profile-name"
                    id="profileName"
                >
                    در حال بارگذاری...
                </div>


                <div class="particles">

                    <span class="particle"></span>
                    <span class="particle"></span>
                    <span class="particle"></span>
                    <span class="particle"></span>
                    <span class="particle"></span>

                </div>

            </div>


            <div
                class="profile-rank"
                id="profileRank"
            >
                ...
            </div>

        </div>

    </div>


    <!-- LOGO -->

    <div class="logo">
        AG
    </div>


    <!-- TITLE -->

    <h1>
        ArsinGang
    </h1>


    <p class="subtitle">
        به گنگ آرسین خوش اومدی 🎮
    </p>


    <p class="description">
        اینجا مرکز اصلی ArsinGang ـه؛
        از سرور و فعالیت‌ها گرفته تا رنک و امکانات ویژه.
    </p>


    <!-- BUTTONS -->

    <div class="buttons">

        <a
            href="support.html"
            class="main-btn"
        >
            💜 حمایت از ArsinGang
        </a>


        <a
            href="server.html"
            class="main-btn"
        >
            🎮 ورود به سرور
        </a>


        <a
            href="https://arsingang.github.io/live.html"
            class="main-btn"
        >
            🔴 مشاهده لایو
        </a>


        <a
            href="box.html"
            class="main-btn"
        >
            🎁 باکس روزانه
        </a>

    </div>


    <footer>
        © ArsinGang — تمامی حقوق محفوظ است.
    </footer>


</div>

</div>


<script>

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";


let accessToken =
localStorage.getItem(
    "arsin_user_token"
);

let refreshToken =
localStorage.getItem(
    "arsin_user_refresh"
);


/* =========================
   REFRESH TOKEN
========================= */

async function refreshAccessToken(){

    if(!refreshToken){
        return false;
    }

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/token?grant_type=refresh_token",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY
                    },

                    body:JSON.stringify({
                        refresh_token:
                            refreshToken
                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.access_token
        ){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );

            accessToken = null;
            refreshToken = null;

            return false;
        }


        accessToken =
            data.access_token;

        refreshToken =
            data.refresh_token ||
            refreshToken;


        localStorage.setItem(
            "arsin_user_token",
            accessToken
        );

        localStorage.setItem(
            "arsin_user_refresh",
            refreshToken
        );


        return true;

    }catch(error){

        console.error(error);

        return false;
    }
}


/* =========================
   SUPABASE FETCH
========================= */

async function supabaseFetch(
    path,
    options = {},
    retry = true
){

    options.headers = {

        ...(options.headers || {}),

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + accessToken
    };


    let response =
        await fetch(
            SUPABASE_URL + path,
            options
        );


    if(
        response.status === 401 &&
        retry
    ){

        const refreshed =
            await refreshAccessToken();


        if(!refreshed){

            window.location.replace(
                "login.html"
            );

            throw new Error(
                "جلسه ورود منقضی شده است."
            );
        }


        options.headers[
            "Authorization"
        ] =
            "Bearer " + accessToken;


        response =
            await fetch(
                SUPABASE_URL + path,
                options
            );
    }


    return response;
}


/* =========================
   CHECK USER
========================= */

async function checkUser(){

    if(!accessToken){

        const refreshed =
            await refreshAccessToken();


        if(!refreshed){

            window.location.replace(
                "login.html"
            );

            return false;
        }
    }


    try{

        const response =
            await supabaseFetch(
                "/auth/v1/user"
            );


        if(!response.ok){

            window.location.replace(
                "login.html"
            );

            return false;
        }


        return true;

    }catch(error){

        console.error(error);

        window.location.replace(
            "login.html"
        );

        return false;
    }
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    try{

        /*
         * کاربر لاگین‌شده
         */

        const userResponse =
            await supabaseFetch(
                "/auth/v1/user"
            );


        const user =
            await userResponse.json();


        if(!userResponse.ok){

            throw new Error(
                "خطا در دریافت کاربر"
            );
        }


        /*
         * فقط Username ثبت‌شده
         *
         * ایمیل اصلاً استفاده نمی‌شود.
         */

        const username =
            user.user_metadata &&
            user.user_metadata.username;


        /*
         * دریافت Rank همین کاربر
         */

        const rankResponse =
            await supabaseFetch(
                "/rest/v1/rpc/get_my_gang_account",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:"{}"
                }
            );


        const rankData =
            await rankResponse.json();


        if(!rankResponse.ok){

            throw new Error(
                rankData.message ||
                "خطا در دریافت Rank"
            );
        }


        const account =
            Array.isArray(rankData)
            ? rankData[0]
            : rankData;


        /*
         * نمایش Username
         */

        document.getElementById(
            "profileName"
        ).textContent =
            username ||
            "کاربر";


        /*
         * نمایش Rank
         */

        let rank =
            String(
                account?.rank ||
                "USER"
            ).toUpperCase();


        if(
            !rank ||
            rank === "NONE" ||
            rank === "NULL"
        ){

            rank = "USER";
        }


        document.getElementById(
            "profileRank"
        ).textContent =
            rank;


        /*
         * کلاس رنک
         */

        const profile =
            document.getElementById(
                "profile"
            );


        profile.classList.remove(
            "vip",
            "mvp"
        );


        if(rank === "VIP"){

            profile.classList.add(
                "vip"
            );

        }else if(rank === "MVP"){

            profile.classList.add(
                "mvp"
            );
        }


    }catch(error){

        console.error(
            "PROFILE ERROR:",
            error
        );


        /*
         * اگر دریافت اطلاعات شکست خورد،
         * دیگر ایمیل را به‌جای Username نشان نمی‌دهیم.
         */

        document.getElementById(
            "profileName"
        ).textContent =
            "خطا در دریافت نام";


        document.getElementById(
            "profileRank"
        ).textContent =
            "USER";
    }
}


/* =========================
   START
========================= */

(async function(){

    const loggedIn =
        await checkUser();


    if(!loggedIn){
        return;
    }


    await loadProfile();


    document.getElementById(
        "main"
    ).style.display =
        "block";


    document.getElementById(
        "loader"
    ).style.display =
        "none";

})();

</script>

</body>

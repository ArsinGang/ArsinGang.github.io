<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArsinGang | صفحه اصلی</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237b2cff'/%3E%3Ctext x='50' y='63' text-anchor='middle' font-size='38' font-family='Arial' font-weight='bold' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top,#24104d 0%,#0b0714 45%,#05030a 100%);
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 20%,rgba(123,44,255,.12),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(0,229,255,.08),transparent 30%);
}

.loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#05030a;
    z-index:9999;
}

.loader{
    width:55px;
    height:55px;
    border:5px solid rgba(255,255,255,.15);
    border-top-color:#8b3dff;
    border-right-color:#00e5ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#mainContent{
    display:none;
    position:relative;
    z-index:1;
}

.container{
    width:min(900px,92%);
    margin:auto;
    padding:70px 0 40px;
    text-align:center;
}

.logo{
    width:105px;
    height:105px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:28px;
    background:linear-gradient(135deg,#7b2cff,#00cfff);
    box-shadow:
        0 0 25px rgba(123,44,255,.6),
        0 0 45px rgba(0,229,255,.25);
    font-size:38px;
    font-weight:bold;
}

h1{
    margin:25px 0 8px;
    font-size:42px;
    text-shadow:0 0 20px rgba(150,70,255,.7);
}

.subtitle{
    color:#cfc7dd;
    font-size:17px;
    margin-bottom:8px;
}

.description{
    color:#9990aa;
    font-size:14px;
    margin-bottom:35px;
}

.buttons{
    display:grid;
    gap:15px;
    width:min(600px,100%);
    margin:auto;
}

.main-btn{
    display:block;
    text-decoration:none;
    color:white;
    padding:18px 20px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.055);
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    font-size:16px;
    transition:.25s;
}

.main-btn:hover{
    transform:translateY(-3px);
    border-color:#8b3dff;
    box-shadow:
        0 0 20px rgba(123,44,255,.35),
        0 10px 30px rgba(0,0,0,.3);
}

.support{
    position:fixed;
    top:18px;
    left:18px;
    z-index:20;
}

.rank{
    position:fixed;
    top:18px;
    right:18px;
    z-index:20;
}

.top-btn{
    display:block;
    text-decoration:none;
    color:white;
    padding:11px 17px;
    border-radius:12px;
    background:rgba(25,15,45,.9);
    border:1px solid rgba(139,61,255,.5);
    box-shadow:0 0 18px rgba(123,44,255,.25);
    font-size:14px;
    transition:.25s;
}

.top-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(123,44,255,.55);
}

footer{
    margin-top:45px;
    color:#777080;
    font-size:13px;
}


/* =========================
   PROFILE
========================= */

.profile{
    position:fixed;
    top:18px;
    right:145px;
    z-index:20;
}

.profile-box{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:190px;
    padding:8px 12px 8px 10px;
    border-radius:14px;
    background:rgba(25,15,45,.92);
    border:1px solid rgba(139,61,255,.5);
    box-shadow:0 0 18px rgba(123,44,255,.25);
}

.avatar{
    width:38px;
    height:38px;
    flex-shrink:0;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 12px rgba(255,255,255,.18);
}

.avatar svg{
    width:23px;
    height:23px;
    display:block;
}

.profile-info{
    min-width:0;
    text-align:right;
}

.profile-name-wrap{
    position:relative;
    display:inline-block;
}

.profile-name{
    display:block;
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
    font-weight:bold;
    color:white;
}

.profile-rank{
    display:block;
    margin-top:3px;
    font-size:10px;
    color:#aaa0b8;
    text-transform:uppercase;
}

.profile.vip .profile-name,
.profile.mvp .profile-name{
    text-shadow:
        0 0 7px rgba(255,215,0,.8),
        0 0 15px rgba(255,190,0,.45);
}

.rank-particles{
    position:absolute;
    inset:-10px -15px;
    pointer-events:none;
    overflow:visible;
    display:none;
}

.profile.vip .rank-particles,
.profile.mvp .rank-particles{
    display:block;
}

.rank-particles span{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#ffd83d;
    box-shadow:0 0 6px #ffd83d;
    animation:particleFloat 2s infinite ease-in-out;
}

.rank-particles span:nth-child(1){
    left:5%;
    top:60%;
    animation-delay:0s;
}

.rank-particles span:nth-child(2){
    left:25%;
    top:5%;
    animation-delay:.4s;
}

.rank-particles span:nth-child(3){
    left:65%;
    top:0;
    animation-delay:.8s;
}

.rank-particles span:nth-child(4){
    left:90%;
    top:55%;
    animation-delay:1.2s;
}

.rank-particles span:nth-child(5){
    left:45%;
    top:90%;
    animation-delay:1.6s;
}

@keyframes particleFloat{

    0%,100%{
        transform:translateY(0) scale(1);
        opacity:.35;
    }

    50%{
        transform:translateY(-7px) scale(1.4);
        opacity:1;
    }

}


@media(max-width:600px){

    .container{
        padding-top:85px;
    }

    h1{
        font-size:32px;
    }

    .logo{
        width:90px;
        height:90px;
        font-size:32px;
    }

    .top-btn{
        font-size:12px;
        padding:9px 12px;
    }

    .support{
        left:10px;
    }

    .rank{
        right:10px;
    }

    .profile{
        top:65px;
        right:10px;
    }

}

</style>
</head>

<body>

<div class="loading" id="loading">
    <div class="loader"></div>
</div>

<div id="mainContent">

    <div class="support">
        <a class="top-btn" href="/contact/">
            📩 پشتیبانی
        </a>
    </div>

    <div class="rank">
        <a class="top-btn" href="/rank/">
            👑 خرید رنک
        </a>
    </div>


    <!-- PROFILE -->

    <div class="profile" id="profile">

        <div class="profile-box">

            <div class="avatar">

                <!-- Simple contact/person icon -->
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true">

                    <circle
                        cx="12"
                        cy="8"
                        r="4"
                        stroke="#5b2bbf"
                        stroke-width="2"
                    />

                    <path
                        d="M4.5 20C5.3 16.6 8 14.5 12 14.5C16 14.5 18.7 16.6 19.5 20"
                        stroke="#5b2bbf"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

            <div class="profile-info">

                <div class="profile-name-wrap">

                    <div
                        class="profile-name"
                        id="profileName"
                    >
                        در حال بارگذاری...
                    </div>

                    <div
                        class="rank-particles"
                        id="rankParticles"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <div
                    class="profile-rank"
                    id="profileRank"
                >
                    USER
                </div>

            </div>

        </div>

    </div>


    <main class="container">

        <div class="logo">
            AG
        </div>

        <h1>ArsinGang</h1>

        <div class="subtitle">
            به دنیای ArsinGang خوش اومدی 🎮💜
        </div>

        <div class="description">
            دنیای گیم، Minecraft و کلی محتوای جذاب!
        </div>

        <div class="buttons">

            <a class="main-btn" href="/support/">
                💜 حمایت مالی از ArsinGang
            </a>

            <a class="main-btn" href="/server/">
                ⛏️ سرور Minecraft ArsinGang
            </a>

            <a class="main-btn" href="/live/">
                🔴 مشاهده استریم ArsinGang
            </a>

            <a class="main-btn" href="/box/">
                🎁 باکس مرموز ArsinGang
            </a>

        </div>

        <footer>
            ArsinGang 🎮 © 2026 ArsinGang
        </footer>

    </main>

</div>

<script>

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";

let accessToken =
localStorage.getItem("arsin_user_token");

let refreshToken =
localStorage.getItem("arsin_user_refresh");


async function refreshAccessToken(){

    if(!refreshToken){
        return false;
    }

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=refresh_token",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY
                },

                body:JSON.stringify({
                    refresh_token:refreshToken
                })
            }
        );

        const data = await response.json();

        if(
            !response.ok ||
            !data.access_token
        ){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );

            accessToken = null;
            refreshToken = null;

            return false;
        }

        accessToken =
            data.access_token;

        refreshToken =
            data.refresh_token ||
            refreshToken;

        localStorage.setItem(
            "arsin_user_token",
            accessToken
        );

        localStorage.setItem(
            "arsin_user_refresh",
            refreshToken
        );

        return true;

    }catch(error){

        console.error(
            "Refresh error:",
            error
        );

        return false;

    }

}


/* =========================
   GET USER
========================= */

async function getUser(){

    let response = await fetch(
        SUPABASE_URL +
        "/auth/v1/user",
        {
            method:"GET",

            headers:{
                "apikey":SUPABASE_KEY,
                "Authorization":
                    "Bearer " + accessToken
            }
        }
    );


    if(response.status === 401){

        const refreshed =
            await refreshAccessToken();

        if(!refreshed){
            return null;
        }


        response = await fetch(
            SUPABASE_URL +
            "/auth/v1/user",
            {
                method:"GET",

                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + accessToken
                }
            }
        );

    }


    if(!response.ok){

        console.error(
            "User request failed:",
            response.status
        );

        return null;
    }


    const user =
        await response.json();


    if(!user || !user.id){
        return null;
    }


    return user;

}


/* =========================
   GET RANK
========================= */

async function getRank(){

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/rpc/get_my_gang_account",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + accessToken
                },

                body:"{}"
            }
        );


        if(!response.ok){

            console.error(
                "Rank request failed:",
                response.status,
                await response.text()
            );

            return "USER";
        }


        const data =
            await response.json();


        const account =
            Array.isArray(data)
                ? data[0]
                : data;


        if(
            account &&
            account.rank
        ){

            return String(
                account.rank
            ).toUpperCase();

        }


        return "USER";

    }catch(error){

        console.error(
            "Rank error:",
            error
        );

        return "USER";

    }

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(user){

    const nameElement =
        document.getElementById(
            "profileName"
        );

    const rankElement =
        document.getElementById(
            "profileRank"
        );

    const profileElement =
        document.getElementById(
            "profile"
        );


    /*
       username فقط از metadata حساب
       فعلی خوانده می‌شود.
    */

    const metadata =
        user.user_metadata || {};

    const username =
        typeof metadata.username === "string"
            ? metadata.username.trim()
            : "";


    if(username){

        nameElement.textContent =
            username;

    }else{

        nameElement.textContent =
            "نام ثبت نشده";

        console.warn(
            "این حساب username ندارد.",
            metadata
        );

    }


    const rank =
        await getRank();


    rankElement.textContent =
        rank;


    profileElement.classList.remove(
        "vip",
        "mvp"
    );


    if(rank === "VIP"){

        profileElement.classList.add(
            "vip"
        );

    }


    if(rank === "MVP"){

        profileElement.classList.add(
            "mvp"
        );

    }

}


/* =========================
   CHECK USER
========================= */

async function checkUser(){

    if(!accessToken){

        window.location.replace(
            "/login/"
        );

        return;
    }

    try{

        const user =
            await getUser();


        if(!user){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );

            window.location.replace(
                "/login/"
            );

            return;
        }


        await loadProfile(
            user
        );


        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "mainContent"
        ).style.display = "block";


    }catch(error){

        console.error(
            "User system error:",
            error
        );

        window.location.replace(
            "/login/"
        );

    }

}


checkUser();

</script>

</body>
</html>

    * {
        box-sizing: border-box;

    body {

        background:

            linear-gradient(135deg, #070014, #100021 45%, #020b18);

        justify-content: center;
        align-items: center;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: rgba(120, 40, 255, 0.12);
        filter: blur(100px);
        top: -180px;
        left: -180px;
        pointer-events: none;
    }

    body::after {
        content: "";
        position: fixed;
        width: 450px;
        height: 450px;
        border-radius: 50%;
        background: rgba(0, 200, 255, 0.10);

        bottom: -180px;
        right: -180px;
        pointer-events: none;
    }

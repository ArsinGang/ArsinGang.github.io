<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arsin Gang | حمایت مالی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Tahoma, sans-serif;
    color: white;
    text-align: center;

    background:
        radial-gradient(circle at 20% 20%, rgba(130,40,255,.30), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(0,220,255,.20), transparent 35%),
        linear-gradient(135deg,#080014,#18002d,#001522);
}

.box {
    width: 90%;
    max-width: 700px;
    margin: 80px auto;
    padding: 45px 25px;
    border-radius: 28px;

    background: rgba(15,10,30,.82);

    border: 1px solid rgba(255,255,255,.12);

    box-shadow:
        0 0 35px rgba(120,40,255,.35),
        0 20px 60px rgba(0,0,0,.45);
}

.logo {
    width: 90px;
    height: 90px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 24px;

    font-size: 32px;
    font-weight: bold;

    background: linear-gradient(135deg,#7b2cff,#00d9ff);

    box-shadow:
        0 0 25px rgba(123,44,255,.7),
        0 0 45px rgba(0,217,255,.25);
}

h1 {
    margin: 0;

    font-size: 55px;
    font-weight: 900;

    background: linear-gradient(90deg,#ffffff,#b987ff,#45eaff);

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    margin-top: 15px;

    font-size: 20px;

    color: #ddd6ed;
}

.line {
    width: 110px;
    height: 4px;

    margin: 25px auto;

    border-radius: 10px;

    background: linear-gradient(90deg,#7b2cff,#00d9ff);

    box-shadow: 0 0 18px rgba(0,217,255,.6);
}

.description {
    color: #c9c3d8;

    font-size: 17px;

    line-height: 1.8;

    margin-bottom: 30px;
}

.support-button {
    display: inline-block;

    padding: 18px 45px;

    border-radius: 15px;

    color: white;

    text-decoration: none;

    font-size: 20px;

    font-weight: bold;

    background: linear-gradient(90deg,#7b2cff,#00bde8);

    box-shadow:
        0 0 20px rgba(123,44,255,.55),
        0 0 35px rgba(0,190,232,.25);

    transition: .25s;
}

.support-button:hover {
    transform: scale(1.06);

    box-shadow:
        0 0 30px rgba(123,44,255,.8),
        0 0 50px rgba(0,217,255,.5);
}

.footer {
    margin-top: 30px;

    color: #77718a;

    font-size: 14px;
}

.footer span {
    color: #a66cff;
}
</style>

</head>

<body>

<div class="box">

```
<div class="logo">
    AG
</div>

<h1>Arsin Gang</h1>

<div class="subtitle">
    از Arsin_Gang حمایت مالی کن 💜
</div>

<div class="line"></div>

<div class="description">
    اگر از محتواهای Arsin Gang لذت می‌بری،
    می‌تونی با حمایتت کمک کنی تا محتوای بیشتری بسازیم! 🎮✨
</div>

<a
    class="support-button"
    href="https://daramet.com/ArsinGang"
    target="_blank">
    💜 حمایت از Arsin Gang
</a>

<div class="footer">
    ساخته شده برای <span>Arsin Gang</span> 🎮
</div>
```

</div>

</body>
</html>

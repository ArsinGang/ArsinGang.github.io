<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237b2cff'/%3E%3Ctext x='50' y='63' text-anchor='middle' font-size='38' font-family='Arial' font-weight='bold' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;

    background:
        radial-gradient(circle at top,#24104d 0%,#0b0714 45%,#05030a 100%);

    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(circle at 20% 20%,rgba(123,44,255,.12),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(0,229,255,.08),transparent 30%);
}

.loading{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#05030a;

    z-index:9999;
}

.loader{
    width:55px;
    height:55px;

    border:5px solid rgba(255,255,255,.15);

    border-top-color:#8b3dff;
    border-right-color:#00e5ff;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#mainContent{
    display:none;
    position:relative;
    z-index:1;
}


/* =========================
   PROFILE
========================= */

.user-profile{
    position:fixed;

    top:18px;
    right:145px;

    min-width:205px;

    padding:8px 12px 8px 10px;

    display:flex;
    align-items:center;

    gap:10px;

    direction:rtl;

    background:rgba(15,9,28,.92);

    border:1px solid rgba(139,61,255,.45);

    border-radius:16px;

    box-shadow:
        0 0 20px rgba(123,44,255,.2),
        inset 0 0 12px rgba(255,255,255,.02);

    backdrop-filter:blur(10px);

    z-index:50;
}


/* AVATAR */

.profile-avatar{
    width:42px;
    height:42px;

    flex-shrink:0;

    border-radius:50%;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 10px rgba(255,255,255,.25);

    position:relative;
}


/* PERSON ICON */

.person-icon{
    position:relative;

    width:21px;
    height:21px;
}

.person-icon::before{
    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#777;

    top:0;
    left:50%;

    transform:translateX(-50%);
}

.person-icon::after{
    content:"";

    position:absolute;

    width:17px;
    height:9px;

    border-radius:10px 10px 5px 5px;

    background:#777;

    bottom:0;
    left:50%;

    transform:translateX(-50%);
}


/* PROFILE TEXT */

.profile-info{
    min-width:0;

    text-align:right;
}

.profile-name-wrap{
    position:relative;

    display:inline-block;

    max-width:125px;
}

.profile-name{
    position:relative;

    display:block;

    max-width:125px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    font-size:14px;
    font-weight:bold;

    color:white;

    z-index:2;
}

.profile-rank{
    display:inline-block;

    margin-top:3px;

    padding:2px 7px;

    border-radius:6px;

    font-size:9px;
    font-weight:bold;

    letter-spacing:.5px;
}

.profile-rank.owner{
    color:#fff;

    background:
        linear-gradient(135deg,#7b2cff,#00cfff);

    box-shadow:
        0 0 8px rgba(123,44,255,.4);
}

.profile-rank.mvp{
    color:#fff;

    background:#b87900;

    box-shadow:
        0 0 8px rgba(255,193,7,.4);
}

.profile-rank.vip{
    color:#111;

    background:#ffd83d;

    box-shadow:
        0 0 8px rgba(255,216,61,.45);
}

.profile-rank.none{
    color:#aaa;

    background:rgba(255,255,255,.08);
}


/* =========================
   GOLD PARTICLES
========================= */

.gold-particles{
    position:absolute;

    inset:-12px -18px;

    pointer-events:none;

    z-index:1;
}

.gold-particles span{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#ffd83d;

    box-shadow:
        0 0 5px #ffd83d,
        0 0 10px rgba(255,216,61,.7);

    animation:floatParticle 2.8s ease-in-out infinite;
}

.gold-particles span:nth-child(1){
    top:10%;
    left:8%;
    animation-delay:0s;
}

.gold-particles span:nth-child(2){
    top:75%;
    left:18%;
    animation-delay:.5s;
}

.gold-particles span:nth-child(3){
    top:15%;
    right:10%;
    animation-delay:1s;
}

.gold-particles span:nth-child(4){
    top:80%;
    right:20%;
    animation-delay:1.5s;
}

.gold-particles span:nth-child(5){
    top:45%;
    left:-3%;
    animation-delay:2s;
}

.gold-particles span:nth-child(6){
    top:40%;
    right:-3%;
    animation-delay:2.5s;
}

@keyframes floatParticle{

    0%,100%{
        transform:translate(0,0) scale(.7);
        opacity:.3;
    }

    50%{
        transform:translate(0,-7px) scale(1.2);
        opacity:1;
    }

}


/* =========================
   MAIN
========================= */

.container{
    width:min(900px,92%);

    margin:auto;

    padding:70px 0 40px;

    text-align:center;
}

.logo{
    width:105px;
    height:105px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:28px;

    background:
        linear-gradient(135deg,#7b2cff,#00cfff);

    box-shadow:
        0 0 25px rgba(123,44,255,.6),
        0 0 45px rgba(0,229,255,.25);

    font-size:38px;
    font-weight:bold;
}

h1{
    margin:25px 0 8px;

    font-size:42px;

    text-shadow:
        0 0 20px rgba(150,70,255,.7);
}

.subtitle{
    color:#cfc7dd;

    font-size:17px;

    margin-bottom:8px;
}

.description{
    color:#9990aa;

    font-size:14px;

    margin-bottom:35px;
}

.buttons{
    display:grid;

    gap:15px;

    width:min(600px,100%);

    margin:auto;
}

.main-btn{
    display:block;

    text-decoration:none;

    color:white;

    padding:18px 20px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.1);

    background:rgba(255,255,255,.055);

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);

    font-size:16px;

    transition:.25s;
}

.main-btn:hover{
    transform:translateY(-3px);

    border-color:#8b3dff;

    box-shadow:
        0 0 20px rgba(123,44,255,.35),
        0 10px 30px rgba(0,0,0,.3);
}


/* =========================
   TOP BUTTONS
========================= */

.support{
    position:fixed;

    top:18px;
    left:18px;

    z-index:20;
}

.rank{
    position:fixed;

    top:18px;
    right:18px;

    z-index:20;
}

.top-btn{
    display:block;

    text-decoration:none;

    color:white;

    padding:11px 17px;

    border-radius:12px;

    background:rgba(25,15,45,.9);

    border:1px solid rgba(139,61,255,.5);

    box-shadow:
        0 0 18px rgba(123,44,255,.25);

    font-size:14px;

    transition:.25s;
}

.top-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 25px rgba(123,44,255,.55);
}


/* =========================
   FOOTER
========================= */

footer{
    margin-top:45px;

    color:#777080;

    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .user-profile{
        right:10px;
        top:65px;

        min-width:175px;
    }

    .rank{
        top:18px;
        right:10px;
    }

    .container{
        padding-top:125px;
    }

}


@media(max-width:600px){

    h1{
        font-size:32px;
    }

    .logo{
        width:90px;
        height:90px;

        font-size:32px;
    }

    .top-btn{
        font-size:12px;

        padding:9px 12px;
    }

    .support{
        left:10px;
    }

    .profile-name{
        max-width:105px;
    }

}

</style>
</head>

<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";


let accessToken =
localStorage.getItem(
    "arsin_user_token"
);


let refreshToken =
localStorage.getItem(
    "arsin_user_refresh"
);


/* =========================
   REFRESH TOKEN
========================= */

async function refreshAccessToken(){

    if(!refreshToken){

        return false;

    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/token?grant_type=refresh_token",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json",
                        "apikey":SUPABASE_KEY
                    },

                    body:JSON.stringify({
                        refresh_token:refreshToken
                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.access_token
        ){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );

            accessToken = null;
            refreshToken = null;

            return false;

        }


        accessToken =
            data.access_token;


        refreshToken =
            data.refresh_token ||
            refreshToken;


        localStorage.setItem(
            "arsin_user_token",
            accessToken
        );


        localStorage.setItem(
            "arsin_user_refresh",
            refreshToken
        );


        return true;


    }catch(error){

        return false;

    }

}


/* =========================
   LOAD ACCOUNT
========================= */

async function loadAccount(){

    try{

        /*
         * گرفتن اطلاعات حساب از gang_users
         */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/get_my_gang_account",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json",
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    },

                    body:"{}"
                }
            );


        if(!response.ok){

            return;

        }


        const data =
            await response.json();


        /*
         * تابع RPC ممکن است
         * یک آبجکت یا آرایه برگرداند
         */

        const account =
            Array.isArray(data)
                ? data[0]
                : data;


        /*
         * اسم کاربر از Supabase Auth
         */

        const userResponse =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    method:"GET",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    }
                }
            );


        if(!userResponse.ok){

            return;

        }


        const user =
            await userResponse.json();


        let username =
            user?.user_metadata?.username;


        /*
         * اگر username وجود نداشت،
         * ایمیل قبل از @ نمایش داده می‌شود.
         */

        if(
            !username ||
            !username.trim()
        ){

            username =
                user?.email?.split("@")[0] ||
                "USER";

        }


        username =
            username.trim();


        /*
         * اسم
         */

        document.getElementById(
            "profileName"
        ).textContent =
            username;


        /*
         * رنک
         */

        let rank =
            account?.rank ||
            "NONE";


        rank =
            rank.toString()
                .trim()
                .toUpperCase();


        const rankElement =
            document.getElementById(
                "profileRank"
            );


        const particles =
            document.getElementById(
                "goldParticles"
            );


        /*
         * OWNER
         *
         * فقط حساب Arsin_Gang
         */

        if(username === "Arsin_Gang"){

            rank = "OWNER";

        }


        /*
         * تنظیم ظاهر رنک
         */

        rankElement.className =
            "profile-rank";


        if(rank === "OWNER"){

            rankElement.classList.add(
                "owner"
            );

            rankElement.textContent =
                "OWNER";

            particles.style.display =
                "none";

        }

        else if(rank === "MVP"){

            rankElement.classList.add(
                "mvp"
            );

            rankElement.textContent =
                "MVP";

            particles.style.display =
                "block";

        }

        else if(rank === "VIP"){

            rankElement.classList.add(
                "vip"
            );

            rankElement.textContent =
                "VIP";

            particles.style.display =
                "block";

        }

        else{

            rankElement.classList.add(
                "none"
            );

            rankElement.textContent =
                "USER";

            particles.style.display =
                "none";

        }


    }catch(error){

        /*
         * اگر مشکلی در دریافت اطلاعات
         * پروفایل پیش آمد، سایت همچنان
         * باز می‌شود.
         */

        document.getElementById(
            "profileName"
        ).textContent =
            "USER";

    }

}


/* =========================
   CHECK USER
========================= */

async function checkUser(){

    if(!accessToken){

        window.location.replace(
            "login.html"
        );

        return;

    }


    try{

        let response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    method:"GET",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    }
                }
            );


        /*
         * توکن منقضی شده
         */

        if(response.status === 401){

            const refreshed =
                await refreshAccessToken();


            if(!refreshed){

                window.location.replace(
                    "login.html"
                );

                return;

            }


            response =
                await fetch(
                    SUPABASE_URL +
                    "/auth/v1/user",
                    {
                        method:"GET",

                        headers:{
                            "apikey":SUPABASE_KEY,
                            "Authorization":
                                "Bearer " + accessToken
                        }
                    }
                );

        }


        /*
         * ورود نامعتبر
         */

        if(!response.ok){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );


            window.location.replace(
                "login.html"
            );

            return;

        }


        const user =
            await response.json();


        if(
            !user ||
            !user.id
        ){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );


            window.location.replace(
                "login.html"
            );

            return;

        }


        /*
         * گرفتن پروفایل و رنک
         */

        await loadAccount();


        /*
         * نمایش سایت
         */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "mainContent"
        ).style.display =
            "block";


    }catch(error){

        window.location.replace(
            "login.html"
        );

    }

}


/* =========================
   START
========================= */

checkUser();

</script>

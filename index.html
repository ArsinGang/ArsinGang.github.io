<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArsinGang</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Tahoma, sans-serif;
    color: white;
    text-align: center;
    background:
        radial-gradient(circle at 20% 20%, rgba(130,40,255,.30), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(0,220,255,.20), transparent 35%),
        linear-gradient(135deg,#080014,#18002d,#001522);
}

.container {
    width: 90%;
    max-width: 700px;
    margin: 0 auto;
    padding: 80px 20px;
}

.logo {
    width: 95px;
    height: 95px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 25px;
    font-size: 34px;
    font-weight: bold;
    background: linear-gradient(135deg,#7b2cff,#00d9ff);
    box-shadow: 0 0 35px rgba(123,44,255,.65);
}

h1 {
    font-size: 55px;
    margin: 20px 0 10px;
    background: linear-gradient(90deg,#fff,#b987ff,#45eaff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #d8d2e8;
    font-size: 19px;
    margin-bottom: 35px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.button {
    display: block;
    padding: 22px;
    border-radius: 18px;
    color: white;
    text-decoration: none;
    font-size: 21px;
    font-weight: bold;
    background: rgba(20,15,40,.85);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 0 25px rgba(123,44,255,.18);
    transition: .25s;
}

.button:hover {
    transform: scale(1.04);
    box-shadow: 0 0 30px rgba(123,44,255,.55);
}

.donate {
    border-color: rgba(180,100,255,.35);
}

.server {
    border-color: rgba(0,220,255,.30);
}

.footer {
    margin-top: 35px;
    color: #77718a;
    font-size: 14px;
}
</style>

</head>

<body>

<div class="container">

```
<div class="logo">AG</div>

<h1>ArsinGang</h1>

<div class="subtitle">
    به دنیای ArsinGang خوش اومدی 🎮
</div>

<div class="menu">

    <a class="button donate" href="support.html">
        💜 حمایت مالی از ArsinGang
    </a>

    <a class="button server" href="server.html">
        ⛏️ سرور Minecraft ArsinGang
    </a>

</div>

<div class="footer">
    ArsinGang 🎮
</div>
```

</div>

</body>
</html>

<script>

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";


let accessToken =
localStorage.getItem("arsin_user_token");

let refreshToken =
localStorage.getItem("arsin_user_refresh");


async function refreshAccessToken(){

if(!refreshToken){
return false;
}

try{

const response = await fetch(
SUPABASE_URL +
"/auth/v1/token?grant_type=refresh_token",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},

body:JSON.stringify({
refresh_token:refreshToken
})
}
);

const data = await response.json();

if(!response.ok || !data.access_token){

localStorage.removeItem("arsin_user_token");
localStorage.removeItem("arsin_user_refresh");

accessToken = null;
refreshToken = null;

return false;
}


accessToken = data.access_token;

refreshToken =
data.refresh_token || refreshToken;


localStorage.setItem(
"arsin_user_token",
accessToken
);

localStorage.setItem(
"arsin_user_refresh",
refreshToken
);

return true;

}catch(error){

return false;

}

}


async function checkUser(){

if(!accessToken){

window.location.replace("login.html");
return;
}


try{

let response = await fetch(
SUPABASE_URL + "/auth/v1/user",
{
method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + accessToken
}
}
);


if(response.status === 401){

const refreshed =
await refreshAccessToken();

if(!refreshed){

window.location.replace("login.html");
return;
}


response = await fetch(
SUPABASE_URL + "/auth/v1/user",
{
method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + accessToken
}
}
);

}


if(!response.ok){

localStorage.removeItem("arsin_user_token");
localStorage.removeItem("arsin_user_refresh");

window.location.replace("login.html");
return;

}


const user = await response.json();


if(!user || !user.id){

localStorage.removeItem("arsin_user_token");
localStorage.removeItem("arsin_user_refresh");

window.location.replace("login.html");
return;

}


/*
   کاربر معتبر است.
   حالا صفحه اصلی نمایش داده می‌شود.
*/

document.getElementById("loading").style.display =
"none";

document.getElementById("mainContent").style.display =
"block";


}catch(error){

window.location.replace("login.html");

}

}


checkUser();

</script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top,#24104d 0%,#0b0714 45%,#05030a 100%);
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 20%,rgba(123,44,255,.12),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(0,229,255,.08),transparent 30%);
}

.loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#05030a;
    z-index:9999;
}

.loader{
    width:55px;
    height:55px;
    border:5px solid rgba(255,255,255,.15);
    border-top-color:#8b3dff;
    border-right-color:#00e5ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#mainContent{
    display:none;
    position:relative;
    z-index:1;
}

.container{
    width:min(900px,92%);
    margin:auto;
    padding:70px 0 40px;
    text-align:center;
}

.logo{
    width:105px;
    height:105px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:28px;
    background:linear-gradient(135deg,#7b2cff,#00cfff);
    box-shadow:
        0 0 25px rgba(123,44,255,.6),
        0 0 45px rgba(0,229,255,.25);
    font-size:38px;
    font-weight:bold;
}

h1{
    margin:25px 0 8px;
    font-size:42px;
    text-shadow:0 0 20px rgba(150,70,255,.7);
}

.subtitle{
    color:#cfc7dd;
    font-size:17px;
    margin-bottom:8px;
}

.description{
    color:#9990aa;
    font-size:14px;
    margin-bottom:35px;
}

.buttons{
    display:grid;
    gap:15px;
    width:min(600px,100%);
    margin:auto;
}

.main-btn{
    display:block;
    text-decoration:none;
    color:white;
    padding:18px 20px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.055);
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    font-size:16px;
    transition:.25s;
}

.main-btn:hover{
    transform:translateY(-3px);
    border-color:#8b3dff;
    box-shadow:
        0 0 20px rgba(123,44,255,.35),
        0 10px 30px rgba(0,0,0,.3);
}

.support{
    position:fixed;
    top:18px;
    left:18px;
    z-index:20;
}

.rank{
    position:fixed;
    top:18px;
    right:18px;
    z-index:20;
}

.top-btn{
    display:block;
    text-decoration:none;
    color:white;
    padding:11px 17px;
    border-radius:12px;
    background:rgba(25,15,45,.9);
    border:1px solid rgba(139,61,255,.5);
    box-shadow:0 0 18px rgba(123,44,255,.25);
    font-size:14px;
    transition:.25s;
}

.top-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(123,44,255,.55);
}

footer{
    margin-top:45px;
    color:#777080;
    font-size:13px;
}

@media(max-width:600px){

    .container{
        padding-top:85px;
    }

    h1{
        font-size:32px;
    }

    .logo{
        width:90px;
        height:90px;
        font-size:32px;
    }

    .top-btn{
        font-size:12px;
        padding:9px 12px;
    }

    .support{
        left:10px;
    }

    .rank{
        right:10px;
    }

}

</style>
</head>

<body>

<div class="loading" id="loading">

</div>

<div id="mainContent">

    <main class="container">

        <div class="logo">

        <h1>ArsinGang</h1>

        <div class="subtitle">
            به دنیای ArsinGang خوش اومدی 🎮💜
        </div>

        <div class="description">
            دنیای گیم، Minecraft و کلی محتوای جذاب!
        </div>

            <a class="main-btn" href="support.html">
                💜 حمایت مالی از ArsinGang
            </a>

            <a class="main-btn" href="server.html">

            <a class="main-btn" href="box.html">

            </a>

        </div>

        <footer>
            ArsinGang 🎮 © 2026 ArsinGang
        </footer>

    </main>

</div>

<script>

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";

let accessToken =
localStorage.getItem("arsin_user_token");

let refreshToken =
localStorage.getItem("arsin_user_refresh");


async function refreshAccessToken(){

    if(!refreshToken){
        return false;
    }

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=refresh_token",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY
                },

                body:JSON.stringify({
                    refresh_token:refreshToken
                })
            }
        );

        const data = await response.json();

        if(
            !response.ok ||
            !data.access_token
        ){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );

            accessToken = null;
            refreshToken = null;

            return false;
        }

        accessToken =
            data.access_token;

        refreshToken =
            data.refresh_token ||
            refreshToken;

        localStorage.setItem(
            "arsin_user_token",
            accessToken
        );

        localStorage.setItem(
            "arsin_user_refresh",
            refreshToken
        );

        return true;

    }catch(error){

        return false;

    }

}


async function checkUser(){

    if(!accessToken){

        window.location.replace(
            "login.html"
        );

        return;
    }

    try{

        let response = await fetch(
            SUPABASE_URL +
            "/auth/v1/user",
            {
                method:"GET",

                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + accessToken
                }
            }
        );


        if(response.status === 401){

            const refreshed =
                await refreshAccessToken();

            if(!refreshed){

                window.location.replace(
                    "login.html"
                );

                return;
            }


            response = await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    method:"GET",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    }
                }
            );

        }


        if(!response.ok){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );

            window.location.replace(
                "login.html"
            );

            return;
        }


        const user =
            await response.json();


        if(!user || !user.id){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );

            window.location.replace(
                "login.html"
            );

            return;
        }


        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "mainContent"
        ).style.display = "block";


    }catch(error){

        window.location.replace(
            "login.html"
        );

    }

}


checkUser();

</script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArsinGang | تأیید ایمیل</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140825'/%3E%3Cpath d='M32 5 55 18 32 31 9 18Z' fill='%239b5cff'/%3E%3Cpath d='M9 18 32 31 32 57 9 44Z' fill='%235a20b8'/%3E%3Cpath d='M55 18 32 31 32 57 55 44Z' fill='%237b2cff'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='17' font-weight='900' text-anchor='middle' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 font-family:Tahoma,Arial,sans-serif;
 color:white;
 background:
 radial-gradient(circle at 50% -10%,rgba(123,44,255,.3),transparent 45%),
 #08040f;
}

.container{
 width:100%;
 max-width:450px;
 text-align:center;
 padding:40px 25px;
 border:1px solid #392452;
 border-radius:22px;
 background:rgba(255,255,255,.055);
 box-shadow:0 0 45px rgba(123,44,255,.12);
}

.check{
 width:115px;
 height:115px;
 margin:0 auto 25px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:rgba(34,197,94,.12);
 border:3px solid #22c55e;
 color:#22c55e;
 font-size:75px;
 font-weight:bold;
 box-shadow:0 0 35px rgba(34,197,94,.2);
}

h1{
 font-size:25px;
 margin:0 0 15px;
 color:white;
}

p{
 color:#aaa;
 line-height:2;
 font-size:14px;
 margin-bottom:28px;
}

.button{
 display:block;
 width:100%;
 padding:15px;
 border-radius:12px;
 text-decoration:none;
 color:white;
 font-size:16px;
 font-weight:bold;
 background:linear-gradient(135deg,#7b2cff,#5420bd);
 transition:.2s;
}

.button:hover{
 filter:brightness(1.2);
 transform:translateY(-2px);
}

.button.disabled{
 opacity:.35;
 pointer-events:none;
 cursor:not-allowed;
}

.footer{
 margin-top:28px;
 color:#777;
 font-size:12px;
}
</style>
</head>

<body>

<div class="container">

 <div class="check" id="check">✓</div>

 <h1 id="title">در حال بررسی تأیید ایمیل...</h1>

 <p id="message">
 لطفاً چند لحظه صبر کنید.
 </p>

 <a class="button" id="siteButton"
 href="https://arsingang-site.arsingang.workers.dev">
 ورود به سایت
 </a>

 <div class="footer">
 ArsinGang © 2026
 </div>

</div>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://lhddjuomukejpvssyhuv.supabase.co";

/* کلید عمومی Supabase */
const SUPABASE_ANON_KEY = "sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";

const title = document.getElementById("title");
const message = document.getElementById("message");
const check = document.getElementById("check");
const button = document.getElementById("siteButton");

function showSuccess() {

  title.textContent = "ایمیل با موفقیت تأیید شد!";

  message.innerHTML = `
    ایمیل شما با موفقیت تأیید شد.
    <br>
    حساب کاربری شما آماده استفاده است.
    <br>
    به خانواده ArsinGang خوش آمدید! 💜
  `;

  check.textContent = "✓";
  check.style.color = "#22c55e";
  check.style.borderColor = "#22c55e";
  check.style.background = "rgba(34,197,94,.12)";
  check.style.boxShadow = "0 0 35px rgba(34,197,94,.2)";

  button.classList.remove("disabled");
  button.href = "https://arsingang-site.arsingang.workers.dev";
  button.setAttribute("aria-disabled", "false");

}

function showError(text) {

  title.textContent = "تأیید ایمیل انجام نشد";

  message.textContent = text;

  check.textContent = "!";
  check.style.color = "#ef4444";
  check.style.borderColor = "#ef4444";
  check.style.background = "rgba(239,68,68,.12)";
  check.style.boxShadow = "0 0 35px rgba(239,68,68,.2)";

  button.classList.add("disabled");
  button.removeAttribute("href");
  button.setAttribute("aria-disabled", "true");

}

async function verifyEmail() {

  try {

    if (
      !SUPABASE_ANON_KEY ||
      SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"
    ) {
      throw new Error("کلید عمومی Supabase تنظیم نشده است.");
    }

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "implicit"
        }
      }
    );

    const { data, error } = await supabase.auth.getSession();

    if (error) {
      throw error;
    }

    if (!data.session) {
      throw new Error("نشست تأیید ایمیل پیدا نشد یا لینک معتبر نیست.");
    }

    const { data: userData, error: userError } =
      await supabase.auth.getUser();

    if (userError) {
      throw userError;
    }

    if (
      !userData.user ||
      !userData.user.email_confirmed_at
    ) {
      throw new Error("ایمیل هنوز در Supabase تأیید نشده است.");
    }

    showSuccess();

  } catch (error) {

    console.error("EMAIL VERIFICATION ERROR:", error);

    showError(
      "تأیید ایمیل با مشکل مواجه شد. لطفاً لینک را دوباره بررسی کنید."
    );

  }

}

verifyEmail();

</script>

</body>
</html>

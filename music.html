<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arsin_Gang Music | Funk Music</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237b2cff'/%3E%3Ctext x='50' y='63' text-anchor='middle' font-size='38' font-family='Arial' font-weight='bold' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top,#24104d 0%,#0b0714 45%,#05030a 100%);
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 20%,rgba(123,44,255,.12),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(0,229,255,.08),transparent 30%);
}

.container{
    position:relative;
    z-index:1;
    width:min(850px,92%);
    margin:auto;
    padding:70px 0 45px;
}

.back{
    position:fixed;
    top:18px;
    right:18px;
    z-index:20;
}

.back a{
    display:block;
    text-decoration:none;
    color:white;
    padding:11px 17px;
    border-radius:12px;
    background:rgba(25,15,45,.92);
    border:1px solid rgba(139,61,255,.5);
    box-shadow:0 0 18px rgba(123,44,255,.25);
    font-size:14px;
    transition:.25s;
}

.back a:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(123,44,255,.55);
}

.header{
    text-align:center;
    margin-bottom:35px;
}

.logo{
    width:100px;
    height:100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:27px;
    background:linear-gradient(135deg,#7b2cff,#00cfff);
    box-shadow:
        0 0 25px rgba(123,44,255,.6),
        0 0 45px rgba(0,229,255,.25);
    font-size:36px;
    font-weight:bold;
}

h1{
    margin:23px 0 8px;
    font-size:40px;
    text-shadow:0 0 20px rgba(150,70,255,.7);
}

.subtitle{
    color:#aaa0b8;
    font-size:15px;
}

.section-title{
    text-align:right;
    margin:0 0 15px;
    font-size:21px;
}

.section-title span{
    color:#00d9ff;
    text-shadow:0 0 12px rgba(0,217,255,.5);
}

.music-card{
    position:relative;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:22px;
    box-shadow:0 10px 35px rgba(0,0,0,.3);
    backdrop-filter:blur(8px);
    transition:.25s;
}

.music-card:hover{
    border-color:rgba(139,61,255,.55);
    box-shadow:
        0 0 25px rgba(123,44,255,.2),
        0 15px 40px rgba(0,0,0,.35);
}

.song-info{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:22px;
}

.cover{
    width:75px;
    height:75px;
    flex-shrink:0;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#7b2cff,#00d9ff);
    box-shadow:
        0 0 20px rgba(123,44,255,.4),
        0 0 30px rgba(0,217,255,.15);
    font-size:31px;
}

.song-text{
    text-align:right;
    min-width:0;
}

.song-title{
    font-size:20px;
    font-weight:bold;
    text-shadow:0 0 10px rgba(255,255,255,.2);
}

.song-type{
    color:#9990aa;
    font-size:12px;
    margin-top:7px;
}

.progress-area{
    margin:15px 0;
}

.progress{
    width:100%;
    height:7px;
    appearance:none;
    cursor:pointer;
    border-radius:10px;
    background:#2a2037;
    outline:none;
}

.progress::-webkit-slider-thumb{
    appearance:none;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#8b3dff;
    box-shadow:0 0 10px #8b3dff;
}

.progress::-moz-range-thumb{
    width:16px;
    height:16px;
    border:none;
    border-radius:50%;
    background:#8b3dff;
    box-shadow:0 0 10px #8b3dff;
}

.time{
    display:flex;
    justify-content:space-between;
    direction:ltr;
    color:#8f8799;
    font-size:11px;
    margin-top:8px;
}

.controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:20px;
    direction:ltr;
}

.control{
    width:43px;
    height:43px;
    border:none;
    border-radius:50%;
    color:white;
    background:rgba(255,255,255,.08);
    cursor:pointer;
    font-size:17px;
    transition:.2s;
}

.control:hover{
    transform:scale(1.08);
    background:rgba(123,44,255,.3);
    box-shadow:0 0 15px rgba(123,44,255,.25);
}

.play{
    width:57px;
    height:57px;
    font-size:22px;
    background:linear-gradient(135deg,#7b2cff,#00bfff);
    box-shadow:
        0 0 20px rgba(123,44,255,.45),
        0 0 30px rgba(0,191,255,.15);
}

.bottom-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-top:20px;
}

.volume{
    display:flex;
    align-items:center;
    gap:8px;
    direction:ltr;
}

.volume-slider{
    width:105px;
    height:5px;
    appearance:none;
    border-radius:10px;
    background:#2a2037;
    cursor:pointer;
}

.volume-slider::-webkit-slider-thumb{
    appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:#00d9ff;
    box-shadow:0 0 8px #00d9ff;
}

.volume-slider::-moz-range-thumb{
    width:13px;
    height:13px;
    border:none;
    border-radius:50%;
    background:#00d9ff;
}

.speed{
    display:flex;
    align-items:center;
    gap:8px;
    color:#aaa0b8;
    font-size:12px;
}

.speed select{
    color:white;
    background:#19102b;
    border:1px solid rgba(139,61,255,.5);
    border-radius:9px;
    padding:7px 9px;
    outline:none;
    cursor:pointer;
}

.download{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.download a{
    text-decoration:none;
    color:white;
    padding:11px 20px;
    border-radius:11px;
    background:rgba(123,44,255,.16);
    border:1px solid rgba(123,44,255,.45);
    box-shadow:0 0 15px rgba(123,44,255,.15);
    font-size:13px;
    transition:.25s;
}

.download a:hover{
    transform:translateY(-2px);
    background:rgba(123,44,255,.25);
    box-shadow:0 0 22px rgba(123,44,255,.35);
}

.status{
    text-align:center;
    margin-top:13px;
    color:#777080;
    font-size:11px;
    min-height:16px;
}

footer{
    text-align:center;
    margin-top:40px;
    color:#777080;
    font-size:13px;
}

@media(max-width:600px){

    .container{
        padding-top:85px;
    }

    h1{
        font-size:32px;
    }

    .logo{
        width:90px;
        height:90px;
        font-size:32px;
    }

    .back{
        top:10px;
        right:10px;
    }

    .back a{
        font-size:12px;
        padding:9px 12px;
    }

    .music-card{
        padding:17px;
    }

    .bottom-controls{
        flex-direction:column;
        align-items:stretch;
    }

    .volume,
    .speed{
        justify-content:center;
    }

    .volume-slider{
        width:140px;
    }

}

</style>
</head>

<body>

<div class="back">
    <a href="/">
        🏠 بازگشت به صفحه اصلی
    </a>
</div>

<div class="container">

    <header class="header">

        <div class="logo">
            AG
        </div>

        <h1>
            Arsin_Gang Music
        </h1>

        <div class="subtitle">
            موسیقی‌های منتخب ArsinGang 🎵💜
        </div>

    </header>


    <div class="section-title">
        🎵 <span>Funk Music</span>
    </div>


    <div class="music-card">

        <div class="song-info">

            <div class="cover">
                🎧
            </div>

            <div class="song-text">

                <div class="song-title">
                    LONELY FUNK
                </div>

                <div class="song-type">
                    Funk Music • Arsin_Gang Music
                </div>

            </div>

        </div>


        <audio
            id="audio"
            preload="metadata"
            src="music/lonely-funk.mp3">
        </audio>


        <div class="progress-area">

            <input
                class="progress"
                id="progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

        </div>


        <div class="controls">

            <button
                class="control"
                id="prevBtn"
                type="button"
                title="قبلی">
                ⏮
            </button>

            <button
                class="control play"
                id="playBtn"
                type="button"
                title="پخش">
                ▶
            </button>

            <button
                class="control"
                id="nextBtn"
                type="button"
                title="بعدی">
                ⏭
            </button>

        </div>


        <div class="bottom-controls">

            <div class="volume">

                <span>🔊</span>

                <input
                    class="volume-slider"
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

            </div>


            <div class="speed">

                <span>
                    ⚡ سرعت
                </span>

                <select id="speed">

                    <option value="0.5">
                        0.5x
                    </option>

                    <option value="0.75">
                        0.75x
                    </option>

                    <option value="1" selected>
                        1x
                    </option>

                    <option value="1.25">
                        1.25x
                    </option>

                    <option value="1.5">
                        1.5x
                    </option>

                    <option value="1.75">
                        1.75x
                    </option>

                    <option value="2">
                        2x
                    </option>

                </select>

            </div>

        </div>


        <div class="download">

            <a
                href="music/lonely-funk.mp3"
                download="LONELY FUNK.mp3">
                ⬇️ دانلود آهنگ
            </a>

        </div>


        <div
            class="status"
            id="status">
        </div>

    </div>


    <footer>
        Arsin_Gang Music 🎵 © 2026 ArsinGang
    </footer>

</div>


<script>

const audio =
    document.getElementById("audio");

const playBtn =
    document.getElementById("playBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const volume =
    document.getElementById("volume");

const speed =
    document.getElementById("speed");

const status =
    document.getElementById("status");


function formatTime(seconds){

    if(!Number.isFinite(seconds)){
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");

    return minutes + ":" + secs;

}


playBtn.addEventListener(
    "click",
    async function(){

        if(audio.paused){

            try{

                await audio.play();

            }catch(error){

                status.textContent =
                    "❌ فایل آهنگ پیدا نشد.";

            }

        }else{

            audio.pause();

        }

    }
);


audio.addEventListener(
    "play",
    function(){

        playBtn.textContent = "⏸";

        status.textContent =
            "🎵 در حال پخش";

    }
);


audio.addEventListener(
    "pause",
    function(){

        playBtn.textContent = "▶";

        if(audio.currentTime > 0 &&
           audio.currentTime < audio.duration){

            status.textContent =
                "⏸ پخش متوقف شد";

        }

    }
);


audio.addEventListener(
    "loadedmetadata",
    function(){

        duration.textContent =
            formatTime(audio.duration);

    }
);


audio.addEventListener(
    "timeupdate",
    function(){

        currentTime.textContent =
            formatTime(audio.currentTime);

        if(audio.duration){

            progress.value =
                (audio.currentTime / audio.duration) * 100;

        }

    }
);


progress.addEventListener(
    "input",
    function(){

        if(audio.duration){

            audio.currentTime =
                (progress.value / 100) *
                audio.duration;

        }

    }
);


volume.addEventListener(
    "input",
    function(){

        audio.volume =
            Number(volume.value);

    }
);


speed.addEventListener(
    "change",
    function(){

        audio.playbackRate =
            Number(speed.value);

    }
);


prevBtn.addEventListener(
    "click",
    function(){

        audio.currentTime = 0;

    }
);


nextBtn.addEventListener(
    "click",
    function(){

        audio.currentTime = 0;

        audio.play().catch(function(){});

    }
);


audio.addEventListener(
    "ended",
    function(){

        playBtn.textContent = "▶";

        progress.value = 0;

        currentTime.textContent = "0:00";

        status.textContent =
            "🎵 آهنگ به پایان رسید";

    }
);


audio.addEventListener(
    "error",
    function(){

        status.textContent =
            "❌ فایل LONELY FUNK در مسیر music/lonely-funk.mp3 پیدا نشد.";

    }
);


audio.volume = 1;
audio.playbackRate = 1;

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArsinGang</title>
</head>

<body>

<div id="loading" style="
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#050308;
color:white;
font-family:Tahoma,Arial,sans-serif;
font-size:18px;
">
در حال بارگذاری...
</div>

<script>

const routes = {
    "/login/": "/login.html",
    "/rank/": "/rank.html",
    "/contact/": "/contact.html",
    "/ticket/": "/ticket.html"
};

const currentPath = window.location.pathname;
const target = routes[currentPath];

if (!target) {

    document.getElementById("loading").textContent =
        "❌ صفحه پیدا نشد.";

} else {

    const targetUrl = target + window.location.search;

    fetch(targetUrl)
        .then(response => {

            if (!response.ok) {
                throw new Error("Page not found");
            }

            return response.text();

        })
        .then(html => {

            const baseTag =
                '<base href="' +
                window.location.origin +
                '/">';

            html = html.replace(
                /<head([^>]*)>/i,
                '<head$1>' + baseTag
            );

            document.open();
            document.write(html);
            document.close();

        })
        .catch(error => {

            console.error(error);

            document.getElementById("loading").textContent =
                "❌ خطا در بارگذاری صفحه.";

        });

}

</script>

</body>
</html>

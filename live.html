
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیا اکسپو | پخش زنده</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Tahoma, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.video-box {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 14px;
  background: #000;
  margin-bottom: 25px;
}

.video-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.event-title {
  font-size: 25px;
  font-weight: bold;
  margin: 25px 0 12px;
  color: white;
}

.event-time {
  font-size: 17px;
  color: #ccc;
  margin-bottom: 30px;
  line-height: 2;
}

.stream-box {
  width: 100%;
  margin-top: 15px;
}

.stream-box video {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
  border-radius: 14px;
}

#status {
  color: #bbb;
  font-size: 14px;
  margin-top: 12px;
}

@media(max-width:600px) {
  .container {
    padding: 12px;
  }

  .event-title {
    font-size: 19px;
  }

  .event-time {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- ویدیوی آپارات -->
  <div class="video-box">
    <iframe
      src="https://www.aparat.com/video/video/embed/videohash/oxqyf5j/vt/frame"
      allowfullscreen
      allow="autoplay; encrypted-media">
    </iframe>
  </div>

  <!-- عنوان و زمان نمایشگاه -->
  <h2 class="event-title">
    مدیا اکسپو
  </h2>

  <div class="event-time">
    از ۶ تا ۹ آبان<br>
    هر روز از ساعت ۱۱ تا ۲۰
  </div>

  <!-- پخش زنده -->
  <div class="stream-box">
    <video id="player" controls autoplay muted playsinline></video>
    <p id="status">در حال اتصال به پخش زنده...</p>
  </div>

</div>

<script>
const video = document.getElementById('player');
const status = document.getElementById('status');

const stream = 'https://live.cdn.asset.aparat.com/04823993484cfb5b87cd4cd7288e3b1a/livehls/aparatgame.official_get7266_720p/index.m3u8?s=M11V87qqwQe1koN-Fhhbhw&e=1793377822&ip=151.232.177.213';

if (Hls.isSupported()) {
  const hls = new Hls();

  hls.loadSource(stream);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    status.textContent = 'دسته‌بندی: Game Talk';
    video.play().catch(() => {});
  });

  hls.on(Hls.Events.ERROR, (event, data) => {
    if (data.fatal) {
      status.textContent =
        'خطا در دریافت پخش زنده؛ ممکن است لینک منقضی شده باشد.';
    }
  });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = stream;

  video.addEventListener('loadedmetadata', () => {
    status.textContent = 'دسته‌بندی: Game Talk';
    video.play().catch(() => {});
  });

} else {
  status.textContent = 'مرورگر شما از HLS پشتیبانی نمی‌کند.';
}
</script>

</body>
</html>

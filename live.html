
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پخش زنده آپارات گیم</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Tahoma;
  text-align: center;
}
.player-container {
  max-width: 900px;
  margin: 30px auto;
  padding: 10px;
}
video {
  width: 100%;
  aspect-ratio: 16/9;
  background: black;
  border-radius: 12px;
}
</style>
</head>
<body>

<div class="player-container">
  <h2>نمایشگاه مدیا اکسپو با حضور استریمرهای برتر</h2>
  <video id="player" controls autoplay muted playsinline></video>
  <p id="status">در حال اتصال به پخش زنده...</p>
</div>

<script>
const video = document.getElementById('player');
const status = document.getElementById('status');

const stream = 'https://live.cdn.asset.aparat.com/04823993484cfb5b87cd4cd7288e3b1a/livehls/aparatgame.official_get7266_720p/index.m3u8?s=M11V87qqwQe1koN-Fhhbhw&e=1793377822&ip=151.232.177.213';

if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(stream);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    status.textContent = 'Game Talk
گیم
شروع از 1 ساعت و 46 دقیقه پیش';
    video.play().catch(() => {});
  });

  hls.on(Hls.Events.ERROR, (event, data) => {
    if (data.fatal) {
      status.textContent = 'خطا در دریافت پخش زنده؛ ممکن است لینک منقضی شده باشد.';
    }
  });
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = stream;
} else {
  status.textContent = 'مرورگر شما از HLS پشتیبانی نمی‌کند.';
}
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArsinGang | شبکه‌های اجتماعی</title>

<style>
:root {
  --purple: #8b35ff;
  --cyan: #00e5ff;
  --bg: #080611;
  --text: #f8f5ff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 16px;
  background:
    radial-gradient(ellipse at 15% 20%, #5420a833, transparent 40%),
    radial-gradient(ellipse at 90% 80%, #00d9ff19, transparent 35%),
    var(--bg);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .15;
  background-image:
    linear-gradient(#8b35ff22 1px, transparent 1px),
    linear-gradient(90deg, #8b35ff22 1px, transparent 1px);
  background-size: 38px 38px;
  mask-image: linear-gradient(to bottom, black, transparent);
}

.container {
  width: 100%;
  max-width: 850px;
  position: relative;
  text-align: center;
}

.logo {
  width: 88px;
  height: 88px;
  margin: 0 auto 22px;
  display: grid;
  place-items: center;
  border-radius: 25px;
  font-size: 39px;
  font-weight: 1000;
  font-style: italic;
  color: white;
  background: linear-gradient(145deg, #a34cff, #5311c7 60%, #160b35);
  border: 1px solid #c59aff77;
  box-shadow: 0 0 35px #8b35ff66,
              inset 0 0 20px #ffffff16;
  transform: rotate(-4deg);
}

h1 {
  font-size: clamp(30px, 6vw, 49px);
  font-weight: 900;
  line-height: 1.5;
  letter-spacing: -1.5px;
}

h1 span {
  background: linear-gradient(90deg, #b56cff, #00e5ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.subtitle {
  margin-top: 12px;
  color: #aaa4c1;
  font-size: 14px;
  line-height: 2;
}

.line {
  width: 100px;
  height: 3px;
  border-radius: 10px;
  margin: 23px auto 30px;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  box-shadow: 0 0 15px #8b35ff88;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 17px;
}

.card {
  --accent: #8b35ff;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: white;
  min-height: 245px;
  padding: 25px 12px 20px;
  border-radius: 23px;
  border: 1px solid #ffffff14;
  background: linear-gradient(150deg, #ffffff0c, #ffffff03);
  box-shadow: inset 0 1px 0 #ffffff0a;
  position: relative;
  overflow: hidden;
  transition: transform .25s ease,
              border-color .25s ease,
              box-shadow .25s ease;
  animation: appear .7s both;
}

.card:nth-child(2) {
  animation-delay: .12s;
}

.card:nth-child(3) {
  animation-delay: .24s;
}

.card::before {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: var(--accent);
  filter: blur(90px);
  opacity: .13;
  top: -100px;
  transition: opacity .25s;
}

.card:hover {
  transform: translateY(-8px);
  border-color: var(--accent);
  box-shadow: 0 12px 38px color-mix(in srgb, var(--accent) 18%, transparent);
}

.card:hover::before {
  opacity: .35;
}

.telegram { --accent: #29a9ea; }
.aparat { --accent: #ed145b; }
.youtube { --accent: #ff3030; }

.icon-box {
  width: 83px;
  height: 83px;
  border-radius: 24px;
  display: grid;
  place-items: center;
  margin-bottom: 19px;
  background: color-mix(in srgb, var(--accent) 14%, #100d1c);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  box-shadow: 0 0 25px color-mix(in srgb, var(--accent) 15%, transparent);
  position: relative;
}

.icon-box svg {
  width: 43px;
  height: 43px;
}

.card h2 {
  font-size: 19px;
  margin-bottom: 10px;
}

.card p {
  font-size: 11px;
  color: #aaa4bd;
  line-height: 1.9;
}

.cta {
  margin-top: 18px;
  padding: 9px 18px;
  border-radius: 30px;
  font-size: 12px;
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  background: color-mix(in srgb, var(--accent) 9%, transparent);
  transition: .2s;
}

.card:hover .cta {
  background: var(--accent);
  color: white;
}

.footer {
  margin-top: 29px;
  font-size: 11px;
  color: #706984;
  letter-spacing: 1px;
}

.footer span {
  color: #a975ff;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .cards {
    grid-template-columns: 1fr;
    max-width: 350px;
    margin: auto;
  }

  .card {
    min-height: 180px;
    padding: 19px;
  }

  .icon-box {
    width: 65px;
    height: 65px;
    border-radius: 19px;
    margin-bottom: 12px;
  }

  .icon-box svg {
    width: 34px;
    height: 34px;
  }

  .card h2 {
    font-size: 17px;
  }

  .subtitle {
    font-size: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

  </section>

  <footer class="footer">

</main>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تبلیغات | ArsinGang</title>
    <meta name="description" content="ثبت تبلیغات در سایت رسمی ArsinGang">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237b2cff'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='28' font-family='Arial' font-weight='bold' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(123,44,255,.25), transparent 35%),
                radial-gradient(circle at bottom left, rgba(0,217,255,.18), transparent 35%),
                #080811;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 20px;
            border-radius: 22px;
            background: #7b2cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 31px;
            font-weight: bold;
            box-shadow:
                0 0 25px rgba(123,44,255,.7),
                0 0 60px rgba(0,217,255,.2);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
            text-shadow: 0 0 18px rgba(123,44,255,.8);
        }

        .subtitle {
            text-align: center;
            color: #aaaabe;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .card {
            background: rgba(15,15,30,.88);
            border: 1px solid rgba(123,44,255,.35);
            border-radius: 22px;
            padding: 28px;
            box-shadow:
                0 0 35px rgba(123,44,255,.12),
                inset 0 0 30px rgba(0,217,255,.025);
            backdrop-filter: blur(10px);
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #292943;
            background: #0c0c18;
            color: white;
            border-radius: 12px;
            padding: 13px 14px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: .2s;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #7b2cff;
            box-shadow: 0 0 15px rgba(123,44,255,.22);
        }

        .hint {
            color: #77778f;
            font-size: 11px;
            margin-top: 6px;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 15px;
            color: white;
            background: linear-gradient(90deg, #7b2cff, #00aeea);
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 0 20px rgba(123,44,255,.25);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 25px rgba(123,44,255,.5),
                0 0 35px rgba(0,217,255,.18);
        }

        .submit-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
            word-break: break-word;
        }

        .success {
            display: block;
            background: rgba(0,217,255,.08);
            border: 1px solid rgba(0,217,255,.35);
            color: #69eaff;
        }

        .error {
            display: block;
            background: rgba(255,60,90,.08);
            border: 1px solid rgba(255,60,90,.35);
            color: #ff7188;
        }

        .back-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 18px;
            background: rgba(15,15,30,.88);
            border: 1px solid rgba(123,44,255,.35);
            box-shadow:
                0 0 35px rgba(123,44,255,.12),
                inset 0 0 30px rgba(0,217,255,.025);
            backdrop-filter: blur(10px);
        }

        .back {
            display: block;
            text-align: center;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            transition: .2s;
        }

        .back:hover {
            color: #00d9ff;
        }

        .info {
            margin-top: 22px;
            padding: 15px;
            border-radius: 14px;
            background: rgba(123,44,255,.06);
            border: 1px solid rgba(123,44,255,.18);
            color: #aaaabe;
            font-size: 12px;
            line-height: 2;
        }

        .info strong {
            color: #c9aaff;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">AG</div>

    <h1>تبلیغات ArsinGang</h1>

    <p class="subtitle">
        تبلیغ خودت، کانالت یا کسب‌وکارت رو در سایت ArsinGang نمایش بده
    </p>

    <div class="card">

        <form id="adForm">

            <div class="field">
                <label for="title">عنوان تبلیغ *</label>
                <input
                    type="text"
                    id="title"
                    maxlength="100"
                    placeholder="مثلاً فروشگاه گیمینگ من"
                    required
                >
            </div>

            <div class="field">
                <label for="description">توضیحات تبلیغ</label>
                <textarea
                    id="description"
                    maxlength="500"
                    placeholder="یک توضیح کوتاه درباره تبلیغ..."
                ></textarea>
            </div>

            <div class="field">
                <label for="imageUrl">لینک تصویر تبلیغ</label>
                <input
                    type="url"
                    id="imageUrl"
                    placeholder="https://example.com/banner.png"
                >
                <div class="hint">
                    فعلاً باید لینک مستقیم تصویر باشد.
                </div>
            </div>

            <div class="field">
                <label for="targetUrl">لینک مقصد تبلیغ *</label>
                <input
                    type="url"
                    id="targetUrl"
                    placeholder="https://example.com"
                    required
                >
            </div>

            <div class="field">
                <label for="advertiserName">نام تبلیغ‌دهنده</label>
                <input
                    type="text"
                    id="advertiserName"
                    maxlength="100"
                    placeholder="نام شما یا نام کانال"
                >
            </div>

            <div class="field">
                <label for="duration">مدت تبلیغ</label>
                <select id="duration">
                    <option value="1">۱ روز</option>
                    <option value="7" selected>۷ روز</option>
                    <option value="14">۱۴ روز</option>
                    <option value="30">۳۰ روز</option>
                </select>
            </div>

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                📢 ارسال درخواست تبلیغ
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="info">
            <strong>نکته:</strong><br>
            بعد از ارسال، تبلیغ شما ابتدا بررسی می‌شود.
            تا زمانی که تبلیغ تأیید نشده باشد، در سایت نمایش داده نمی‌شود.
        </div>

    </div>

    <div class="back-box">
        <a href="/" class="back">
            ← بازگشت به صفحه اصلی
        </a>
    </div>

</div>

<script>
    const SUPABASE_URL = "https://lhddjuomukejpvssyhuv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";

    const form = document.getElementById("adForm");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.className = "message";
        message.textContent = "";

        submitBtn.disabled = true;
        submitBtn.textContent = "در حال ارسال...";

        const title =
            document.getElementById("title").value.trim();

        const description =
            document.getElementById("description").value.trim();

        const imageUrl =
            document.getElementById("imageUrl").value.trim();

        const targetUrl =
            document.getElementById("targetUrl").value.trim();

        const advertiserName =
            document.getElementById("advertiserName").value.trim();

        const durationDays =
            Number(document.getElementById("duration").value);

        try {

            const response = await fetch(
                SUPABASE_URL + "/rest/v1/ads",
                {
                    method: "POST",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },

                    body: JSON.stringify({
                        title: title,
                        description: description || null,
                        image_url: imageUrl || null,
                        target_url: targetUrl,
                        advertiser_name: advertiserName || null,
                        duration_days: durationDays,
                        status: "pending"
                    })
                }
            );

            if (!response.ok) {

                let errorMessage = "خطای نامشخص";

                try {

                    const errorData = await response.json();

                    if (errorData.message) {
                        errorMessage = errorData.message;
                    } else if (errorData.error) {
                        errorMessage = errorData.error;
                    } else if (errorData.hint) {
                        errorMessage = errorData.hint;
                    } else {
                        errorMessage = JSON.stringify(errorData);
                    }

                } catch {
                    errorMessage = await response.text();
                }

                throw new Error(
                    "Supabase: " + errorMessage
                );
            }

            message.className = "message success";

            message.innerHTML =
                "✅ درخواست تبلیغ با موفقیت ثبت شد!<br>" +
                "تبلیغ شما پس از بررسی و تأیید نمایش داده خواهد شد.";

            form.reset();

        } catch (error) {

            console.error(error);

            message.className = "message error";

            message.textContent =
                "❌ خطا: " + error.message;
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "📢 ارسال درخواست تبلیغ";
    });
</script>

</body>
</html>

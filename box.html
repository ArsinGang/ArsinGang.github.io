<script>

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";

let accessToken =
localStorage.getItem("arsin_user_token");

let refreshToken =
localStorage.getItem("arsin_user_refresh");

let countdownInterval = null;


/* اگر وارد نشده */
if(!accessToken){

    window.location.replace("login.html");

}


/* =========================
   TOKEN REFRESH
========================= */

async function refreshAccessToken(){

    if(!refreshToken){
        return false;
    }

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=refresh_token",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY
                },

                body:JSON.stringify({
                    refresh_token:refreshToken
                })
            }
        );

        const data =
            await response.json();

        if(!response.ok ||
           !data.access_token){

            localStorage.removeItem(
                "arsin_user_token"
            );

            localStorage.removeItem(
                "arsin_user_refresh"
            );

            window.location.replace(
                "login.html"
            );

            return false;
        }

        accessToken =
            data.access_token;

        refreshToken =
            data.refresh_token ||
            refreshToken;

        localStorage.setItem(
            "arsin_user_token",
            accessToken
        );

        localStorage.setItem(
            "arsin_user_refresh",
            refreshToken
        );

        return true;

    }catch(error){

        console.error(error);

        return false;
    }
}


/* =========================
   SUPABASE FETCH
========================= */

async function supabaseFetch(
    path,
    options = {},
    retry = true
){

    options.headers = {

        ...(options.headers || {}),

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + accessToken
    };

    let response =
        await fetch(
            SUPABASE_URL + path,
            options
        );

    if(
        response.status === 401 &&
        retry
    ){

        const refreshed =
            await refreshAccessToken();

        if(!refreshed){

            throw new Error(
                "جلسه ورود منقضی شده است."
            );
        }

        options.headers[
            "Authorization"
        ] =
            "Bearer " + accessToken;

        response =
            await fetch(
                SUPABASE_URL + path,
                options
            );
    }

    return response;
}

/* =========================
   SOUND SYSTEM
   بدون فایل صوتی خارجی
========================= */

let audioContext = null;

function getAudioContext(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;
}


/* صدای باز شدن باکس */

function playBoxSound(){

    try{

        const ctx =
            getAudioContext();

        const now =
            ctx.currentTime;

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type =
            "triangle";

        oscillator.frequency.setValueAtTime(
            180,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            650,
            now + .35
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            950,
            now + .75
        );

        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .22,
            now + .05
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + .9
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start(now);
        oscillator.stop(now + .9);

    }catch(error){

        console.log(
            "Audio unavailable"
        );

    }
}


/* صدای جایزه معمولی */

function playRewardSound(){

    try{

        const ctx =
            getAudioContext();

        const now =
            ctx.currentTime;

        const notes = [
            523.25,
            659.25,
            783.99
        ];

        notes.forEach(
            (frequency,index)=>{

                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();

                oscillator.type =
                    "sine";

                oscillator.frequency.value =
                    frequency;

                const start =
                    now + index * .12;

                gain.gain.setValueAtTime(
                    .0001,
                    start
                );

                gain.gain.exponentialRampToValueAtTime(
                    .18,
                    start + .03
                );

                gain.gain.exponentialRampToValueAtTime(
                    .0001,
                    start + .25
                );

                oscillator.connect(gain);
                gain.connect(ctx.destination);

                oscillator.start(start);
                oscillator.stop(start + .25);

            }
        );

    }catch(error){

        console.log(
            "Audio unavailable"
        );

    }
}


/* صدای مخصوص موز 😂 */

function playBananaSound(){

    try{

        const ctx =
            getAudioContext();

        const now =
            ctx.currentTime;

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.setValueAtTime(
            700,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            180,
            now + .35
        );

        gain.gain.setValueAtTime(
            .0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .16,

        );

        gain.gain.exponentialRampToValueAtTime(

            now + .4
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start(now);
        oscillator.stop(now + .4);

    }catch(error){

        console.log(
            "Audio unavailable"
        );

    }
}


/* =========================
   PARTICLES
========================= */

function createParticles(){

    for(
        let i = 0;
        i < 28;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "particle";

        const x =
            (Math.random() * 500 - 250)
            + "px";

        const y =
            (Math.random() * 400 - 300)
            + "px";

        particle.style.setProperty(
            "--x",
            x
        );

        particle.style.setProperty(
            "--y",
            y
        );

        particle.style.left =
            "50%";

        particle.style.top =
            "45%";

        document.body.appendChild(
            particle
        );

        setTimeout(
            ()=>{
                particle.remove();
            },
            1100
        );
    }
}


/* =========================
   COUNTDOWN
========================= */

function startCountdown(
    dateString
){

    clearInterval(
        countdownInterval
    );

    if(!dateString){

        document.getElementById(
            "cooldown"
        ).textContent =
            "باکس آماده است!";

        document.getElementById(
            "openBtn"
        ).disabled = false;

        return;
    }

    const nextOpen =
        new Date(dateString);

    function update(){

        const now =
            new Date();

        const difference =
            nextOpen - now;

        if(difference <= 0){

            clearInterval(
                countdownInterval
            );

            document.getElementById(
                "cooldown"
            ).textContent =
                "باکس آماده است!";

            document.getElementById(
                "openBtn"
            ).disabled = false;

            return;
        }

        const hours =
            Math.floor(
                difference / 3600000
            );

        const minutes =
            Math.floor(
                (difference % 3600000)
                / 60000
            );

        const seconds =
            Math.floor(
                (difference % 60000)
                / 1000
            );

        document.getElementById(
            "cooldown"
        ).textContent =
            "باکس بعدی: " +
            String(hours).padStart(2,"0") +
            ":" +
            String(minutes).padStart(2,"0") +
            ":" +
            String(seconds).padStart(2,"0");

        document.getElementById(
            "openBtn"
        ).disabled = true;
    }

    update();

    countdownInterval =
        setInterval(
            update,
            1000
        );
}


/* =========================
   OPEN BOX
========================= */

async function openBox(){

    const button =
        document.getElementById(
            "openBtn"
        );

    const area =
        document.getElementById(
            "boxArea"
        );

    const message =
        document.getElementById(
            "message"
        );

        return;
    }

    button.disabled = true;

    message.textContent =
        "باکس داره باز میشه...";

    area.classList.add(
        "opening"
    );

    /* شروع صدا */
    playBoxSound();

    try{

        /*
          زمان انیمیشن
        */
        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    1200
                )
        );

        const response =
            await supabaseFetch(
                "/rest/v1/rpc/open_daily_box",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:"{}"
                }
            );

        const data =
            await response.json();

        area.classList.remove(
            "opening"
        );

        if(!response.ok){

            throw new Error(
                "خطا در باز کردن باکس"
            );
        }

        const result =
            data && data.length
                ? data[0]
                : data;


        /* اگر قبلاً باز شده */
        if(!result.success){

            message.textContent =
                result.reward_message || "";

            startCountdown(
                result.next_open_at
            );

        /* ذرات */
        createParticles();


        const modal =

            );

        const title =
            document.getElementById(
                "rewardTitle"
            );

        const amount =
            document.getElementById(
                "rewardAmount"
            );

        const text =
            document.getElementById(
                "rewardText"

        /* موز */
        if(
            result.reward_type ===

        ){

            title.textContent =
                "جایزه ویژه!";

            amount.innerHTML =
                '<div class="banana">🍌</div>';

            text.textContent =
                result.reward_message ||
                "موز نصیبت شد! 😂";

            playBananaSound();

        }

        /* Gang Coin */
        else{

            title.textContent =
                "جایزه باکس!";

            amount.innerHTML =
                '<span class="coin large">G</span>' +
                '<span>+' +
                (
                    result.reward_coins || 0
                ) +
                '</span>';

            text.textContent =
                result.reward_message || "";

            playRewardSound();
        }


        modal.classList.add(
            "show"
        );


        /* موجودی جدید */
        await loadAccount();


        /* تایمر */
        startCountdown(
            result.next_open_at
        );

        message.textContent = "";

    }catch(error){

        console.error(error);

        area.classList.remove(
            "opening"
        );

        button.disabled = false;

        message.textContent =
            "یه مشکلی پیش اومد. دوباره امتحان کن.";
    }
}


/* =========================
   EVENTS
========================= */

document.getElementById(
    "openBtn"
).addEventListener(
    "click",
    openBox
);


document.getElementById(
    "mysteryBox"
).addEventListener(
    "click",
    ()=>{

        const button =
            document.getElementById(
                "openBtn"
            );

        if(!button.disabled){

            openBox();

        }

    }
);


document.getElementById(
    "closeBtn"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "rewardModal"
        ).classList.remove(
            "show"
        );

    }
);


/* کلیک بیرون مودال */

document.getElementById(
    "rewardModal"
).addEventListener(
    "click",
    (event)=>{

        if(
            event.target.id ===
            "rewardModal"
        ){

            event.currentTarget
                .classList.remove(
                    "show"
                );

        }

    }
);


/* =========================
   START
========================= */

(async function(){

    await loadAccount();

    document.getElementById(
        "cooldown"
    ).textContent =
        "باکس آماده است!";

})();

</script>

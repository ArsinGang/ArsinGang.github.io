
<script>
(() => {
  "use strict";

  const API = "https://arsingang-site.arsingang.workers.dev/api/update-settings";

  const defaults = {
    noticeEnabled: true,
    loginEnabled: false,
    title: "اطلاعیهٔ آپدیت سایت",
    message: "سایت ArsinGang در حال به‌روزرسانی است.\nلطفاً کمی صبر کنید و بعد دوباره وارد سایت شوید.",
    cycle: 1
  };

  let settings = { ...defaults };
  let busy = false;

  const $ = id => document.getElementById(id);

  function getToken() {
    return localStorage.getItem("arsin_user_token");
  }

  function setConnection(text, color) {
    $("connectionLabel").textContent = text;
    $("connectionLabel").style.color = color || "#00d9ff";
    const dot = document.querySelector(".pill i");
    if (dot) dot.style.background = color || "#ffd166";
  }

  function showMessage(id, text, kind = "info") {
    const el = $(id);
    el.textContent = text;
    el.className = "notice show " + kind;
  }

  function setSwitch(button, enabled) {
    button.classList.toggle("on", Boolean(enabled));
    button.setAttribute("aria-checked", String(Boolean(enabled)));
  }

  function normalizeSettings(raw) {
    const row = raw?.settings || raw?.data?.[0] ||
      (Array.isArray(raw?.data) ? raw.data[0] : null) ||
      (Array.isArray(raw) ? raw[0] : null) || raw;

    if (!row || typeof row !== "object") {
      throw new Error("تنظیمات از سرور دریافت نشد.");
    }

    return {
      noticeEnabled: row.notice_enabled ?? defaults.noticeEnabled,
      loginEnabled: row.login_enabled ?? defaults.loginEnabled,
      title: typeof row.title === "string" ? row.title : defaults.title,
      message: typeof row.message === "string" ? row.message : defaults.message,
      cycle: settings.cycle,
      cycleId: row.cycle_id || "",
      updatedAt: row.updated_at || ""
    };
  }

  async function apiRequest(method = "GET", body = null) {
    const headers = { "Accept": "application/json" };

    if (body) headers["Content-Type"] = "application/json";

    if (method !== "GET") {
      const token = getToken();
      if (!token) {
        throw new Error("توکن ورود پیدا نشد؛ ابتدا با حساب OWNER وارد سایت شو.");
      }
      headers["Authorization"] = "Bearer " + token;
    }

    const response = await fetch(API, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store"
    });

    const text = await response.text();
    let result = {};

    try {
      result = text ? JSON.parse(text) : {};
    } catch {
      throw new Error("پاسخ Worker معتبر نیست. وضعیت: " + response.status);
    }

    if (!response.ok || result.ok === false || result.success === false) {
      throw new Error(
        result.error || result.message ||
        ("درخواست ناموفق بود. وضعیت: " + response.status)
      );
    }

    return result;
  }

  function render() {
    setSwitch($("noticeSwitch"), settings.noticeEnabled);
    setSwitch($("loginSwitch"), settings.loginEnabled);

    $("titleInput").value = settings.title;
    $("messageInput").value = settings.message;
    $("cycleNumber").textContent =
      Number(settings.cycle || 1).toLocaleString("fa-IR");

    $("previewTitle").textContent = settings.title;
    $("previewMessage").textContent = settings.message;

    $("previewStatus").textContent = settings.loginEnabled
      ? "● ورود به سایت فعال است"
      : "● ورود موقتاً غیرفعال است";

    $("previewStatus").style.color = settings.loginEnabled
      ? "#43ffae" : "#ffd166";

    $("previewLogin").disabled = !settings.loginEnabled;
    $("previewLogin").classList.toggle("disabled", !settings.loginEnabled);

    $("noticeState").textContent =
      settings.noticeEnabled ? "فعال" : "غیرفعال";
    $("noticeBadge").textContent =
      settings.noticeEnabled ? "فعال" : "غیرفعال";

    $("loginState").textContent =
      settings.loginEnabled ? "فعال" : "غیرفعال";
    $("loginBadge").textContent =
      settings.loginEnabled ? "فعال" : "غیرفعال";

    $("noticeBadge").style.color =
      settings.noticeEnabled ? "#00d9ff" : "#b7a9cd";
    $("loginBadge").style.color =
      settings.loginEnabled ? "#43ffae" : "#ffd166";

    $("cycleNotice").classList.toggle("show", settings.noticeEnabled);

    document.querySelectorAll("#noticeSwitch, #loginSwitch, #cycleButton, #savePreviewButton, #resetButton, #clearButton")
      .forEach(button => button.disabled = busy);
  }

  async function saveSettings() {
    const result = await apiRequest("POST", {
      action: "save",
      notice_enabled: settings.noticeEnabled,
      login_enabled: settings.loginEnabled,
      title: settings.title,
      message: settings.message
    });

    setConnection("اتصال برقرار است", "#43ffae");
    return result;
  }

  async function loadSettings() {
    try {
      setConnection("در حال اتصال به سرور...", "#ffd166");

      const result = await apiRequest("GET");
      settings = normalizeSettings(result);
      render();

      setConnection("تنظیمات از سرور بارگذاری شد", "#43ffae");

      const heroText = document.querySelector(".hero > p");
      if (heroText) {
        heroText.textContent =
          "تنظیمات از سرور بارگذاری می‌شوند و تغییرات ذخیره‌شده در Supabase باقی می‌مانند.";
      }

      const warning = document.querySelector(".panel .notice.warn.show");
      if (warning && warning.textContent.includes("هنوز به Supabase")) {
        warning.textContent =
          "پنل به Worker متصل است. عملیات ذخیره و تغییر تنظیمات از طریق سرور انجام می‌شود.";
        warning.className = "notice info show";
      }

      if (settings.updatedAt) {
        showMessage(
          "copyNotice",
          "تنظیمات واقعی بارگذاری شد. آخرین ذخیره: " +
            new Date(settings.updatedAt).toLocaleString("fa-IR")
        );
      }
    } catch (error) {
      setConnection("اتصال ناموفق", "#ff5b79");
      showMessage(
        "copyNotice",
        "تنظیمات از سرور بارگذاری نشد: " + error.message,
        "warn"
      );
    }
  }

  async function runAction(action, successText) {
    if (busy) return;

    busy = true;
    render();

    try {
      if (action === "new-cycle") {
        await apiRequest("POST", { action: "new-cycle" });
        settings.cycle = Number(settings.cycle || 1) + 1;
        showMessage("editNotice", successText, "info");
      } else if (action === "reset") {
        const result = await apiRequest("POST", { action: "reset" });
        settings = {
          ...defaults,
          ...normalizeSettings(result)
        };
        showMessage("copyNotice", successText, "info");
      }

      setConnection("تغییرات در سرور ذخیره شد", "#43ffae");
    } catch (error) {
      setConnection("خطا در ذخیره‌سازی", "#ff5b79");
      showMessage("editNotice", error.message, "warn");
    } finally {
      busy = false;
      render();
    }
  }

  $("noticeSwitch").addEventListener("click", async () => {
    if (busy) return;
    const oldValue = settings.noticeEnabled;
    settings.noticeEnabled = !oldValue;
    render();

    busy = true;
    render();

    try {
      await saveSettings();
      showMessage("editNotice", "وضعیت نمایش اعلان در سرور ذخیره شد.");
    } catch (error) {
      settings.noticeEnabled = oldValue;
      setConnection("ذخیره انجام نشد", "#ff5b79");
      showMessage("editNotice", error.message, "warn");
    } finally {
      busy = false;
      render();
    }
  });

  $("loginSwitch").addEventListener("click", async () => {
    if (busy) return;
    const oldValue = settings.loginEnabled;
    settings.loginEnabled = !oldValue;
    render();

    busy = true;
    render();

    try {
      await saveSettings();
      showMessage("editNotice", "وضعیت ورود کاربران در سرور ذخیره شد.");
    } catch (error) {
      settings.loginEnabled = oldValue;
      setConnection("ذخیره انجام نشد", "#ff5b79");
      showMessage("editNotice", error.message, "warn");
    } finally {
      busy = false;
      render();
    }
  });

  $("cycleButton").addEventListener("click", () => {
    runAction("new-cycle", "دورهٔ جدید در سرور ایجاد شد.");
  });

  $("savePreviewButton").addEventListener("click", async () => {
    if (busy) return;

    const old = { ...settings };
    settings.title = $("titleInput").value.trim() || defaults.title;
    settings.message = $("messageInput").value.trim() || defaults.message;

    busy = true;
    render();

    try {
      await saveSettings();
      showMessage("editNotice", "عنوان و متن اطلاعیه با موفقیت در سرور ذخیره شدند.");
    } catch (error) {
      settings = old;
      setConnection("ذخیره انجام نشد", "#ff5b79");
      showMessage("editNotice", error.message, "warn");
    } finally {
      busy = false;
      render();
    }
  });

  $("resetButton").addEventListener("click", async () => {
    if (busy) return;

    const old = { ...settings };
    settings.title = defaults.title;
    settings.message = defaults.message;

    busy = true;
    render();

    try {
      await saveSettings();
      showMessage("editNotice", "عنوان و متن پیش‌فرض در سرور ذخیره شدند.");
    } catch (error) {
      settings = old;
      setConnection("ذخیره انجام نشد", "#ff5b79");
      showMessage("editNotice", error.message, "warn");
    } finally {
      busy = false;
      render();
    }
  });

  $("clearButton").addEventListener("click", async () => {
    if (!confirm("همهٔ تنظیمات واقعی آپدیت به حالت اولیه برگردند؟")) return;
    await runAction("reset", "همهٔ تنظیمات واقعی بازنشانی شدند.");
  });

  $("copyButton").addEventListener("click", async () => {
    const output = JSON.stringify({
      notice_enabled: settings.noticeEnabled,
      login_enabled: settings.loginEnabled,
      title: settings.title,
      message: settings.message,
      cycle_id: settings.cycleId || null,
      updated_at: settings.updatedAt || null
    }, null, 2);

    try {
      await navigator.clipboard.writeText(output);
      showMessage("copyNotice", "تنظیمات واقعی کپی شدند.");
    } catch {
      showMessage("copyNotice", output, "warn");
    }
  });

  loadSettings();
})();
</script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237b2cff'/%3E%3Ctext x='50' y='63' text-anchor='middle' font-size='38' font-family='Arial' font-weight='bold' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;

font-family:Tahoma,Arial,sans-serif;

background:
radial-gradient(
circle at top,
#24104d 0%,
#0b0714 45%,
#05030a 100%
);

color:white;

padding:30px 20px;
}

.container{
width:100%;
max-width:900px;
margin:auto;
}

.logo{
width:82px;
height:82px;

margin:0 auto 18px;

border-radius:24px;

background:#7b2cff;

display:flex;
align-items:center;
justify-content:center;

font-family:Arial,sans-serif;
font-size:30px;
font-weight:bold;

box-shadow:
0 0 20px #7b2cff,
0 0 45px rgba(0,220,255,.35);
}

h1{
text-align:center;
margin:0;
font-size:28px;
}

.subtitle{
text-align:center;
color:#bbb;
margin:10px 0 25px;
}

.card{
background:rgba(15,10,28,.88);

border:1px solid rgba(139,75,255,.5);

border-radius:22px;

padding:25px;

box-shadow:
0 0 25px rgba(123,44,255,.18),
inset 0 0 20px rgba(0,220,255,.03);

backdrop-filter:blur(10px);

margin-bottom:20px;
}

.status{
padding:14px;

border-radius:12px;

text-align:center;

font-size:14px;

line-height:1.9;

background:rgba(123,44,255,.08);

border:1px solid rgba(123,44,255,.35);

color:#c7a9ff;

margin-bottom:20px;
}

.success{
background:rgba(0,220,255,.08);

border:1px solid rgba(0,220,255,.35);

color:#75eaff;
}

.error{
background:rgba(255,50,80,.1);

border:1px solid rgba(255,70,100,.4);

color:#ff9aaa;
}

.ad{
background:#090711;

border:1px solid #34244d;

border-radius:16px;

padding:18px;

margin-bottom:15px;

box-shadow:
0 0 15px rgba(123,44,255,.08);
}

.ad:last-child{
margin-bottom:0;
}

.ad h2{
margin:0 0 10px;

font-size:20px;
}

.ad-description{
color:#ccc;

line-height:1.9;

margin-bottom:15px;
}

.ad-image{
width:100%;

max-height:300px;

object-fit:contain;

border-radius:12px;

margin:10px 0 15px;

background:#05030a;
}

.info-box{
background:rgba(123,44,255,.07);

border:1px solid rgba(123,44,255,.2);

border-radius:12px;

padding:12px;

line-height:2;

font-size:13px;

color:#ccc;
}

.info-box strong{
color:white;
}

.ad-link{
color:#00d9ff;

word-break:break-all;

text-decoration:none;
}

.actions{
display:flex;

gap:10px;

margin-top:15px;

flex-wrap:wrap;
}

.main-btn{
flex:1;

min-width:130px;

padding:13px 16px;

border:0;

border-radius:12px;

color:white;

font-size:14px;

font-weight:bold;

cursor:pointer;

transition:.2s;
}

.main-btn:hover{
transform:translateY(-1px);
}

.approve-btn{
background:
linear-gradient(
135deg,
#16c784,
#00b8a9
);

box-shadow:
0 0 15px rgba(22,199,132,.2);
}

.reject-btn{
background:
linear-gradient(
135deg,
#ff4567,
#d7264f
);

box-shadow:
0 0 15px rgba(255,50,80,.18);
}

.delete-btn{
background:#21152d;

border:1px solid #5a315f;

color:#ff9aaa;
}

.empty{
text-align:center;

color:#aaa;

padding:30px 10px;

line-height:2;
}

.loading{
text-align:center;

color:#aaa;

padding:25px;
}

.back-btn{
display:block;

width:100%;

margin-top:20px;

padding:13px;

border-radius:12px;

background:#171020;

border:1px solid #34244d;

color:#ddd;

text-decoration:none;

text-align:center;

transition:.2s;
}

.back-btn:hover{
border-color:#7b2cff;

box-shadow:
0 0 15px rgba(123,44,255,.2);
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
AG
</div>

<h1>
🛠️ مدیریت تبلیغات
</h1>

<div class="subtitle">
بررسی و مدیریت درخواست‌های تبلیغاتی ArsinGang
</div>

<div class="card">

<div
id="status"
class="status">

⏳ در حال بررسی حساب کاربری...

</div>

<div
id="adsContainer">

<div class="loading">
⏳ در حال دریافت درخواست‌های تبلیغاتی...
</div>

</div>

<a
class="back-btn"
href="/">

⬅️ بازگشت به صفحه اصلی

</a>

</div>

</div>


<script>

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";


/* -------------------------
   STATUS
------------------------- */

function showStatus(text,type=""){

const box =
document.getElementById("status");

box.textContent = text;

box.className =
"status " + type;

}


/* -------------------------
   GET TOKEN
------------------------- */

function getToken(){

return localStorage.getItem(
"arsin_user_token"
);

}


/* -------------------------
   SUPABASE REQUEST
------------------------- */

async function supabaseRequest(
path,
options={}
){

try{

const token =
getToken();

const headers = {

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

...(options.headers || {})

};

if(token){

headers["Authorization"] =
"Bearer " + token;

}

const response =
await fetch(
SUPABASE_URL + path,
{
...options,
headers:headers
}
);

const data =
await response
.json()
.catch(()=>null);

return {

ok:response.ok,

status:response.status,

data:data

};

}catch(error){

return {

ok:false,

status:0,

data:{
message:
"اتصال به سرور برقرار نشد."
}

};

}

}


/* -------------------------
   CHECK LOGIN
------------------------- */

async function checkLogin(){

const token =
getToken();

if(!token){

showStatus(
"🔒 ابتدا باید وارد حساب کاربری شوید.",
"error"
);

document.getElementById(
"adsContainer"
).innerHTML = "";

return false;

}

return true;

}


/* -------------------------
   CHECK OWNER
------------------------- */

async function checkOwner(){

const result =
await supabaseRequest(
"/auth/v1/user"
);

if(!result.ok){

localStorage.removeItem(
"arsin_user_token"
);

localStorage.removeItem(
"arsin_user_refresh"
);

showStatus(
"🔒 ورود شما معتبر نیست. لطفاً دوباره وارد حساب کاربری شوید.",
"error"
);

document.getElementById(
"adsContainer"
).innerHTML = "";

return false;

}

const userId =
result.data?.id;

if(!userId){

showStatus(
"❌ شناسه کاربر پیدا نشد.",
"error"
);

return false;

}


const ownerResult =
await supabaseRequest(
"/rest/v1/gang_users?id=eq." +
encodeURIComponent(userId) +
"&select=id,rank"
);


if(!ownerResult.ok){

showStatus(
"❌ خطا در بررسی سطح دسترسی.",
"error"
);

return false;

}


if(
!ownerResult.data ||
!ownerResult.data.length
){

showStatus(
"🚫 حساب شما در سیستم ArsinGang پیدا نشد.",
"error"
);

return false;

}


const rank =
(ownerResult.data[0].rank || "")
.toString()
.toUpperCase();


if(rank !== "OWNER"){

showStatus(
"🚫 دسترسی غیرمجاز. فقط OWNER می‌تواند درخواست‌های تبلیغاتی را مدیریت کند.",
"error"
);

document.getElementById(
"adsContainer"
).innerHTML = "";

return false;

}


showStatus(
"👑 ورود موفق بود. دسترسی OWNER تأیید شد.",
"success"
);

return true;

}


/* -------------------------
   ESCAPE HTML
------------------------- */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* -------------------------
   LOAD ADS
------------------------- */

async function loadAds(){

const result =
await supabaseRequest(
"/rest/v1/ads?status=eq.pending&order=created_at.desc&select=*"
);


if(!result.ok){

showStatus(
"❌ دریافت درخواست‌های تبلیغاتی انجام نشد.",
"error"
);

document.getElementById(
"adsContainer"
).innerHTML = "";

return;

}


const ads =
Array.isArray(result.data)
? result.data
: [];


renderAds(ads);

}


/* -------------------------
   RENDER ADS
------------------------- */

function renderAds(ads){

const container =
document.getElementById(
"adsContainer"
);


if(!ads.length){

container.innerHTML = `
<div class="empty">
🎉 در حال حاضر هیچ درخواست تبلیغاتی در انتظار بررسی نیست.
<br>
درخواست‌های جدید اینجا نمایش داده می‌شوند.
</div>
`;

return;

}


container.innerHTML =
ads.map(ad => {

const image =
ad.image_url
? `
<img
class="ad-image"
src="${escapeHtml(ad.image_url)}"
alt="تصویر تبلیغ"
onerror="this.style.display='none';">
`
: "";


const description =
ad.description
? escapeHtml(ad.description)
: "توضیحی ثبت نشده است.";


const advertiser =
ad.advertiser_name
? escapeHtml(ad.advertiser_name)
: "ثبت نشده";


const email =
ad.advertiser_email
? escapeHtml(ad.advertiser_email)
: "ثبت نشده";


const duration =
ad.duration_days
? escapeHtml(ad.duration_days) + " روز"
: "ثبت نشده";


const target =
ad.target_url
? `
<a
class="ad-link"
href="${escapeHtml(ad.target_url)}"
target="_blank"
rel="noopener noreferrer">

${escapeHtml(ad.target_url)}

</a>
`
: "ثبت نشده";


const created =
ad.created_at
? new Date(ad.created_at)
.toLocaleString("fa-IR")
: "ثبت نشده";


return `

<div
class="ad"
data-id="${escapeHtml(ad.id)}">

<h2>
📢 ${escapeHtml(ad.title)}
</h2>

<div class="ad-description">
${description}
</div>

${image}

<div class="info-box">

<div>
<strong>👤 تبلیغ‌دهنده:</strong>
${advertiser}
</div>

<div>
<strong>📧 ایمیل:</strong>
${email}
</div>

<div>
<strong>⏱️ مدت تبلیغ:</strong>
${duration}
</div>

<div>
<strong>🔗 لینک:</strong>
${target}
</div>

<div>
<strong>📅 زمان ارسال:</strong>
${created}
</div>

</div>

<div class="actions">

<button
class="main-btn approve-btn"
onclick="approveAd(${Number(ad.id)})">

✅ تأیید تبلیغ

</button>

<button
class="main-btn reject-btn"
onclick="rejectAd(${Number(ad.id)})">

❌ رد تبلیغ

</button>

<button
class="main-btn delete-btn"
onclick="deleteAd(${Number(ad.id)})">

🗑️ حذف

</button>

</div>

</div>

`;

}).join("");

}


/* -------------------------
   RPC
------------------------- */

async function callAdminFunction(
functionName,
adId
){

const result =
await supabaseRequest(
"/rest/v1/rpc/" + functionName,
{
method:"POST",

body:JSON.stringify({
ad_id:adId
})
}
);

return result;

}


/* -------------------------
   APPROVE
------------------------- */

async function approveAd(adId){

if(
!confirm(
"آیا مطمئن هستید که می‌خواهید این تبلیغ را تأیید کنید؟"
)
){

return;

}

const result =
await callAdminFunction(
"approve_ad",
adId
);


if(!result.ok){

alert(
"❌ تأیید تبلیغ انجام نشد.\n\n" +
(
result.data?.message ||
result.data?.hint ||
"خطای نامشخص"
)
);

return;

}


alert(
"✅ تبلیغ با موفقیت تأیید شد."
);

await loadAds();

}


/* -------------------------
   REJECT
------------------------- */

async function rejectAd(adId){

if(
!confirm(
"آیا مطمئن هستید که می‌خواهید این تبلیغ را رد کنید؟"
)
){

return;

}

const result =
await callAdminFunction(
"reject_ad",
adId
);


if(!result.ok){

alert(
"❌ رد تبلیغ انجام نشد.\n\n" +
(
result.data?.message ||
result.data?.hint ||
"خطای نامشخص"
)
);

return;

}


alert(
"✅ تبلیغ با موفقیت رد شد."
);

await loadAds();

}


/* -------------------------
   DELETE
------------------------- */

async function deleteAd(adId){

if(
!confirm(
"⚠️ آیا مطمئن هستید که می‌خواهید این درخواست را حذف کنید؟"
)
){

return;

}

const result =
await callAdminFunction(
"delete_ad",
adId
);


if(!result.ok){

alert(
"❌ حذف تبلیغ انجام نشد.\n\n" +
(
result.data?.message ||
result.data?.hint ||
"خطای نامشخص"
)
);

return;

}


alert(
"🗑️ درخواست با موفقیت حذف شد."
);

await loadAds();

}


/* -------------------------
   START
------------------------- */

async function start(){

const loggedIn =
await checkLogin();

if(!loggedIn){

return;

}


const owner =
await checkOwner();

if(!owner){

return;

}


await loadAds();

}


start();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مدیریت تبلیغات | ArsinGang</title>
    <meta name="description" content="پنل مدیریت تبلیغات ArsinGang">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237b2cff'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='28' font-family='Arial' font-weight='bold' fill='white'%3EAG%3C/text%3E%3C/svg%3E">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(123,44,255,.25), transparent 35%),
                radial-gradient(circle at bottom left, rgba(0,217,255,.18), transparent 35%),
                #080811;
            color: white;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 20px;
            border-radius: 22px;
            background: #7b2cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 31px;
            font-weight: bold;
            box-shadow:
                0 0 25px rgba(123,44,255,.7),
                0 0 60px rgba(0,217,255,.2);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
            text-shadow: 0 0 18px rgba(123,44,255,.8);
        }

        .subtitle {
            text-align: center;
            color: #aaaabe;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(15,15,30,.88);
            border: 1px solid rgba(123,44,255,.35);
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow:
                0 0 35px rgba(123,44,255,.12),
                inset 0 0 30px rgba(0,217,255,.025);
            backdrop-filter: blur(10px);
        }

        .status {
            text-align: center;
            padding: 13px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.8;
        }

        .loading {
            background: rgba(123,44,255,.08);
            border: 1px solid rgba(123,44,255,.3);
            color: #c9aaff;
        }

        .success {
            background: rgba(0,217,255,.08);
            border: 1px solid rgba(0,217,255,.35);
            color: #69eaff;
        }

        .error {
            background: rgba(255,60,90,.08);
            border: 1px solid rgba(255,60,90,.35);
            color: #ff7188;
        }

        .ad {
            background: rgba(8,8,18,.8);
            border: 1px solid #292943;
            border-radius: 17px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .ad:last-child {
            margin-bottom: 0;
        }

        .ad-title {
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }

        .ad-description {
            color: #aaaabe;
            font-size: 13px;
            line-height: 1.9;
            margin-bottom: 15px;
        }

        .ad-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-box {
            background: rgba(123,44,255,.06);
            border: 1px solid rgba(123,44,255,.16);
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            color: #aaaabe;
            word-break: break-word;
        }

        .info-box strong {
            display: block;
            color: #ddd;
            margin-bottom: 4px;
        }

        .ad-image {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 15px;
            background: #05050c;
        }

        .target-link {
            display: block;
            color: #00d9ff;
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .target-link:hover {
            text-decoration: underline;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            border: none;
            border-radius: 11px;
            padding: 12px;
            color: white;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .approve {
            background: linear-gradient(90deg, #00a878, #00d9a0);
        }

        .reject {
            background: linear-gradient(90deg, #c52b48, #ff4565);
        }

        .delete {
            background: linear-gradient(90deg, #5a1d8f, #7b2cff);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .action-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .empty {
            text-align: center;
            padding: 35px 15px;
            color: #77778f;
            line-height: 2;
        }

        .back-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 18px;
            background: rgba(15,15,30,.88);
            border: 1px solid rgba(123,44,255,.35);
            box-shadow: 0 0 35px rgba(123,44,255,.12);
        }

        .back {
            display: block;
            text-align: center;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #00d9ff;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 26px;
            }

            .card {
                padding: 18px;
            }

            .ad-info {
                grid-template-columns: 1fr;
            }

            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">AG</div>

    <h1>📢 مدیریت تبلیغات</h1>

    <p class="subtitle">
        پنل مدیریت تبلیغات ArsinGang
    </p>

    <div id="status" class="status loading">
        در حال بررسی دسترسی...
    </div>

    <div class="card">

        <div id="adsContainer">
            <div class="empty">
                در حال دریافت تبلیغات...
            </div>
        </div>

    </div>

    <div class="back-box">
        <a href="/" class="back">
            ← بازگشت به صفحه اصلی
        </a>
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";


const statusBox =
    document.getElementById("status");

const adsContainer =
    document.getElementById("adsContainer");


function showStatus(text, type) {

    statusBox.className =
        "status " + type;

    statusBox.textContent =
        text;
}


/*
    گرفتن توکن ورود از سیستم لاگین سایت
*/
function getStoredToken() {

    const possibleKeys = [
        "arsin_user_token",
        "supabase_access_token",
        "access_token"
    ];

    for (const key of possibleKeys) {

        const token =
            localStorage.getItem(key);

        if (token &&
            token !== "null" &&
            token !== "undefined") {

            return token;
        }
    }

    return null;
}


/*
    بررسی کاربر فعلی با توکن
*/
async function getCurrentUser() {

    const accessToken =
        getStoredToken();

    if (!accessToken) {

        throw new Error(
            "ابتدا باید وارد حساب کاربری شوید."
        );
    }


    const response =
        await fetch(
            SUPABASE_URL +
            "/auth/v1/user",
            {
                method: "GET",

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken
                }
            }
        );


    if (!response.ok) {

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            throw new Error(
                "ورود شما منقضی شده است. دوباره وارد حساب شوید."
            );
        }

        throw new Error(
            "خطا در بررسی حساب کاربری."
        );
    }


    const user =
        await response.json();


    if (!user ||
        !user.id) {

        throw new Error(
            "اطلاعات حساب کاربری پیدا نشد."
        );
    }


    return {
        user: user,
        accessToken: accessToken
    };
}


/*
    بررسی OWNER بودن کاربر
*/
async function getOwner() {

    const auth =
        await getCurrentUser();

    const userId =
        auth.user.id;


    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/gang_users?id=eq." +
            encodeURIComponent(userId) +
            "&select=id,rank",
            {
                method: "GET",

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        auth.accessToken
                }
            }
        );


    if (!response.ok) {

        let errorMessage =
            "خطا در بررسی رتبه حساب.";

        try {

            const data =
                await response.json();

            errorMessage =
                data.message ||
                data.error ||
                errorMessage;

        } catch {}

        throw new Error(errorMessage);
    }


    const users =
        await response.json();


    if (!users.length) {

        throw new Error(
            "حساب شما در سیستم ArsinGang پیدا نشد."
        );
    }


    const rank =
        String(users[0].rank || "")
            .toUpperCase();


    if (rank !== "OWNER") {

        throw new Error(
            "دسترسی فقط برای OWNER مجاز است."
        );
    }


    return auth.accessToken;
}


/*
    دریافت تبلیغات در انتظار
*/
async function loadAds(accessToken) {

    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/ads?status=eq.pending&order=created_at.desc",
            {
                method: "GET",

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken
                }
            }
        );


    if (!response.ok) {

        let errorText =
            "خطا در دریافت تبلیغات.";

        try {

            const data =
                await response.json();

            errorText =
                data.message ||
                data.error ||
                errorText;

        } catch {}


        throw new Error(errorText);
    }


    return await response.json();
}


/*
    جلوگیری از اجرای HTML داخل اطلاعات تبلیغ
*/
function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
    نمایش تبلیغات
*/
function renderAds(ads) {

    if (!ads.length) {

        adsContainer.innerHTML = `
            <div class="empty">
                🎉 هیچ درخواست تبلیغی در انتظار بررسی نیست.
            </div>
        `;

        return;
    }


    adsContainer.innerHTML =
        ads.map(ad => {

            const image =
                ad.image_url
                ? `
                    <img
                        class="ad-image"
                        src="${escapeHtml(ad.image_url)}"
                        alt="تصویر تبلیغ"
                        onerror="this.style.display='none'"
                    >
                `
                : "";


            return `
                <div class="ad" data-id="${ad.id}">

                    <div class="ad-title">
                        ${escapeHtml(ad.title)}
                    </div>

                    ${
                        ad.description
                        ? `
                            <div class="ad-description">
                                ${escapeHtml(ad.description)}
                            </div>
                        `
                        : ""
                    }

                    ${image}

                    <div class="ad-info">

                        <div class="info-box">
                            <strong>تبلیغ‌دهنده</strong>
                            ${escapeHtml(
                                ad.advertiser_name || "ثبت نشده"
                            )}
                        </div>

                        <div class="info-box">
                            <strong>ایمیل</strong>
                            ${escapeHtml(
                                ad.advertiser_email || "ثبت نشده"
                            )}
                        </div>

                        <div class="info-box">
                            <strong>مدت تبلیغ</strong>
                            ${escapeHtml(
                                ad.duration_days
                            )} روز
                        </div>

                        <div class="info-box">
                            <strong>وضعیت</strong>
                            در انتظار بررسی
                        </div>

                    </div>

                    <a
                        class="target-link"
                        href="${escapeHtml(ad.target_url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🔗 ${escapeHtml(ad.target_url)}
                    </a>

                    <div class="actions">

                        <button
                            class="action-btn approve"
                            onclick="approveAd(${ad.id}, this)"
                        >
                            ✅ تأیید
                        </button>

                        <button
                            class="action-btn reject"
                            onclick="rejectAd(${ad.id}, this)"
                        >
                            ❌ رد
                        </button>

                        <button
                            class="action-btn delete"
                            onclick="deleteAd(${ad.id}, this)"
                        >
                            🗑️ حذف
                        </button>

                    </div>

                </div>
            `;

        }).join("");
}


/*
    اجرای RPC های مدیریت تبلیغ
*/
async function callAdminFunction(
    functionName,
    adId
) {

    const accessToken =
        getStoredToken();


    if (!accessToken) {

        throw new Error(
            "نشست ورود پیدا نشد."
        );
    }


    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/rpc/" +
            functionName,
            {
                method: "POST",

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        ad_id: adId
                    })
            }
        );


    if (!response.ok) {

        let errorText =
            "عملیات انجام نشد.";

        try {

            const data =
                await response.json();

            errorText =
                data.message ||
                data.error ||
                data.hint ||
                errorText;

        } catch {}


        throw new Error(errorText);
    }


    return true;
}


/*
    تأیید تبلیغ
*/
async function approveAd(
    adId,
    button
) {

    if (!confirm(
        "آیا این تبلیغ تأیید شود؟"
    )) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "در حال تأیید...";


    try {

        await callAdminFunction(
            "approve_ad",
            adId
        );


        const ad =
            document.querySelector(
                `.ad[data-id="${adId}"]`
            );


        if (ad) {
            ad.remove();
        }


        showStatus(
            "✅ تبلیغ با موفقیت تأیید شد.",
            "success"
        );


        checkEmpty();


    } catch (error) {

        button.disabled = false;

        button.textContent =
            "✅ تأیید";


        showStatus(
            "❌ " + error.message,
            "error"
        );
    }
}


/*
    رد تبلیغ
*/
async function rejectAd(
    adId,
    button
) {

    if (!confirm(
        "آیا این تبلیغ رد شود؟"
    )) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "در حال رد کردن...";


    try {

        await callAdminFunction(
            "reject_ad",
            adId
        );


        const ad =
            document.querySelector(
                `.ad[data-id="${adId}"]`
            );


        if (ad) {
            ad.remove();
        }


        showStatus(
            "✅ تبلیغ رد شد.",
            "success"
        );


        checkEmpty();


    } catch (error) {

        button.disabled = false;

        button.textContent =
            "❌ رد";


        showStatus(
            "❌ " + error.message,
            "error"
        );
    }
}


/*
    حذف تبلیغ
*/
async function deleteAd(
    adId,
    button
) {

    if (!confirm(
        "⚠️ این تبلیغ برای همیشه حذف می‌شود. ادامه می‌دهید؟"
    )) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "در حال حذف...";


    try {

        await callAdminFunction(
            "delete_ad",
            adId
        );


        const ad =
            document.querySelector(
                `.ad[data-id="${adId}"]`
            );


        if (ad) {
            ad.remove();
        }


        showStatus(
            "✅ تبلیغ حذف شد.",
            "success"
        );


        checkEmpty();


    } catch (error) {

        button.disabled = false;

        button.textContent =
            "🗑️ حذف";


        showStatus(
            "❌ " + error.message,
            "error"
        );
    }
}


/*
    اگر تبلیغی باقی نمانده باشد
*/
function checkEmpty() {

    if (!adsContainer.querySelector(".ad")) {

        adsContainer.innerHTML = `
            <div class="empty">
                🎉 هیچ درخواست تبلیغی در انتظار بررسی نیست.
            </div>
        `;
    }
}


/*
    شروع پنل
*/
async function start() {

    try {

        showStatus(
            "در حال بررسی حساب کاربری...",
            "loading"
        );


        const accessToken =
            await getOwner();


        showStatus(
            "✅ دسترسی OWNER تأیید شد.",
            "success"
        );


        const ads =
            await loadAds(accessToken);


        renderAds(ads);


    } catch (error) {

        console.error(
            "ADS ADMIN ERROR:",
            error
        );


        adsContainer.innerHTML = `
            <div class="empty">
                🔒 ${escapeHtml(error.message)}
            </div>
        `;


        showStatus(
            "❌ " + error.message,
            "error"
        );
    }
}


start();

</script>

</body>
</html>

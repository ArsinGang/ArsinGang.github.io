<style>

<body>

<div class="container">

<div class="logo">
AG
</div>

<h1>
🛠️ مدیریت تبلیغات
</h1>

<div class="subtitle">
بررسی و مدیریت درخواست‌های تبلیغاتی ArsinGang
</div>


<!-- LOGIN -->

<div
class="card"
id="loginCard">

<div
id="loginStatus"
class="status info">

🔐 برای ورود به مدیریت تبلیغات، وارد حساب مدیر شوید.

</div>

<form id="loginForm">

<label>
ایمیل
</label>

<input
id="adminEmail"
type="email"
placeholder="example@email.com"
autocomplete="email"
required
>

<label>
رمز عبور
</label>

<input
id="adminPassword"
type="password"
placeholder="رمز عبور"
autocomplete="current-password"
required
>

<button
class="main-btn"
id="loginButton"
type="submit">

🔐 ورود به مدیریت تبلیغات

</button>

</form>

<a
class="back-btn"
href="/">

⬅️ بازگشت به صفحه اصلی

</a>

</div>


<!-- ADMIN PANEL -->

<div
class="card hidden"
id="adminCard">

<div
id="adminStatus"
class="status success">

👑 مدیریت تبلیغات فعال است.

</div>

<button
class="main-btn logout-btn"
onclick="logout()">

🚪 خروج از مدیریت

</button>

<br><br>

<div
id="adsContainer">

<div class="loading">
⏳ در حال دریافت درخواست‌های تبلیغاتی...
</div>

</div>

<a
class="back-btn"
href="/">

⬅️ بازگشت به صفحه اصلی

</a>

</div>

</div>


<script>

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";


/*
   این توکن فقط مخصوص همین پنل است.
   با arsin_user_token سایت کاری نداریم.
*/

let adminAccessToken = null;


/* -------------------------
   STATUS
------------------------- */

function showLoginStatus(text,type="info"){

const box =
document.getElementById("loginStatus");

box.textContent = text;

box.className =
"status " + type;

}


function showAdminStatus(text,type="success"){

const box =
document.getElementById("adminStatus");

box.textContent = text;

box.className =
"status " + type;

}


/* -------------------------
   LOGIN
------------------------- */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(event){

event.preventDefault();


const email =
document
.getElementById("adminEmail")
.value
.trim();


const password =
document
.getElementById("adminPassword")
.value;


const button =
document.getElementById("loginButton");


button.disabled = true;

button.textContent =
"⏳ در حال ورود...";

showLoginStatus(
"⏳ در حال بررسی اطلاعات ورود...",
"info"
);


try{

const response =
await fetch(
SUPABASE_URL +
"/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY
},

body:JSON.stringify({

email:email,

password:password

})
}
);


const data =
await response
.json()
.catch(()=>null);


if(!response.ok){

const raw =
(
data?.msg ||
data?.message ||
data?.error_description ||
data?.error ||
""
).toString()
.toLowerCase();


if(
raw.includes(
"invalid login credentials"
)
){

showLoginStatus(
"❌ ایمیل یا رمز عبور اشتباه است.",
"error"
);

}else if(
raw.includes(
"email not confirmed"
)
){

showLoginStatus(
"📧 ایمیل این حساب هنوز تأیید نشده است.",
"error"
);

}else{

showLoginStatus(
"❌ ورود انجام نشد. اطلاعات ورود را بررسی کن.",
"error"
);

}

button.disabled = false;

button.textContent =
"🔐 ورود به مدیریت تبلیغات";

return;

}


if(!data?.access_token){

showLoginStatus(
"❌ توکن ورود دریافت نشد.",
"error"
);

button.disabled = false;

button.textContent =
"🔐 ورود به مدیریت تبلیغات";

return;

}


/*
   توکن فقط در متغیر همین صفحه نگه داشته می‌شود.
*/

adminAccessToken =
data.access_token;


/*
   بررسی OWNER
*/

const owner =
await checkOwner();


if(!owner){

adminAccessToken = null;

button.disabled = false;

button.textContent =
"🔐 ورود به مدیریت تبلیغات";

return;

}


/*
   نمایش پنل
*/

document
.getElementById("loginCard")
.classList.add("hidden");

document
.getElementById("adminCard")
.classList.remove("hidden");


showAdminStatus(
"👑 ورود موفق بود. دسترسی OWNER تأیید شد.",
"success"
);


await loadAds();


}catch(error){

showLoginStatus(
"❌ اتصال به سرور برقرار نشد.",
"error"
);

button.disabled = false;

button.textContent =
"🔐 ورود به مدیریت تبلیغات";

}

});


/* -------------------------
   CHECK OWNER
------------------------- */

async function checkOwner(){

if(!adminAccessToken){

showLoginStatus(
"❌ توکن ورود پیدا نشد.",
"error"
);

return false;

}


try{

const userResponse =
await fetch(
SUPABASE_URL +
"/auth/v1/user",
{
method:"GET",

headers:{
"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
adminAccessToken
}
}
);


const userData =
await userResponse
.json()
.catch(()=>null);


if(!userResponse.ok){

showLoginStatus(
"❌ اطلاعات حساب دریافت نشد.",
"error"
);

return false;

}


const userId =
userData?.id;


if(!userId){

showLoginStatus(
"❌ شناسه حساب پیدا نشد.",
"error"
);

return false;

}


/*
   بررسی رتبه OWNER
*/

const ownerResponse =
await fetch(
SUPABASE_URL +
"/rest/v1/gang_users?id=eq." +
encodeURIComponent(userId) +
"&select=id,rank",
{
method:"GET",

headers:{
"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
adminAccessToken
}
}
);


const ownerData =
await ownerResponse
.json()
.catch(()=>null);


if(!ownerResponse.ok){

showLoginStatus(
"❌ خطا در بررسی دسترسی مدیر.",
"error"
);

return false;

}


if(
!Array.isArray(ownerData) ||
ownerData.length === 0
){

showLoginStatus(
"🚫 این حساب در سیستم ArsinGang ثبت نشده است.",
"error"
);

return false;

}


const rank =
(ownerData[0].rank || "")
.toString()
.toUpperCase();


if(rank !== "OWNER"){

showLoginStatus(
"🚫 این حساب دسترسی مدیریت تبلیغات را ندارد.",
"error"
);

return false;

}


return true;


}catch(error){

showLoginStatus(
"❌ خطا در بررسی حساب مدیر.",
"error"
);

return false;

}

}


/* -------------------------
   LOAD ADS
------------------------- */

async function loadAds(){

const container =
document.getElementById(
"adsContainer"
);


container.innerHTML = `
<div class="loading">
⏳ در حال دریافت درخواست‌های تبلیغاتی...
</div>
`;


try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/ads?status=eq.pending&order=created_at.desc&select=*",
{
method:"GET",

headers:{
"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
adminAccessToken
}
}
);


const data =
await response
.json()
.catch(()=>null);


if(!response.ok){

container.innerHTML = `
<div class="status error">
❌ دریافت درخواست‌های تبلیغاتی انجام نشد.
</div>
`;

return;

}


const ads =
Array.isArray(data)
? data
: [];


renderAds(ads);


}catch(error){

container.innerHTML = `
<div class="status error">
❌ اتصال به سرور برای دریافت تبلیغات برقرار نشد.
</div>
`;

}

}


/* -------------------------
   ESCAPE HTML
------------------------- */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* -------------------------
   RENDER ADS
------------------------- */

function renderAds(ads){

const container =
document.getElementById(
"adsContainer"
);


if(!ads.length){

container.innerHTML = `
<div class="empty">

🎉 در حال حاضر هیچ درخواست تبلیغاتی در انتظار بررسی نیست.

<br>

درخواست‌های جدید اینجا نمایش داده می‌شوند.

</div>
`;

return;

}


container.innerHTML =
ads.map(function(ad){

const image =
ad.image_url
? `
<img
class="ad-image"
src="${escapeHtml(ad.image_url)}"
alt="تصویر تبلیغ"
onerror="this.style.display='none';">
`
: "";


const description =
ad.description
? escapeHtml(ad.description)
: "توضیحی ثبت نشده است.";


const advertiser =
ad.advertiser_name
? escapeHtml(ad.advertiser_name)
: "ثبت نشده";


const email =
ad.advertiser_email
? escapeHtml(ad.advertiser_email)
: "ثبت نشده";


const duration =
ad.duration_days
? escapeHtml(ad.duration_days) +
" روز"
: "ثبت نشده";


const target =
ad.target_url
? `
<a
class="ad-link"
href="${escapeHtml(ad.target_url)}"
target="_blank"
rel="noopener noreferrer">

${escapeHtml(ad.target_url)}

</a>
`
: "ثبت نشده";


const created =
ad.created_at
? new Date(ad.created_at)
.toLocaleString("fa-IR")
: "ثبت نشده";


return `

<div
class="ad"
data-id="${escapeHtml(ad.id)}">

<h2>
📢 ${escapeHtml(ad.title)}
</h2>

<div class="ad-description">
${description}
</div>

${image}

<div class="info-box">

<div>
<strong>👤 تبلیغ‌دهنده:</strong>
${advertiser}
</div>

<div>
<strong>📧 ایمیل:</strong>
${email}
</div>

<div>
<strong>⏱️ مدت تبلیغ:</strong>
${duration}
</div>

<div>
<strong>🔗 لینک:</strong>
${target}
</div>

<div>
<strong>📅 زمان ارسال:</strong>
${created}
</div>

</div>

<div class="actions">

<button
class="action-btn approve-btn"
onclick="approveAd(${Number(ad.id)})">

✅ تأیید تبلیغ

</button>

<button
class="action-btn reject-btn"
onclick="rejectAd(${Number(ad.id)})">

❌ رد تبلیغ

</button>

<button
class="action-btn delete-btn"
onclick="deleteAd(${Number(ad.id)})">

🗑️ حذف

</button>

</div>

</div>

`;

}).join("");

}


/* -------------------------
   RPC
------------------------- */

async function callAdminFunction(
functionName,
adId
){

if(!adminAccessToken){

return {
ok:false,
data:{
message:"توکن مدیریت پیدا نشد."
}
};

}


try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/rpc/" +
functionName,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
adminAccessToken
},

body:JSON.stringify({
ad_id:adId
})
}
);


const data =
await response
.json()
.catch(()=>null);


return {

ok:response.ok,

status:response.status,

data:data

};


}catch(error){

return {

ok:false,

status:0,

data:{
message:
"اتصال به سرور برقرار نشد."
}

};

}

}


/* -------------------------
   APPROVE
------------------------- */

async function approveAd(adId){

if(
!confirm(
"آیا مطمئن هستید که می‌خواهید این تبلیغ را تأیید کنید؟"
)
){

return;

}


const result =
await callAdminFunction(
"approve_ad",
adId
);


if(!result.ok){

alert(
"❌ تأیید تبلیغ انجام نشد.\n\n" +
(
result.data?.message ||
result.data?.hint ||
"خطای نامشخص"
)
);

return;

}


alert(
"✅ تبلیغ با موفقیت تأیید شد."
);


await loadAds();

}


/* -------------------------
   REJECT
------------------------- */

async function rejectAd(adId){

if(
!confirm(
"آیا مطمئن هستید که می‌خواهید این تبلیغ را رد کنید؟"
)
){

return;

}


const result =
await callAdminFunction(
"reject_ad",
adId
);


if(!result.ok){

alert(
"❌ رد تبلیغ انجام نشد.\n\n" +
(
result.data?.message ||
result.data?.hint ||
"خطای نامشخص"
)
);

return;

}


alert(
"✅ تبلیغ با موفقیت رد شد."
);


await loadAds();

}


/* -------------------------
   DELETE
------------------------- */

async function deleteAd(adId){

if(
!confirm(
"⚠️ آیا مطمئن هستید که می‌خواهید این درخواست را حذف کنید؟"
)
){

return;

}


const result =
await callAdminFunction(
"delete_ad",
adId
);


if(!result.ok){

alert(
"❌ حذف درخواست انجام نشد.\n\n" +
(
result.data?.message ||
result.data?.hint ||
"خطای نامشخص"
)
);

return;

}


alert(
"🗑️ درخواست با موفقیت حذف شد."
);


await loadAds();

}


/* -------------------------
   LOGOUT
------------------------- */

function logout(){

adminAccessToken = null;

document
.getElementById("adminCard")
.classList.add("hidden");

document
.getElementById("loginCard")
.classList.remove("hidden");

document
.getElementById("adminPassword")
.value = "";

showLoginStatus(
"🚪 از مدیریت تبلیغات خارج شدی.",
"info"
);

}


/* -------------------------
   START
------------------------- */

document
.getElementById("adsContainer")
.innerHTML = "";

</script>

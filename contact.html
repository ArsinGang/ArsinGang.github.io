<style> * { box-sizing: border-box; } html { scroll-behavior: smooth; } body { margin: 0; min-height: 100vh; font-family: Arial, Tahoma, sans-serif; color: white; text-align: center; background: radial-gradient( circle at 15% 20%, rgba(130,40,255,.30), transparent 35% ), radial-gradient( circle at 85% 80%, rgba(0,220,255,.20), transparent 35% ), linear-gradient( 135deg, #080014, #18002d, #001522 ); overflow-x: hidden; } /* نور پس‌زمینه */ body::before { content: ""; position: fixed; width: 350px; height: 350px; top: -120px; left: -120px; background: rgba(123,44,255,.18); filter: blur(100px); border-radius: 50%; pointer-events: none; } body::after { content: ""; position: fixed; width: 350px; height: 350px; bottom: -120px; right: -120px; background: rgba(0,220,255,.14); filter: blur(100px); border-radius: 50%; pointer-events: none; } /* صفحه */ .container { width: 90%; max-width: 720px; margin: auto; padding: 65px 20px 45px; } /* لوگو */ .logo { width: 105px; height: 105px; margin: auto; display: flex; align-items: center; justify-content: center; border-radius: 28px; font-size: 38px; font-weight: 900; letter-spacing: 2px; background: linear-gradient( 135deg, #7b2cff, #00d9ff ); box-shadow: 0 0 25px rgba(123,44,255,.55), 0 0 60px rgba(0,217,255,.20); animation: logoGlow 3s infinite alternate; } @keyframes logoGlow { from { transform: translateY(0); box-shadow: 0 0 25px rgba(123,44,255,.55), 0 0 60px rgba(0,217,255,.20); } to { transform: translateY(-5px); box-shadow: 0 0 40px rgba(123,44,255,.75), 0 0 80px rgba(0,217,255,.30); } } /* عنوان */ h1 { font-size: 48px; margin: 22px 0 10px; font-weight: 900; background: linear-gradient( 90deg, #ffffff, #b987ff, #45eaff ); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } /* توضیحات */ .subtitle { color: #d8d2e8; font-size: 19px; line-height: 1.8; margin-bottom: 35px; } /* فرم */ .form-box { padding: 28px; border-radius: 22px; background: rgba(20,15,40,.82); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 0 30px rgba(123,44,255,.18); backdrop-filter: blur(10px); } /* ورودی‌ها */ .input-group { text-align: right; margin-bottom: 20px; } .input-group label { display: block; margin-bottom: 8px; color: #eee; font-size: 16px; font-weight: bold; } .input-group input, .input-group textarea { width: 100%; padding: 15px; border-radius: 13px; border: 1px solid rgba(255,255,255,.12); outline: none; background: rgba(5,5,20,.70); color: white; font-family: Arial, Tahoma, sans-serif; font-size: 16px; transition: border .25s, box-shadow .25s; } .input-group textarea { min-height: 150px; resize: vertical; } .input-group input:focus, .input-group textarea:focus { border-color: rgba(123,44,255,.75); box-shadow: 0 0 18px rgba(123,44,255,.25); } /* دکمه */ .submit-button { width: 100%; padding: 17px; border: none; border-radius: 15px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; background: linear-gradient( 135deg, #7b2cff, #00bde8 ); box-shadow: 0 0 25px rgba(123,44,255,.35); transition: transform .25s, box-shadow .25s, opacity .25s; } .submit-button:hover { transform: translateY(-3px); box-shadow: 0 0 35px rgba(123,44,255,.60); } .submit-button:disabled { opacity: .6; cursor: wait; } /* پیام وضعیت */ .status { margin-top: 20px; font-size: 16px; line-height: 1.9; display: none; } /* موفقیت */ .success-box { display: none; padding: 30px; border-radius: 22px; background: rgba(20,15,40,.88); border: 1px solid rgba(0,220,255,.30); box-shadow: 0 0 35px rgba(0,220,255,.18); line-height: 2; } .ticket-code { display: inline-block; margin: 12px 0; padding: 10px 18px; border-radius: 12px; background: rgba(123,44,255,.20); border: 1px solid rgba(123,44,255,.45); color: #cda8ff; font-size: 22px; font-weight: bold; direction: ltr; } /* بازگشت */ .back-button { display: inline-block; margin-top: 25px; padding: 14px 22px; border-radius: 14px; color: white; text-decoration: none; font-weight: bold; background: rgba(20,15,40,.82); border: 1px solid rgba(255,255,255,.12); transition: transform .25s, box-shadow .25s; } .back-button:hover { transform: translateY(-3px); box-shadow: 0 0 25px rgba(123,44,255,.40); } /* فوتر */ .footer { margin-top: 40px; color: #77718a; font-size: 14px; } /* موبایل */ @media (max-width: 600px) { .container { padding-top: 45px; } .logo { width: 90px; height: 90px; font-size: 32px; } h1 { font-size: 38px; } .subtitle { font-size: 17px; } .form-box { padding: 20px; } } </style>

<body>

<div class="container">

<!-- لوگو -->

<div class="logo">
    AG
</div>


<!-- عنوان -->

<h1>
    پشتیبانی ArsinGang
</h1>


<!-- توضیحات -->

<div class="subtitle">

    مشکلی داری؟ 💜

    <br>

    پیامت رو بنویس تا بررسیش کنیم 🎮

</div>


<!-- فرم -->

<div class="form-box" id="formBox">

    <form id="ticketForm">

        <div class="input-group">

            <label>
                👤 نام یا یوزرنیم
            </label>

            <input
                type="text"
                id="name"
                required
                maxlength="100"
                placeholder="نام یا یوزرنیم شما">

        </div>


        <div class="input-group">

            <label>
                📧 ایمیل
            </label>

            <input
                type="email"
                id="email"
                required
                maxlength="200"
                placeholder="example@email.com">

        </div>


        <div class="input-group">

            <label>
                💬 پیام شما
            </label>

            <textarea
                id="message"
                required
                maxlength="5000"
                placeholder="پیامت رو اینجا بنویس..."></textarea>

        </div>


        <button
            type="submit"
            class="submit-button"
            id="submitButton">

            📨 ارسال پیام

        </button>

    </form>


    <div
        class="status"
        id="status">
    </div>

</div>


<!-- پیام موفقیت -->

<div
    class="success-box"
    id="successBox">

    <div style="font-size:25px; font-weight:bold;">
        ✅ پیام شما با موفقیت ارسال شد!
    </div>

    <div>
        🎫 کد پیگیری تیکت:
    </div>

    <div
        class="ticket-code"
        id="ticketCode">
    </div>

    <div>
        📧 پاسخ تیکت شما تا ۷۲ ساعت دیگر در ایمیل می‌رسد.
    </div>

</div>


<!-- بازگشت -->

<a
    class="back-button"
    href="index.html">

    ← بازگشت به سایت

</a>


<!-- فوتر -->

<div class="footer">

    ArsinGang 🎮💜

    <br>

    © 2026 ArsinGang

</div>

</div>

<script> /* اطلاعات Supabase */ const SUPABASE_URL = "https://lhddjuomukejpvssyhuv.supabase.co"; const SUPABASE_KEY = "sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5"; /* عناصر صفحه */ const form = document.getElementById("ticketForm"); const formBox = document.getElementById("formBox"); const successBox = document.getElementById("successBox"); const status = document.getElementById("status"); const submitButton = document.getElementById("submitButton"); const ticketCode = document.getElementById("ticketCode"); /* ساخت کد پیگیری */ function createTicketCode() { const random = Math.floor( 1000 + Math.random() * 9000 ); return "AG-" + random; } /* ارسال تیکت */ form.addEventListener( "submit", async function(event) { event.preventDefault(); status.style.display = "none"; submitButton.disabled = true; submitButton.textContent = "⏳ در حال ارسال..."; const name = document.getElementById("name").value.trim(); const email = document.getElementById("email").value.trim(); const message = document.getElementById("message").value.trim(); const code = createTicketCode(); try { const response = await fetch( SUPABASE_URL + "/rest/v1/tickets", { method: "POST", headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Prefer": "return=minimal" }, body: JSON.stringify({ ticket_code: code, name: name, email: email, message: message, status: "open" }) } ); if (!response.ok) { const errorText = await response.text(); throw new Error( errorText || "خطا در ارسال تیکت" ); } /* نمایش موفقیت */ formBox.style.display = "none"; ticketCode.textContent = code; successBox.style.display = "block"; form.reset(); } catch (error) { console.error( "Ticket Error:", error ); status.innerHTML = "❌ ارسال تیکت انجام نشد.<br>" + "لطفاً دوباره تلاش کنید."; status.style.display = "block"; } finally { submitButton.disabled = false; submitButton.textContent = "📨 ارسال پیام"; } } ); </script>

</body>

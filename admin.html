}

.ticket-button:disabled{

}

}

</h1>

🎫 پنل پشتیبانی ArsinGang
</div>

</div>


<div class="login-box" id="loginBox">

<h2>
🔐 ورود مدیر
</h2>

<p style="color:#aaa;">
برای مشاهده تیکت‌های کاربران وارد شوید.
</p>

<input
class="input"
type="email"
id="loginEmail"
placeholder="ایمیل"
autocomplete="email"
>

<input
class="input"
type="password"
id="loginPassword"
placeholder="رمز عبور"
autocomplete="current-password"
>

class="button"
id="loginButton"
type="button"
>
🔐 ورود به پنل

class="error"

class="small-button"
id="refreshButton"
type="button"
>
🔄 بروزرسانی
</button>

class="small-button"
id="logoutButton"
type="button"
>
🚪 خروج
</button>

</div>

</div>

class="ticket-count"
id="ticketCount">
</div>

id="ticketsContainer">

⏳ در حال دریافت تیکت‌ها...
</div>

</div>

<script>

const SUPABASE_URL =
"https://lhddjuomukejpvssyhuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BL17d9ub-AeaHb8upwVKag_aqjJSQt5";


const loginBox =
document.getElementById("loginBox");

const dashboard =
document.getElementById("dashboard");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const refreshButton =
document.getElementById("refreshButton");

const loginError =
document.getElementById("loginError");

const ticketsContainer =
document.getElementById("ticketsContainer");

const ticketCount =
document.getElementById("ticketCount");

const adminEmail =
document.getElementById("adminEmail");


let accessToken =
localStorage.getItem("arsin_admin_token");

let refreshToken =
localStorage.getItem("arsin_admin_refresh_token");


/* خطای ورود */

function showLoginError(message){

loginError.textContent =
message;

loginError.style.display =
"block";

}


/* ذخیره توکن‌ها */

function saveTokens(data,email){

accessToken =
data.access_token;

refreshToken =
data.refresh_token;

localStorage.setItem(
"arsin_admin_token",
accessToken
);

if(refreshToken){

localStorage.setItem(
"arsin_admin_refresh_token",
refreshToken
);

}

localStorage.setItem(
"arsin_admin_email",
email
);

}


/* حذف اطلاعات ورود */

function clearAuth(){

accessToken=null;
refreshToken=null;

localStorage.removeItem(
"arsin_admin_token"
);

localStorage.removeItem(
"arsin_admin_refresh_token"
);

localStorage.removeItem(
"arsin_admin_email"
);

}


/* گرفتن توکن جدید */

async function refreshAccessToken(){

if(!refreshToken){

return false;

}

try{

const response =
await fetch(
SUPABASE_URL +
"/auth/v1/token?grant_type=refresh_token",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY
},

body:JSON.stringify({
refresh_token:
refreshToken
})

}
);


const data =
await response.json();


if(!response.ok){

console.error(
"Refresh Token Error:",
data
);

clearAuth();

return false;

}


/*
Supabase ممکن است refresh token جدید
هم برگرداند.
*/

accessToken =
data.access_token;

if(data.refresh_token){

refreshToken =
data.refresh_token;

}


localStorage.setItem(
"arsin_admin_token",
accessToken
);

if(refreshToken){

localStorage.setItem(
"arsin_admin_refresh_token",
refreshToken
);

}

return true;


}catch(error){

console.error(
"Refresh Error:",
error
);

return false;

}

}


/*
درخواست API با توکن فعلی.
اگر JWT منقضی شده باشد،
یک بار توکن را Refresh می‌کند
و درخواست را دوباره انجام می‌دهد.
*/

async function authenticatedFetch(
url,
options={}
){

options.headers =
options.headers || {};


/* هدرهای لازم */

options.headers["apikey"] =
SUPABASE_KEY;

options.headers["Authorization"] =
"Bearer " + accessToken;


/* درخواست اول */

let response =
await fetch(
url,
options
);


/*
اگر JWT منقضی شده باشد،
توکن جدید بگیر.
*/

if(response.status === 401){

const refreshed =
await refreshAccessToken();


if(!refreshed){

clearAuth();

showLogin();

throw new Error(
"نشست مدیر منقضی شده است. دوباره وارد شوید."
);

}


/* توکن جدید */

options.headers["Authorization"] =
"Bearer " + accessToken;


/* تلاش دوباره */

response =
await fetch(
url,
options
);

}


return response;

}


/* نمایش صفحه ورود */

function showLogin(){

dashboard.style.display =
"none";

loginBox.style.display =
"block";

}


/* ورود مدیر */

loginButton.addEventListener(
"click",
async function(){

loginError.style.display =
"none";

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;


if(!email || !password){

showLoginError(
"❌ ایمیل و رمز عبور را وارد کنید."
);

return;

}


loginButton.disabled =
true;

loginButton.textContent =
"⏳ در حال ورود...";


try{

const response =
await fetch(
SUPABASE_URL +
"/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY
},

body:JSON.stringify({
email:email,
password:password
})

}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
data.message ||
"خطای ناشناخته در ورود"
);

}


/* ذخیره access + refresh token */

saveTokens(
data,
email
);


showDashboard(email);

await loadTickets();


}catch(error){

console.error(
"Login Error:",
error
);

showLoginError(
"❌ خطای ورود: " +
error.message
);

}finally{

loginButton.disabled =
false;

loginButton.textContent =
"🔐 ورود به پنل";

}

});


/* نمایش داشبورد */

function showDashboard(email){

loginBox.style.display =
"none";

dashboard.style.display =
"block";

adminEmail.textContent =
email;

}


/* دریافت تیکت‌ها */

async function loadTickets(){

ticketsContainer.innerHTML =
'<div class="loading">⏳ در حال دریافت تیکت‌ها...</div>';


try{

const response =
await authenticatedFetch(
SUPABASE_URL +
"/rest/v1/tickets?select=*&order=created_at.desc",
{
method:"GET"
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.message ||
data.error_description ||
data.error ||
"خطا در دریافت تیکت‌ها"
);

}


renderTickets(data);


}catch(error){

console.error(
"Tickets Error:",
error
);


ticketsContainer.innerHTML = `

<div class="empty">

❌ دریافت تیکت‌ها انجام نشد.

<br><br>

${escapeHTML(error.message)}

</div>

`;

}

}


/* نمایش تیکت‌ها */

function renderTickets(tickets){

ticketCount.textContent =
`🎫 تعداد تیکت‌ها: ${tickets.length}`;


if(!tickets.length){

ticketsContainer.innerHTML = `

<div class="empty">

📭 هنوز هیچ تیکتی ثبت نشده است.

</div>

`;

return;

}


ticketsContainer.innerHTML =
"";


tickets.forEach(
function(ticket){

const ticketElement =
document.createElement("div");

ticketElement.className =
"ticket";


const createdDate =
ticket.created_at
?
new Date(
ticket.created_at
).toLocaleString("fa-IR")
:
"نامشخص";


let statusText =
"باز";

let statusClass =
"status-open";

let statusIcon =
"🟢";


if(ticket.status==="answered"){

statusText =
"تیکت پاسخ داده شده";

statusClass =
"status-answered";

statusIcon =
"🔵";

}


if(ticket.status==="closed"){

statusText =
"بسته شده";

statusClass =
"status-closed";

statusIcon =
"🔒";

}


const existingReply =
ticket.admin_reply
?

`

<div class="existing-reply">

<div class="existing-reply-title">
💬 پاسخ پشتیبانی
</div>

<div class="reply-message">
${escapeHTML(ticket.admin_reply)}
</div>

</div>

`

:"";


const canReply =
ticket.status!=="closed";


const replyArea =
canReply

?

`

<div class="reply-title">
✍️ پاسخ به تیکت
</div>

<textarea
class="reply-box"
id="reply-${ticket.id}"
placeholder="پاسخ خود را برای کاربر بنویسید..."
></textarea>

<div class="action-buttons">

<button
class="ticket-button reply-button"
onclick="answerTicket(${ticket.id})"
>
💬 ثبت پاسخ
</button>

<button
class="ticket-button close-button"
onclick="closeTicket(${ticket.id})"
>
🔒 بستن تیکت
</button>

</div>

<div
class="ticket-success"
id="success-${ticket.id}">
</div>

<div
class="ticket-error"
id="error-${ticket.id}">
</div>

`

:

`

<div class="action-buttons">

<button
class="ticket-button reopen-button"
onclick="reopenTicket(${ticket.id})"
>
🔓 باز کردن دوباره تیکت
</button>

</div>

<div
class="ticket-success"
id="success-${ticket.id}">
</div>

<div
class="ticket-error"
id="error-${ticket.id}">
</div>

`;


ticketElement.innerHTML = `

<div class="ticket-header">

<div class="ticket-code">

🎫 ${escapeHTML(ticket.ticket_code)}

</div>

<div class="status ${statusClass}">

${statusIcon}
${escapeHTML(statusText)}

</div>

</div>


<div class="info">

<div class="info-item">

<div class="info-title">
👤 نام / یوزرنیم
</div>

<div class="info-value">
${escapeHTML(ticket.name)}
</div>

</div>


<div class="info-item">

<div class="info-title">
📧 ایمیل
</div>

<div class="info-value email-value">
${escapeHTML(ticket.email)}
</div>

</div>


<div class="info-item">

<div class="info-title">
🕐 تاریخ ارسال
</div>

<div class="info-value">
${escapeHTML(createdDate)}
</div>

</div>


<div class="info-item">

<div class="info-title">
📌 وضعیت
</div>

<div class="info-value">
${escapeHTML(statusText)}
</div>

</div>

</div>


<div class="message-title">
💬 پیام کاربر
</div>

<div class="message">
${escapeHTML(ticket.message)}
</div>


${existingReply}

${replyArea}

`;


ticketsContainer.appendChild(
ticketElement
);

}

);

}


/* پاسخ دادن */

async function answerTicket(ticketId){

const replyBox =
document.getElementById(
"reply-"+ticketId
);

const successBox =
document.getElementById(
"success-"+ticketId
);

const errorBox =
document.getElementById(
"error-"+ticketId
);


const reply =
replyBox
?
replyBox.value.trim()
:
"";


successBox.style.display =
"none";

errorBox.style.display =
"none";


if(!reply){

errorBox.textContent =
"❌ لطفاً متن پاسخ را وارد کنید.";

errorBox.style.display =
"block";

return;

}


try{

const response =
await authenticatedFetch(

SUPABASE_URL +
"/rest/v1/tickets?id=eq." +
ticketId,

{
method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=minimal"
},

body:JSON.stringify({

admin_reply:
reply,

status:
"answered",

replied_at:
new Date().toISOString()

})

}

);


const data =
await response.text();


if(!response.ok){

throw new Error(
data ||
"خطا در ثبت پاسخ"
);

}


successBox.textContent =
"✅ پاسخ ثبت شد و وضعیت تیکت به «تیکت پاسخ داده شده» تغییر کرد.";

successBox.style.display =
"block";


await loadTickets();


}catch(error){

console.error(
"Answer Error:",
error
);


errorBox.textContent =
"❌ ثبت پاسخ انجام نشد: " +
error.message;

errorBox.style.display =
"block";

}

}


/* بستن دستی تیکت */

async function closeTicket(ticketId){

const confirmed =
confirm(
"آیا مطمئن هستید که می‌خواهید این تیکت را ببندید؟"
);


if(!confirmed){
return;
}


const successBox =
document.getElementById(
"success-"+ticketId
);

const errorBox =
document.getElementById(
"error-"+ticketId
);


try{

const response =
await authenticatedFetch(

SUPABASE_URL +
"/rest/v1/tickets?id=eq." +
ticketId,

{
method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=minimal"
},

body:JSON.stringify({
status:"closed"
})

}

);


const data =
await response.text();


if(!response.ok){

throw new Error(
data ||
"خطا در بستن تیکت"
);

}


successBox.textContent =
"🔒 تیکت با موفقیت بسته شد.";

successBox.style.display =
"block";


await loadTickets();


}catch(error){

console.error(
"Close Error:",
error
);


errorBox.textContent =
"❌ بستن تیکت انجام نشد: " +
error.message;

errorBox.style.display =
"block";

}

}

);

}


/* امنیت HTML */

function escapeHTML(value){

if(
value===null ||
value===undefined
){

return "";

}


return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* بروزرسانی */

refreshButton.addEventListener(
"click",
async function(){

refreshButton.disabled =
true;

refreshButton.textContent =
"⏳ دریافت...";


await loadTickets();

false;

refreshButton.textContent =

}

);


/* خروج */

logoutButton.addEventListener(
"click",
async function(){

if(accessToken){

try{

await fetch(

SUPABASE_URL +
"/auth/v1/logout",

{
method:"POST",

headers:{
"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+accessToken
}

}

);

}catch(error){

console.error(error);

}

}


clearAuth();

showLogin();

document.getElementById(
"loginPassword"
).value="";

}

);


/* ورود قبلی */

if(accessToken){

const savedEmail =
localStorage.getItem(
"arsin_admin_email"
);


showDashboard(
savedEmail || "مدیر"
);


loadTickets();

}else{

showLogin();

}

</script>
